<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clov - 알림</title>
    <style>
        :root {
            --bg-color: #cbdad2;
            --card-bg: #ffffff;
            --text-color: #2c3e35;
            --text-muted: #61766a;
            --border-color: #eef2f0;
            --primary-green: #1b4332;
            --accent-green: #52b788;
            --btn-hover: #357a58;
            --input-bg: #fafbfc;
            --btn-secondary-bg: rgba(0,0,0,0.05);
        }

        body.dark-mode {
            --bg-color: #090d0a;
            --card-bg: #151f18;
            --text-color: #f0fdf4;
            --text-muted: #86efac;
            --border-color: #1e2f24;
            --primary-green: #007c2e;
            --accent-green: #4ade80;
            --btn-hover: #16a34a;
            --input-bg: #0d1510;
            --btn-secondary-bg: rgba(255,255,255,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeUp 0.6s ease-out;
            min-height: 500px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: var(--text-color);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: var(--text-muted);
            text-align: center;
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
    <link rel="stylesheet" href="../02-main/css/global-theme.css">
    <script id="dark-mode-init">
        const urlParamsTheme = new URLSearchParams(window.location.search);
        const themeParam = urlParamsTheme.get('theme');
        let isDark = false;
        
        if (themeParam === 'dark') {
            isDark = true;
        } else if (themeParam === 'light') {
            isDark = false;
        } else {
            isDark = localStorage.getItem('clov_darkMode') === 'true';
        }

        if (isDark) {
            document.documentElement.classList.add('dark-mode');
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('dark-mode');
            });
        }
    </script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span> 알림</h1>
        <button class="back-btn" onclick="goBack()">✕ 닫기</button>
    </div>

    <div class="tabs" style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button id="tab-admin" onclick="switchNotiTab('admin')" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--primary-green); background: var(--primary-green); color: white; font-weight: bold; cursor: pointer; transition: all 0.2s;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><path d="M3 11v2a1 1 0 0 0 1 1h2l4 4V6l-4 4H4a1 1 0 0 0-1 1z"/><path d="M15 8a4 4 0 0 1 0 8M18 5a8 8 0 0 1 0 14"/></svg>관리진 공지</button>
        <button id="tab-friends" onclick="switchNotiTab('friends')" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-muted); font-weight: bold; cursor: pointer; transition: all 0.2s;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>친구들 알림</button>
        <button id="tab-join" onclick="switchNotiTab('join')" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-muted); font-weight: bold; cursor: pointer; transition: all 0.2s;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.2 2.8-5.5 6.5-5.5s6.5 2.3 6.5 5.5"/><path d="M18 9v5M20.5 11.5h-5"/></svg>가입 신청 <span id="noti-page-join-count" style="display:none; background:#e55; color:#fff; border-radius:10px; padding:1px 6px; font-size:10px; margin-left:4px;">0</span></button>
    </div>

    <div id="content-admin">
        <div style="background: rgba(82, 183, 136, 0.1); border-left: 4px solid var(--primary-green); padding: 16px; border-radius: 8px; margin-bottom: 12px; transition: transform 0.2s;">
            <div style="font-weight: bold; color: var(--primary-green); margin-bottom: 6px;">[업데이트] ➕ 새로운 방 추가 기능이 적용되었습니다!</div>
            <div style="font-size: 13px; color: var(--text-color); line-height: 1.5;">이제 번거로운 친구 초대코드 대신 <b>'새로운 방 추가'</b> 기능을 통해 코드를 적고 간편하게 방에 접속할 수 있습니다. 메인 화면의 프로필 메뉴를 확인해 보세요!</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">2026. 06. 30</div>
        </div>
        <div style="background: rgba(82, 183, 136, 0.1); border-left: 4px solid var(--primary-green); padding: 16px; border-radius: 8px; transition: transform 0.2s;">
            <div style="font-weight: bold; color: var(--primary-green); margin-bottom: 6px;">[공지] Clov v2.0 정식 오픈 안내 🎉</div>
            <div style="font-size: 13px; color: var(--text-color); line-height: 1.5;">일대일 단짝 연동 기능과 다크 모드 동기화 기능이 대폭 개선되었습니다. 더욱 안정적인 환경에서 소중한 추억을 기록해 보세요.</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">2026. 06. 29</div>
        </div>
    </div>

    <div id="content-friends" style="display: none;">
        <div class="empty-state">
            <div class="icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 14l9-5.5"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg></div>
            <p>새로운 친구 알림이 없습니다.</p>
        </div>
    </div>

    <div id="content-join" style="display: none;"></div>
</div>

<script src="../02-main/components/clov-modal.js"></script>
<script>
    function switchNotiTab(tab) {
        const btnAdmin = document.getElementById('tab-admin');
        const btnFriends = document.getElementById('tab-friends');
        const btnJoin = document.getElementById('tab-join');
        const contentAdmin = document.getElementById('content-admin');
        const contentFriends = document.getElementById('content-friends');
        const contentJoin = document.getElementById('content-join');

        [btnAdmin, btnFriends, btnJoin].forEach(b => {
            if(b) {
                b.style.background = 'var(--card-bg)';
                b.style.color = 'var(--text-muted)';
                b.style.borderColor = 'var(--border-color)';
            }
        });
        [contentAdmin, contentFriends, contentJoin].forEach(c => { if(c) c.style.display = 'none'; });

        if (tab === 'admin') {
            btnAdmin.style.background = 'var(--primary-green)';
            btnAdmin.style.color = 'white';
            btnAdmin.style.borderColor = 'var(--primary-green)';
            contentAdmin.style.display = 'block';
        } else if (tab === 'friends') {
            btnFriends.style.background = 'var(--primary-green)';
            btnFriends.style.color = 'white';
            btnFriends.style.borderColor = 'var(--primary-green)';
            contentFriends.style.display = 'block';
            renderFriendsNotifications();
        } else if (tab === 'join') {
            if(btnJoin) {
                btnJoin.style.background = 'var(--primary-green)';
                btnJoin.style.color = 'white';
                btnJoin.style.borderColor = 'var(--primary-green)';
            }
            if(contentJoin) contentJoin.style.display = 'block';
            renderJoinNotifications();
        }
    }

    function renderFriendsNotifications() {
        const contentFriends = document.getElementById('content-friends');
        let groupsData = {};
        try {
            groupsData = JSON.parse(localStorage.getItem('clov_groupsData')) || {};
        } catch(e) {}
        
        const activeGroup = new URLSearchParams(window.location.search).get('groupId') || localStorage.getItem('clov_activeGroup') || 'friend';
        const notiList = (groupsData[activeGroup] && groupsData[activeGroup].notifications) ? groupsData[activeGroup].notifications : [];
        
        let reqList = [];
        try { reqList = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
        const pendingReqs = reqList.filter(r => r.status === 'pending');
        let joinBanner = '';
        if (pendingReqs.length > 0) {
            joinBanner = `
                <div style="background: rgba(238, 85, 85, 0.1); border: 1.5px solid #e55; padding: 16px; border-radius: 8px; text-align: left; margin-bottom: 14px; cursor: pointer;" onclick="switchNotiTab('join')">
                    <div style="font-weight: bold; color: #e55; margin-bottom: 6px; display:flex; justify-content:space-between;">
                        <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.2 2.8-5.5 6.5-5.5s6.5 2.3 6.5 5.5"/><path d="M18 9v5M20.5 11.5h-5"/></svg>대기 중인 가입 신청이 ${pendingReqs.length}건 있습니다!</span>
                        <span style="background:#e55; color:white; padding:2px 8px; border-radius:10px; font-size:11px;">클릭하여 확인</span>
                    </div>
                    <div style="font-size: 13px; color: var(--text-color);">참여 멤버 중 1명이 수락하면 새 멤버가 우정공간에 입장합니다.</div>
                </div>
            `;
        }

        if (notiList.length === 0 && pendingReqs.length === 0) {
            contentFriends.innerHTML = `
                <div class="empty-state">
                    <div class="icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 14l9-5.5"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg></div>
                    <p>새로운 친구 알림이 없습니다.</p>
                </div>
            `;
            return;
        }
        
        let html = '<div style="display: flex; flex-direction: column; gap: 12px;">';
        notiList.forEach(n => {
            const bg = n.isRead ? 'transparent' : 'rgba(82, 183, 136, 0.1)';
            const border = n.isRead ? '1px solid var(--border-color)' : '1px solid var(--primary-green)';
            const newBadge = n.isRead ? '' : ' <span style="color:red; font-size:10px; vertical-align:top; font-weight:bold;">NEW</span>';
            html += `
                <div style="background: ${bg}; border: ${border}; padding: 16px; border-radius: 8px; text-align: left; transition: transform 0.2s;">
                    <div style="font-weight: bold; color: var(--text-color); margin-bottom: 6px;">${n.title}${newBadge}</div>
                    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.5;">${n.message}</div>
                    <div style="font-size: 11px; color: var(--text-muted);">${n.date}</div>
                </div>
            `;
        });
        html += '</div>';
        contentFriends.innerHTML = joinBanner + html;
        
        let changed = false;
        notiList.forEach(n => {
            if (!n.isRead) {
                n.isRead = true;
                changed = true;
            }
        });
        if (changed) {
            localStorage.setItem('clov_groupsData', JSON.stringify(groupsData));
        }
    }

    function renderJoinNotifications() {
        const el = document.getElementById('content-join');
        if(!el) return;
        let list = [];
        try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
        const pending = list.filter(r => r.status === 'pending');
        
        const badge = document.getElementById('noti-page-join-count');
        if (badge) {
            badge.textContent = pending.length;
            badge.style.display = pending.length > 0 ? 'inline-block' : 'none';
        }

        if (!list.length) {
            el.innerHTML = `
                <div class="empty-state">
                    <div class="icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 14l9-5.5"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg></div>
                    <p>대기 중인 가입 신청이 없습니다.</p>
                </div>
            `;
            return;
        }

        let html = '<div style="display: flex; flex-direction: column; gap: 14px;">';
        list.forEach(req => {
            if (req.status === 'accepted') {
                html += `
                    <div style="border: 1px solid var(--border-color); background: var(--card-bg); opacity: 0.85; padding: 16px; border-radius: 10px; text-align:left;">
                        <div style="font-size:13px; font-weight:700; color:var(--text-muted); display:flex; justify-content:space-between;">
                            <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px;"><path d="M20 6 9 17l-5-5"/></svg>가입 수락 완료</span><span style="font-size:11px;">${req.date}</span>
                        </div>
                        <div style="font-size:14px; color:var(--text-color); margin-top:8px;"><b>${req.name}</b> 님이 참여 멤버로 합류했습니다.</div>
                    </div>
                `;
                return;
            }
            if (req.status === 'rejected') {
                html += `
                    <div style="border: 1px solid var(--border-color); background: var(--card-bg); opacity: 0.6; padding: 16px; border-radius: 10px; text-align:left;">
                        <div style="font-size:13px; font-weight:700; color:var(--text-muted); display:flex; justify-content:space-between;">
                            <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px;"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg>가입 거절됨</span><span style="font-size:11px;">${req.date}</span>
                        </div>
                        <div style="font-size:14px; color:var(--text-muted); margin-top:8px;"><b>${req.name}</b> 님의 가입 신청이 거절되었습니다.</div>
                    </div>
                `;
                return;
            }
            html += `
                <div id="req-card-${req.id}" style="border: 1.5px solid var(--primary-green); background: rgba(82,183,136,.08); padding: 18px; border-radius: 12px; text-align:left;">
                    <div style="font-size:14px; font-weight:800; color:var(--primary-green); display:flex; justify-content:space-between; margin-bottom:8px;">
                        <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.2 2.8-5.5 6.5-5.5s6.5 2.3 6.5 5.5"/><path d="M18 9v5M20.5 11.5h-5"/></svg>우정공간 가입 신청 <span style="background:#e55; color:#fff; padding:2px 6px; border-radius:10px; font-size:10px;">NEW</span></span>
                        <span style="font-size:11px; color:var(--text-muted); font-weight:normal;">${req.date}</span>
                    </div>
                    <div style="font-size:14px; color:var(--text-color); margin:10px 0 14px; line-height:1.5;">
                        <strong style="font-size:16px;">${req.name}</strong> 님이 우정공간(<strong>${req.code}</strong>) 입장을 신청했습니다.<br>
                        <div style="margin-top:8px; padding:8px 12px; background:rgba(27,67,50,.06); border-radius:8px; font-size:12px; color:var(--text-muted);">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:2px;"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg> <strong>방장 권한 없음:</strong> 참여 멤버 중 1명만 수락해도 즉시 방에 입장할 수 있습니다.
                        </div>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <button onclick="acceptPageJoinRequest('${req.id}', '${req.name}')" style="flex:1; padding:12px; background:var(--primary-green); color:#fff; border:none; border-radius:10px; font-weight:750; cursor:pointer; font-size:14px; box-shadow:0 3px 10px rgba(27,67,50,.25);"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><path d="M20 6 9 17l-5-5"/></svg>수락하고 입장시키기</button>
                        <button onclick="rejectPageJoinRequest('${req.id}', '${req.name}')" style="padding:12px 18px; background:var(--card-bg); color:var(--text-muted); border:1px solid var(--border-color); border-radius:10px; font-weight:600; cursor:pointer; font-size:14px;">거절</button>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        el.innerHTML = html;
    }

    function acceptPageJoinRequest(id, name) {
        let list = [];
        try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
        list.forEach(r => { if (r.id === id) r.status = 'accepted'; });
        localStorage.setItem('clov_joinRequests', JSON.stringify(list));

        let members = [];
        try { members = JSON.parse(localStorage.getItem('clov_acceptedMembers')) || []; } catch(e){}
        if (members.indexOf(name) === -1) {
            members.push(name);
            localStorage.setItem('clov_acceptedMembers', JSON.stringify(members));
        }

        renderJoinNotifications();
        if (typeof clovAlert === 'function') {
            clovAlert(`🎉 [${name}] 님의 가입 신청을 수락했습니다!\n이제 참여 멤버로 우정공간에 접속하여 함께 활동할 수 있습니다.\n(방장이 없으므로 참여 멤버 누구나 수락 권한을 가집니다)`, { icon: '🤝', type: 'success' });
        } else {
            alert(`[${name}] 님의 가입 신청을 수락했습니다.`);
        }
    }

    function rejectPageJoinRequest(id, name) {
        let list = [];
        try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
        list.forEach(r => { if (r.id === id) r.status = 'rejected'; });
        localStorage.setItem('clov_joinRequests', JSON.stringify(list));

        renderJoinNotifications();
        if (typeof clovAlert === 'function') {
            clovAlert(`❌ [${name}] 님의 가입 신청을 거절했습니다.`, { icon: '🚫', type: 'warn' });
        } else {
            alert(`[${name}] 님의 가입 신청을 거절했습니다.`);
        }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const activeGroup = urlParams.get('groupId') || localStorage.getItem('clov_activeGroup') || 'friend';
    const initialTab = urlParams.get('tab');
    
    document.addEventListener('DOMContentLoaded', () => {
        let list = [];
        try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
        const pending = list.filter(r => r.status === 'pending').length;
        if(initialTab === 'join' || pending > 0) {
            switchNotiTab('join');
        } else {
            switchNotiTab('admin');
        }
    });

    function goBack() {
        window.location.href = `../02-main/index.html?selectedGroup=${activeGroup}&theme=${isDark ? 'dark' : 'light'}`;
    }
</script>
</body>
</html>
