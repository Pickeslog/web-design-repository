<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clov - 개인정보 수정</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #cbdad2;
            --card-bg: #ffffff;
            --text-color: #2c3e35;
            --text-muted: #61766a;
            --border-color: #eef2f0;
            --primary-green: #1b4332;
            --accent-green: #52b788;
            --btn-hover: #357a58;
            --input-bg: #fafbfc;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --section-bg: #f4f8f6;
        }

        body.dark-mode {
            --bg-color: #090d0a;
            --card-bg: #151f18;
            --text-color: #f0fdf4;
            --text-muted: #86efac;
            --border-color: #1e2f24;
            --primary-green: #007c2e;
            --accent-green: #4ade80;
            --btn-hover: #16a34a;
            --input-bg: #0d1510;
            --danger: #f87171;
            --danger-hover: #ef4444;
            --section-bg: #0e1a11;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px 80px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 540px;
            animation: fadeUp 0.5s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── 헤더 ── */
        .page-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }
        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; color: var(--text-muted);
            transition: background 0.2s, color 0.2s;
        }
        .back-btn:hover { background: var(--section-bg); color: var(--text-color); }
        .page-header h1 { font-size: 22px; font-weight: 700; color: var(--text-color); }
        .page-header .emoji { font-size: 22px; }

        /* ── 프로필 아바타 섹션 (카드 내부) ── */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
        }
        .section-gap { margin-top: 20px; }
        .avatar-wrap { position: relative; }
        .avatar-circle {
            width: 88px; height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 700; color: #fff;
            cursor: pointer;
            border: 3px solid var(--border-color);
            overflow: hidden;
            transition: opacity 0.2s;
        }
        .avatar-circle:hover { opacity: 0.85; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .avatar-edit-badge {
            position: absolute;
            bottom: 2px; right: 2px;
            background: var(--accent-green);
            border-radius: 50%;
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
            border: 2px solid var(--card-bg);
            cursor: pointer;
        }
        .avatar-name {
            font-size: 18px; font-weight: 700; color: var(--text-color);
        }
        .avatar-status {
            font-size: 13px; color: var(--text-muted);
        }

        /* ── 카드 섹션 ── */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ── 폼 요소 ── */
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .form-row:last-child { margin-bottom: 0; }
        .form-row label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .form-row input, .form-row select, .form-row textarea {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 13px 16px;
            color: var(--text-color);
            font-size: 15px;
            width: 100%;
            transition: border-color 0.25s, box-shadow 0.25s;
            font-family: inherit;
        }
        .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.18);
        }
        .form-row input[readonly] {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .form-row textarea { min-height: 80px; resize: vertical; }
        .form-row select { appearance: none; cursor: pointer; }
        .hint-text { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* ── 이모지 선택 ── */
        .emoji-picker-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .emoji-chip {
            width: 42px; height: 42px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--input-bg);
            font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.15s;
        }
        .emoji-chip:hover { transform: scale(1.15); }
        .emoji-chip.selected { border-color: var(--accent-green); background: rgba(82,183,136,0.1); }

        /* ── 비밀번호 입력 ── */
        .input-icon-wrap { position: relative; }
        .input-icon-wrap input { padding-right: 46px; }
        .toggle-pw-btn {
            position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); font-size: 16px;
        }

        /* ── 구분선 ── */
        .divider { height: 1px; background: var(--border-color); margin: 16px 0; }

        /* ── 버튼 ── */
        .btn-save {
            width: 100%;
            background: var(--primary-green);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 4px;
        }
        .btn-save:hover { background: var(--btn-hover); transform: translateY(-2px); }
        .btn-save:active { transform: translateY(0); }

        .btn-danger {
            width: 100%;
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            margin-top: 8px;
        }
        .btn-danger:hover { background: rgba(231, 76, 60, 0.08); }

        /* ── 토스트 ── */
        .toast {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--primary-green);
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px; font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
            opacity: 0;
            z-index: 999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* 숨김 파일 입력 */
        #avatar-file-input { display: none; }
    </style>

    <script id="dark-mode-init">
        const urlParamsTheme = new URLSearchParams(window.location.search);
        const themeParam = urlParamsTheme.get('theme');
        let isDark = false;
        if (themeParam === 'dark') isDark = true;
        else if (themeParam === 'light') isDark = false;
        else isDark = localStorage.getItem('clov_darkMode') === 'true';
        if (isDark) {
            document.documentElement.classList.add('dark-mode');
            window.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>
</head>
<body>

<div class="container">

    <!-- 헤더 -->
    <div class="page-header">
        <button class="back-btn" onclick="goBack()" title="뒤로가기">←</button>
        <span class="emoji">🌿</span>
        <h1>개인정보 수정</h1>
    </div>

    <!-- 통합 카드 -->
    <div class="card">

        <!-- 아바타 -->
        <div class="avatar-section">
            <div class="avatar-wrap">
                <div class="avatar-circle" id="avatar-circle" onclick="triggerAvatarUpload()">
                    <span id="avatar-initial">김</span>
                    <img id="avatar-img" src="" alt="프로필 사진">
                </div>
                <div class="avatar-edit-badge" onclick="triggerAvatarUpload()">✏️</div>
            </div>
            <div class="avatar-name" id="display-name-preview">김예린</div>
            <div class="avatar-status" id="display-status-preview">✨ 추억을 쌓는 중</div>
            <input type="file" id="avatar-file-input" accept="image/*" onchange="handleAvatarUpload(event)">
        </div>

        <div class="divider"></div>

        <!-- 기본 정보 -->
        <div class="card-title section-gap">👤 기본 정보</div>
        <div class="form-row">
            <label for="input-name">이름 / 닉네임</label>
            <input type="text" id="input-name" placeholder="예: 김예린" maxlength="16">
        </div>
        <div class="form-row">
            <label for="input-status">상태 메시지</label>
            <input type="text" id="input-status" placeholder="예: ✨ 추억을 쌓는 중" maxlength="40">
        </div>
        <div class="form-row">
            <label>프로필 아이콘 (이모지)</label>
            <div class="emoji-picker-row" id="emoji-picker">
                <div class="emoji-chip selected" data-emoji="🌿" onclick="selectEmoji(this)">🌿</div>
                <div class="emoji-chip" data-emoji="🍀" onclick="selectEmoji(this)">🍀</div>
                <div class="emoji-chip" data-emoji="🌸" onclick="selectEmoji(this)">🌸</div>
                <div class="emoji-chip" data-emoji="🌙" onclick="selectEmoji(this)">🌙</div>
                <div class="emoji-chip" data-emoji="⭐" onclick="selectEmoji(this)">⭐</div>
                <div class="emoji-chip" data-emoji="🔥" onclick="selectEmoji(this)">🔥</div>
                <div class="emoji-chip" data-emoji="🎵" onclick="selectEmoji(this)">🎵</div>
                <div class="emoji-chip" data-emoji="📷" onclick="selectEmoji(this)">📷</div>
                <div class="emoji-chip" data-emoji="🐾" onclick="selectEmoji(this)">🐾</div>
                <div class="emoji-chip" data-emoji="💫" onclick="selectEmoji(this)">💫</div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- 연락처 -->
        <div class="card-title section-gap">📬 연락처</div>
        <div class="form-row">
            <label for="input-email">이메일</label>
            <input type="email" id="input-email" placeholder="예: clov@example.com">
        </div>
        <div class="form-row">
            <label for="input-birth">생년월일</label>
            <input type="date" id="input-birth">
        </div>

        <div class="divider"></div>

        <!-- 비밀번호 변경 -->
        <div class="card-title section-gap">🔒 비밀번호 변경</div>
        <div class="form-row">
            <label for="input-pw-current">현재 비밀번호</label>
            <div class="input-icon-wrap">
                <input type="password" id="input-pw-current" placeholder="현재 비밀번호 입력">
                <button class="toggle-pw-btn" type="button" onclick="togglePw('input-pw-current', this)">👁️</button>
            </div>
        </div>
        <div class="form-row">
            <label for="input-pw-new">새 비밀번호</label>
            <div class="input-icon-wrap">
                <input type="password" id="input-pw-new" placeholder="8자 이상, 영문+숫자 조합">
                <button class="toggle-pw-btn" type="button" onclick="togglePw('input-pw-new', this)">👁️</button>
            </div>
        </div>
        <div class="form-row">
            <label for="input-pw-confirm">새 비밀번호 확인</label>
            <div class="input-icon-wrap">
                <input type="password" id="input-pw-confirm" placeholder="동일하게 입력">
                <button class="toggle-pw-btn" type="button" onclick="togglePw('input-pw-confirm', this)">👁️</button>
            </div>
            <span class="hint-text" id="pw-match-hint"></span>
        </div>

        <!-- 저장 버튼 (카드 내부 하단) -->
        <div class="divider"></div>
        <button class="btn-save" id="save-btn" onclick="saveProfile()">✅ 변경사항 저장</button>

    </div>

    <!-- 계정 탈퇴 (위험 구역 — 분리 유지) -->
    <div class="card" style="margin-top: 16px;">
        <div class="card-title">⚠️ 계정 관리</div>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.6;">계정을 탈퇴하면 모든 추억 기록과 편지가 영구적으로 삭제됩니다.</p>
        <button class="btn-danger" onclick="confirmDeleteAccount()">🗑️ 계정 탈퇴</button>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
    // 초기 데이터 로드
    const urlParams = new URLSearchParams(window.location.search);
    const groupId = urlParams.get('groupId') || localStorage.getItem('clov_activeGroup') || 'friend';

    // localStorage에서 프로필 정보 불러오기
    let profileData = {};
    try {
        profileData = JSON.parse(localStorage.getItem('clov_profile')) || {};
    } catch(e) {}

    let selectedEmoji = profileData.emoji || '🌿';
    let avatarBase64 = profileData.avatarBase64 || '';

    // UI 초기화
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('input-name').value    = profileData.name    || '김예린';
        document.getElementById('input-status').value  = profileData.status  || '✨ 추억을 쌓는 중';
        document.getElementById('input-email').value   = profileData.email   || '';
        document.getElementById('input-birth').value   = profileData.birth   || '';

        updatePreview();
        restoreEmoji(selectedEmoji);

        if (avatarBase64) {
            const img = document.getElementById('avatar-img');
            img.src = avatarBase64;
            img.style.display = 'block';
            document.getElementById('avatar-initial').style.display = 'none';
        }

        // 이름/상태 실시간 미리보기
        document.getElementById('input-name').addEventListener('input', updatePreview);
        document.getElementById('input-status').addEventListener('input', updatePreview);

        // 비밀번호 일치 실시간 확인
        document.getElementById('input-pw-confirm').addEventListener('input', checkPwMatch);
    });

    function updatePreview() {
        const name   = document.getElementById('input-name').value   || '이름';
        const status = document.getElementById('input-status').value || '상태 메시지';
        document.getElementById('display-name-preview').textContent   = name;
        document.getElementById('display-status-preview').textContent = status;
    }

    function selectEmoji(el) {
        document.querySelectorAll('.emoji-chip').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        selectedEmoji = el.dataset.emoji;
    }

    function restoreEmoji(emoji) {
        const chips = document.querySelectorAll('.emoji-chip');
        chips.forEach(c => {
            c.classList.remove('selected');
            if (c.dataset.emoji === emoji) c.classList.add('selected');
        });
    }

    function triggerAvatarUpload() {
        document.getElementById('avatar-file-input').click();
    }

    function handleAvatarUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            avatarBase64 = ev.target.result;
            const img = document.getElementById('avatar-img');
            img.src = avatarBase64;
            img.style.display = 'block';
            document.getElementById('avatar-initial').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    function togglePw(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁️';
        }
    }

    function checkPwMatch() {
        const pw1  = document.getElementById('input-pw-new').value;
        const pw2  = document.getElementById('input-pw-confirm').value;
        const hint = document.getElementById('pw-match-hint');
        if (!pw2) { hint.textContent = ''; return; }
        if (pw1 === pw2) {
            hint.textContent = '✅ 비밀번호가 일치합니다';
            hint.style.color = 'var(--accent-green)';
        } else {
            hint.textContent = '❌ 비밀번호가 일치하지 않습니다';
            hint.style.color = 'var(--danger)';
        }
    }

    function saveProfile() {
        const name   = document.getElementById('input-name').value.trim();
        const status = document.getElementById('input-status').value.trim();
        const email  = document.getElementById('input-email').value.trim();
        const birth  = document.getElementById('input-birth').value;
        const pwCur  = document.getElementById('input-pw-current').value;
        const pwNew  = document.getElementById('input-pw-new').value;
        const pwCon  = document.getElementById('input-pw-confirm').value;

        if (!name) { showToast('⚠️ 이름은 필수 항목입니다', true); return; }

        // 비밀번호 변경 유효성
        if (pwNew || pwCon) {
            if (!pwCur) { showToast('⚠️ 현재 비밀번호를 입력해 주세요', true); return; }
            if (pwNew.length < 8) { showToast('⚠️ 새 비밀번호는 8자 이상이어야 합니다', true); return; }
            if (pwNew !== pwCon) { showToast('⚠️ 비밀번호가 일치하지 않습니다', true); return; }
        }

        profileData = { name, status, email, birth, emoji: selectedEmoji, avatarBase64 };
        localStorage.setItem('clov_profile', JSON.stringify(profileData));

        // 비밀번호 필드 초기화
        document.getElementById('input-pw-current').value = '';
        document.getElementById('input-pw-new').value     = '';
        document.getElementById('input-pw-confirm').value = '';
        document.getElementById('pw-match-hint').textContent = '';

        showToast('✅ 개인정보가 저장되었습니다!');

        // 저장 후 1.2초 뒤에 메인으로 복귀
        setTimeout(() => goBack(), 1200);
    }

    function confirmDeleteAccount() {
        if (confirm('⚠️ 정말로 계정을 탈퇴하시겠습니까?\n\n모든 추억 기록과 편지가 영구 삭제되며 되돌릴 수 없습니다.')) {
            localStorage.clear();
            showToast('계정이 삭제되었습니다. 잠시 후 이동합니다...');
            setTimeout(() => { window.location.href = '../01-auth/login.html'; }, 1500);
        }
    }

    function showToast(msg, isError = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.background = isError ? 'var(--danger)' : 'var(--primary-green)';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    function goBack() {
        window.location.href = `../02-main/index.html?theme=${isDark ? 'dark' : 'light'}`;
    }
</script>
</body>
</html>
