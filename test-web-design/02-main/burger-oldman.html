<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>버거노인 · 살아있는 마스코트</title>
  <style>
    :root { --ink: #35271d; --paper: #f6e8cc; --orange: #e99e43; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; color: var(--ink); background: #f4dfb8; font-family: ui-rounded, "Pretendard", "Malgun Gothic", sans-serif; }
    .paper { position: fixed; inset: 0; pointer-events: none; opacity: .32; background-image: radial-gradient(#b48654 0.7px, transparent .8px), repeating-linear-gradient(0deg, rgba(107,67,30,.06) 0 1px, transparent 1px 5px); background-size: 7px 7px, auto; mix-blend-mode: multiply; }
    main { width: min(100%, 920px); min-height: 100vh; margin: auto; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(20px, 4vw, 44px); position: relative; }
    header { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
    .label { margin: 0 0 .35rem; font-size: .74rem; font-weight: 800; letter-spacing: .14em; color: #a7552f; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 4.5rem); letter-spacing: -.08em; line-height: .9; }
    .status { margin-top: .25rem; padding: .55rem .75rem; border: 2px solid var(--ink); border-radius: 999px; background: #fff8e8; box-shadow: 3px 3px 0 var(--ink); font-size: .78rem; white-space: nowrap; }
    .scene { display: grid; place-items: center; position: relative; }
    .shadow { position: absolute; width: min(62vw, 430px); aspect-ratio: 5 / 1; border-radius: 50%; background: rgba(84, 50, 23, .22); filter: blur(12px); transform: translateY(clamp(190px, 30vh, 270px)); }
    .mascot-button { width: min(52vh, 68vw, 420px); padding: 0; border: 0; background: none; cursor: pointer; position: relative; transform-style: preserve-3d; outline-offset: 10px; isolation: isolate; }
    .mascot-button:focus-visible { outline: 4px dashed #a7552f; }
    .mascot { display: block; position: relative; z-index: 1; width: 100%; transform-origin: 50% 88%; filter: url(#wobble); user-select: none; -webkit-user-drag: none; }
    .wave-arm { position: absolute; z-index: 2; top: 30%; left: -6%; width: 35%; transform-origin: 85% 82%; filter: url(#wobble); pointer-events: none; }
    .mascot-button .steam { position: absolute; z-index: 0; top: 11%; width: 23px; height: 90px; border: 8px solid rgba(255,250,231,.8); border-left: 0; border-bottom: 0; border-radius: 0 70% 0 0; filter: url(#steam); opacity: 0; transform: translateY(22px) rotate(12deg); }
    .mascot-button .steam.one { left: 34%; animation: steam 3.2s 1.2s infinite ease-out; }
    .mascot-button .steam.two { left: 50%; height: 110px; animation: steam 3.2s 2s infinite ease-out; }
    .mascot-button .steam.three { right: 28%; animation: steam 3.2s 2.65s infinite ease-out; }
    .mascot-button.idle { animation: breathe 3.2s ease-in-out infinite; }
    .mascot-button.greeting { animation: greeting .72s cubic-bezier(.18,.75,.25,1.3) both; }
    .mascot-button.greeting .wave-arm { animation: armWave .78s 2 ease-in-out; }
    .mascot-button:hover .mascot { filter: url(#wobble-strong) drop-shadow(0 10px 0 rgba(80,47,22,.18)); }
    .halo { position: absolute; width: min(66vw, 470px); aspect-ratio: 1; border: 2px dashed rgba(167,85,47,.32); border-radius: 50%; animation: spin 24s linear infinite; }
    .halo span { position: absolute; font-size: clamp(1.25rem, 3vw, 2.2rem); color: #c36d32; }
    .halo span:nth-child(1) { top: 5%; left: 48%; } .halo span:nth-child(2) { top: 48%; right: 1%; } .halo span:nth-child(3) { left: 4%; bottom: 20%; }
    footer { display: flex; justify-content: center; gap: .55rem; flex-wrap: wrap; position: relative; z-index: 5; padding-top: .5rem; }
    button:not(.mascot-button) { border: 2px solid var(--ink); background: #fff9ea; border-radius: 999px; padding: .68rem .95rem; color: var(--ink); font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .15s, box-shadow .15s; }
    button:not(.mascot-button):hover { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .speech { position: absolute; top: 14%; right: 5%; max-width: 190px; padding: .9rem 1rem; border: 2px solid var(--ink); border-radius: 20px 20px 4px 20px; background: #fff9ea; box-shadow: 4px 4px 0 rgba(53,39,29,.18); font-size: .9rem; font-weight: 700; opacity: 0; transform: translateY(8px) rotate(3deg); pointer-events: none; transition: .25s; }
    .speech.show { opacity: 1; transform: translateY(0) rotate(3deg); }
    @keyframes breathe { 0%,100% { transform: translateY(0) rotate(-.4deg) scale(1); } 50% { transform: translateY(-7px) rotate(.5deg) scale(1.012,.99); } }
    @keyframes greeting { 25% { transform: translateY(-20px) rotate(-4deg) scale(1.04,.96); } 55% { transform: translateY(2px) rotate(4deg) scale(.98,1.04); } 100% { transform: translateY(0) rotate(0) scale(1); } }
    @keyframes armWave { 0%,100% { transform: rotate(-3deg); } 25% { transform: rotate(17deg); } 55% { transform: rotate(-15deg); } 75% { transform: rotate(13deg); } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(26px) rotate(12deg) scale(.65); } 24% { opacity: .8; } 100% { opacity: 0; transform: translateY(-42px) rotate(-12deg) scale(1.18); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 560px) { .mascot-button { width: min(48vh, 72vw, 360px); } .speech { top: 8%; right: 0; max-width: 145px; font-size: .75rem; } .status { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="paper"></div>
  <svg width="0" height="0" aria-hidden="true">
    <filter id="wobble"><feTurbulence type="turbulence" baseFrequency="0.007 0.012" numOctaves="1" seed="8" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="wobble-strong"><feTurbulence type="turbulence" baseFrequency="0.012 0.02" numOctaves="1" seed="5" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="5.5" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="steam"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/></filter>
  </svg>
  <main>
    <header><div><p class="label">CLOV MASCOT LAB</p><h1>버거노인</h1></div><span class="status">오늘도 따끈한 인사</span></header>
    <section class="scene" aria-label="움직이는 버거노인 마스코트">
      <div class="halo" aria-hidden="true"><span>✦</span><span>✦</span><span>✦</span></div><div class="shadow"></div>
      <button class="mascot-button idle" id="mascotButton" aria-label="버거노인에게 인사하기"><i class="steam one"></i><i class="steam two"></i><i class="steam three"></i><img class="wave-arm" src="assets/burger-oldman/wave-arm.png" alt="" /><img class="mascot" src="assets/burger-oldman/body.png" alt="손을 흔드는 버거노인" /></button>
      <div class="speech" id="speech" aria-live="polite">어서 와!<br>따끈한 하루지?</div>
    </section>
    <footer><button data-message="반가워! 오늘도 든든하게 보내자.">인사하기</button><button data-message="나는 참깨 주근깨가 매력이란다.">주근깨 보기</button><button data-message="버거는 마음까지 든든하게 하지!">응원 받기</button></footer>
  </main>
  <script>
    const mascot = document.querySelector('#mascotButton');
    const speech = document.querySelector('#speech');
    let timer;
    function greet(message = '어서 와!<br>따끈한 하루지?') {
      mascot.classList.remove('greeting'); void mascot.offsetWidth; mascot.classList.add('greeting');
      speech.innerHTML = message; speech.classList.add('show');
      clearTimeout(timer); timer = setTimeout(() => speech.classList.remove('show'), 2400);
    }
    mascot.addEventListener('click', () => greet());
    document.querySelectorAll('[data-message]').forEach((button) => button.addEventListener('click', () => greet(button.dataset.message)));
  </script>
</body>
</html>
