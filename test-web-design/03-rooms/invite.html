<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clov - 그룹 초대</title>
    <!-- 로그인 체크 -->
    <script>
      if (!localStorage.getItem('accessToken') && !sessionStorage.getItem('accessToken')) {
        window.location.href = '../01-auth/login.html';
      }
    </script>
    <style>
                :root {
            --bg-color: #cbdad2;
            --card-bg: #ffffff;
            --text-color: #2c3e35;
            --text-muted: #61766a;
            --border-color: #eef2f0;
            --primary-green: #1b4332;
            --accent-green: #52b788;
            --btn-hover: #357a58;
            --input-bg: #fafbfc;
            --btn-secondary-bg: rgba(0,0,0,0.05);
        }

        body.dark-mode {
            /* 미드나잇 올리브 팔레트 — 02-main/desktop.css와 동일 계열로 통일 */
            --bg-color: #14150e;
            --card-bg: #1e2016;
            --text-color: #eef0e2;
            --text-muted: #b7c99a;
            --border-color: #2a2c1e;
            --primary-green: #5a7a3e;
            --accent-green: #9ccc65;
            --btn-hover: #6b8f47;
            --input-bg: #191a12;
            --btn-secondary-bg: rgba(255,255,255,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeUp 0.6s ease-out;
            text-align: center;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .back-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #fff;
        }

        .invite-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .invite-desc {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .code-input {
            width: 100%;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-color);
            font-size: 20px;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 24px;
            transition: all 0.3s;
        }

        .code-input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-green);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-submit:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }
    </style>
    <link rel="stylesheet" href="../02-main/css/global-theme.css">
    <script id="dark-mode-init">
        const urlParamsTheme = new URLSearchParams(window.location.search);
        const themeParam = urlParamsTheme.get('theme');
        let isDark = false;
        
        if (themeParam === 'dark') {
            isDark = true;
        } else if (themeParam === 'light') {
            isDark = false;
        } else {
            isDark = localStorage.getItem('clov_darkMode') === 'true';
        }

        if (isDark) {
            document.documentElement.classList.add('dark-mode');
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('dark-mode');
            });
        }
    </script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🤝 친구 초대하기</h1>
        <button class="back-btn" onclick="goBack()">✕ 취소</button>
    </div>

    <div class="invite-icon">📨</div>
    <p class="invite-desc">친구에게 받은 6자리 초대코드를 입력하거나,<br>아래 코드를 복사해서 친구에게 전달하세요.</p>
    
    <input type="text" class="code-input" id="invite-code" placeholder="CODE-XX" value="CLOV-12" maxlength="8">
    <button class="btn-submit" onclick="submitCode()">연동 및 디데이 시작</button>
</div>

<script src="../02-main/components/clov-modal.js"></script>
<script>
    function submitCode() {
        const code = document.getElementById('invite-code').value.trim();
        if(code.length < 4) {
            clovAlert("유효한 초대 코드를 입력해주세요.", { icon: "⚠️", type: "warn" });
            return;
        }
        
        // 메인 페이지로 이동하면서 invite 파라미터를 넘김
        window.location.href = `index.html?action=invite&code=${encodeURIComponent(code)}`;
    }

    function goBack() {
        window.location.href = `index.html?theme=${isDark ? 'dark' : 'light'}`;
    }
</script>
</body>
</html>
