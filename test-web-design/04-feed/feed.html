<!DOCTYPE html>
<html lang="ko">

<!-- 공통 디자인 시스템 (CSS 변수 + 피드/카드 스타일 재사용) -->
<link rel="stylesheet" href="../02-main/css/desktop.css">
<style>
  /* ===== 스탠드얼론 레이아웃 재정의 ===== */
  body {
    display: block !important;
    padding: 0 !important;
    align-items: unset !important;
    background-color: var(--bg-light);
    min-height: 100vh;
  }

  /* ===== 헤더 ===== */
  .feed-header {
    position: sticky; top: 0; z-index: 200;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; padding: 0 28px;
    background: var(--header-glass-bg);
    backdrop-filter: blur(18px) saturate(1.4);
    border-bottom: 1px solid var(--border-color);
  }
  .feed-header-left { display: flex; align-items: center; gap: 12px; }
  .feed-back-btn {
    display: flex; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 13px; font-weight: 600;
    padding: 6px 10px; border-radius: 8px;
    transition: background .15s, color .15s;
    text-decoration: none;
  }
  .feed-back-btn:hover { background: var(--nav-item-bg-active); color: var(--primary-green); }
  .feed-back-btn svg { width: 14px; height: 14px; }
  .feed-logo {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 16px; font-weight: 800; color: var(--primary-green); letter-spacing: -.3px;
  }
  .feed-logo-mark { width: 20px; height: 20px; object-fit: contain; display: block; }
  .feed-header-right { display: flex; align-items: center; gap: 6px; }
  .hdr-icon-btn {
    width: 34px; height: 34px; border-radius: 9px; border: none;
    background: none; cursor: pointer; font-size: 16px; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .hdr-icon-btn:hover { background: var(--nav-item-bg-active); color: var(--primary-green); }
  .dark-toggle-btn {
    width: 44px; height: 26px; border-radius: 13px;
    background: rgba(120,120,128,.28); border: none; cursor: pointer;
    position: relative; transition: background .25s;
  }
  body.dark-mode .dark-toggle-btn { background: var(--accent-green); }
  .toggle-knob-dot {
    position: absolute; top: 2px; left: 2px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
    color: #5c7a6a; display: flex; align-items: center; justify-content: center;
    transition: transform .25s cubic-bezier(.2,.9,.2,1.1);
  }
  body.dark-mode .toggle-knob-dot { transform: translateX(18px); }
  /* 해/달 아이콘 — body.dark-mode 여부로 CSS가 자동 전환, JS는 텍스트를 건드리지 않는다 */
  .toggle-knob-dot .knob-icon-moon { display: none; }
  body.dark-mode .toggle-knob-dot .knob-icon-sun { display: none; }
  body.dark-mode .toggle-knob-dot .knob-icon-moon { display: inline-flex; }
  .avatar-btn {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--primary-green); color: #fff;
    font-size: 11px; font-weight: 700; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* ===== 페이지 컨테이너 ===== */
  .feed-page {
    max-width: 900px; margin: 0 auto; padding: 32px 24px 80px;
  }

  /* ===== 피드 헤더 영역 재정의 ===== */
  .feed-hero {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  .feed-title { font-size: 20px; font-weight: 800; color: var(--primary-green); }
  .feed-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
  .feed-hero-meta { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .feed-month-summary {
    font-size: 13px; color: var(--text-muted); font-weight: 600;
    background: var(--nav-item-bg-active); padding: 5px 12px;
    border-radius: 20px;
  }

  /* ===== 그룹 선택 칩 ===== */
  .group-chips {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .group-chip {
    padding: 6px 14px; border-radius: 20px;
    border: 1.5px solid var(--border-color);
    background: var(--card-bg); color: var(--text-muted);
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .group-chip.active { background: var(--primary-green); border-color: var(--primary-green); color: #fff; }
  body.dark-mode .group-chip.active { color: #0a0f0c; }
  .group-chip:hover:not(.active) { border-color: var(--accent-green); color: var(--primary-green); }
</style>

<!-- desktop.js 재사용 (데이터 + 피드 렌더링 로직) -->
<script src="../02-main/js/desktop.js"></script>
<script>
  /* ===== 글쓰기 모달 ===== */
  (function() {
    var _wmPhotos = [];
    var WM_PHOTO_LIMIT = 30;

    window.openWriteModal = function() {
      _wmPhotos = [];
      document.getElementById('wm-title').value = '';
      document.getElementById('wm-body').value = '';
      document.getElementById('wm-tags').value = '';
      document.getElementById('wm-char-count').textContent = '0/25';
      document.getElementById('wm-img-input').value = '';
      _renderPhotoStrip();
      _buildChips();
      document.getElementById('wm-backdrop').classList.add('open');
    };
    window.closeWriteModal = function() {
      document.getElementById('wm-backdrop').classList.remove('open');
    };
    function _renderPhotoStrip() {
      var strip = document.getElementById('wm-photo-strip');
      strip.innerHTML = _wmPhotos.map(function(url, index) {
        return '<div class="wm-photo-thumb">' +
          '<img src="' + url + '">' +
          '<button type="button" class="wm-img-remove" onclick="removeWriteImg(' + index + ')">✕</button>' +
          '</div>';
      }).join('') + (_wmPhotos.length < WM_PHOTO_LIMIT
        ? '<button type="button" class="wm-photo-add" onclick="document.getElementById(\'wm-img-input\').click()"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1l1.5-2h7L17 6h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span>추가</span></button>'
        : '');
    }
    window.removeWriteImg = function(index) {
      _wmPhotos.splice(index, 1);
      _renderPhotoStrip();
    };
    window.previewWriteImg = function(input) {
      var files = [].slice.call(input.files || []);
      if (!files.length) return;
      var remaining = WM_PHOTO_LIMIT - _wmPhotos.length;
      if (remaining <= 0) {
        input.value = '';
        alert('사진은 최대 ' + WM_PHOTO_LIMIT + '장까지 추가할 수 있어요.');
        return;
      }
      var toLoad = files.slice(0, remaining);
      var loadedCount = 0;
      toLoad.forEach(function(file) {
        if (!file.type.startsWith('image/')) { loadedCount += 1; return; }
        if (typeof window.compressImage === 'function') {
          window.compressImage(file, 800, 800, 0.6).then(function(dataUrl) {
            _wmPhotos.push(dataUrl);
            loadedCount += 1;
            if (loadedCount === toLoad.length) {
              input.value = '';
              _renderPhotoStrip();
              if (typeof showProofResultModal === 'function') {
                showProofResultModal({
                  title: '이미지 업로드 완료',
                  message: toLoad.length + '장의 사진이 추가됐어요.'
                });
              }
            }
          });
        } else {
          var reader = new FileReader();
          reader.onload = function(e) {
            _wmPhotos.push(e.target.result);
            loadedCount += 1;
            if (loadedCount === toLoad.length) {
              input.value = '';
              _renderPhotoStrip();
              if (typeof showProofResultModal === 'function') {
                showProofResultModal({
                  title: '이미지 업로드 완료',
                  message: toLoad.length + '장의 사진이 추가됐어요.'
                });
              }
            }
          };
          reader.readAsDataURL(file);
        }
      });
    };
    // 참여자 칩은 "함께한 친구"만 고른다. 게시자(나)는 항상 자동 포함되므로 칩 목록에는 넣지 않는다.
    function _buildChips() {
      var posts = (typeof groupsData !== 'undefined' && groupsData[activeGroup]) ? (groupsData[activeGroup].posts || []) : [];
      var seen = new Map();
      posts.forEach(function(post) {
        (post.participants || []).forEach(function(p) {
          if (p.type === 'mine' || p.name === '나') return;
          var key = p.name || p.icon;
          if (!seen.has(key)) seen.set(key, p);
        });
      });
      var container = document.getElementById('wm-chips');
      var chips = [...seen.values()];
      container.innerHTML = chips.length ? chips.map(function(m) {
        var icon = m.icon || (m.name || '?').slice(0, 1);
        var name = m.name || icon;
        return '<label class="wm-chip on" data-name="' + name + '" data-icon="' + icon + '">' +
          '<div class="wm-chip-av">' + icon + '</div>' + name + '</label>';
      }).join('') : '<span class="wm-label" style="text-transform:none;letter-spacing:0;">아직 함께 기록한 친구가 없어요. 나 혼자만의 기록으로 남길 수 있어요.</span>';
      container.querySelectorAll('.wm-chip').forEach(function(chip) {
        chip.addEventListener('click', function(){ chip.classList.toggle('on'); });
      });
    }
    window.saveWritePost = function() {
      var title = document.getElementById('wm-title').value.trim();
      var body  = document.getElementById('wm-body').value.trim();
      if (!title) { document.getElementById('wm-title').focus(); return; }
      if (!body)  { document.getElementById('wm-body').focus(); return; }
      var selected = [...document.querySelectorAll('#wm-chips .wm-chip.on')];
      var tagsInput = document.getElementById('wm-tags').value.trim();
      var tags = tagsInput
        ? [...new Set(
            tagsInput.split(/[\s,]+/)
              .map(function(tag) { return tag.trim(); })
              .filter(Boolean)
              .map(function(tag) { return tag.startsWith('#') ? tag : '#' + tag; })
          )].slice(0, 5)
        : [];
      var today = new Date();
      var pad = function(n){ return String(n).padStart(2,'0'); };
      var dateStr = today.getFullYear() + '.' + pad(today.getMonth()+1) + '.' + pad(today.getDate());
      var participants = [
        { name: '나', icon: '나', type: 'mine' },
        ...selected.map(function(chip) {
          return { name: chip.dataset.name, icon: chip.dataset.icon, type: 'friend' };
        })
      ];
      var newPost = {
        date: dateStr,
        title: title,
        subtitle: '',
        text: body,
        photos: _wmPhotos.slice(),
        bg: _wmPhotos[0] || '',
        authorId: CURRENT_USER_ID,
        messages: [],
        participants: participants,
        tags: tags,
      };
      if (window._clov && typeof window._clov.addPost === 'function') {
        window._clov.addPost(newPost);
        if (typeof window._clov.refreshFeed === 'function') {
          window._clov.refreshFeed();
        }
      } else {
        var ag = localStorage.getItem('clov_activeGroup') || 'friend';
        var stored = {};
        try { stored = JSON.parse(localStorage.getItem('clov_groupsData')) || {}; } catch(e){}
        if (!stored[ag]) stored[ag] = { posts: [] };
        if (!stored[ag].posts) stored[ag].posts = [];
        stored[ag].posts.unshift(newPost);
        localStorage.setItem('clov_groupsData', JSON.stringify(stored));
        if (typeof renderFeeds === 'function') renderFeeds();
      }
      window.closeWriteModal();
    };
  })();

  /* 그룹 전환 (피드 페이지 전용) */
  function switchGroup(groupId, btn) {
    activeGroup = groupId;
    activeFeedFilter = 'all';
    activeFeedMonth  = 'all';
    document.querySelectorAll('.group-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.feed-tab').forEach(t =>
      t.classList.toggle('active', t.dataset.filter === 'all')
    );
    renderFeeds();
  }

  /* 다크모드 토글 (feed 전용 - desktop.js의 toggleDarkMode 재사용) */
  const _origToggleDark = typeof toggleDarkMode === 'function' ? toggleDarkMode : null;
  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('darkMode', isDark);
    // 해/달 아이콘은 body.dark-mode 기준 CSS가 알아서 전환한다
  }
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark-mode');
  }
</script>
</body>
