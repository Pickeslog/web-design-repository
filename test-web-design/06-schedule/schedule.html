<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clov. — 일정계획</title>
  <link rel="stylesheet" href="../02-main/css/desktop.css">
  <script src="../02-main/components/clov-header.js"></script>
  <style>
    body { min-height: 100vh; background: var(--bg-light); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* ── 헤더 ── */
    .sc-header {
      background: var(--card-bg); border-bottom: 1px solid rgba(0,0,0,.07);
      padding: 0 24px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(8px);
    }
    .sc-header-left { display: flex; align-items: center; gap: 12px; }
    .sc-back-btn {
      display: flex; align-items: center; gap: 4px;
      color: var(--text-muted); font-size: 14px; font-weight: 500;
      text-decoration: none; padding: 6px 10px; border-radius: 8px;
      transition: background .15s, color .15s;
    }
    .sc-back-btn:hover { background: var(--nav-item-bg-active); color: var(--primary-green); }
    .sc-header-title { font-size: 15px; font-weight: 700; color: var(--primary-green); }
    .sc-header-right { display: flex; align-items: center; gap: 8px; }
    .sc-icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--nav-item-bg-active); cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center; transition: background .15s;
    }
    .sc-icon-btn:hover { background: var(--accent-green); color: #fff; }
    .sc-avatar {
      width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
      background: linear-gradient(135deg, #52b788, #1b4332);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }

    /* ── 레이아웃 ── */
    .sc-main { max-width: 860px; margin: 0 auto; padding: 24px 20px 100px; }

    /* ── D-day 배너 ── */
    .dday-banner {
      border-radius: 22px; padding: 22px 24px; margin-bottom: 24px;
      background: linear-gradient(135deg, var(--primary-green) 0%, #2d6a4f 60%, var(--accent-green) 100%);
      color: #fff; display: flex; align-items: center; gap: 20px;
      cursor: pointer; transition: transform .18s, box-shadow .18s;
      box-shadow: 0 4px 20px rgba(27,67,50,.25); animation: fadeUp .4s ease;
    }
    .dday-banner:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(27,67,50,.32); }
    .dday-banner.empty {
      background: var(--card-bg); color: var(--text-muted);
      border: 2px dashed rgba(82,183,136,.4); cursor: default; flex-direction: column;
      text-align: center; box-shadow: none;
    }
    .dday-banner.empty:hover { transform: none; box-shadow: none; }
    .dday-counter { min-width: 96px; }
    .dday-next-label { font-size: 10px; font-weight: 600; opacity: .75; letter-spacing: 1px; margin-bottom: 2px; }
    .dday-number { font-size: 2.4rem; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .dday-info { flex: 1; min-width: 0; }
    .dday-info h3 { font-size: 1.1rem; font-weight: 700; margin: 0 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dday-info p  { font-size: .83rem; opacity: .88; margin: 0 0 10px; }
    .dday-faces  { display: flex; gap: 4px; }
    .dday-face   { width: 26px; height: 26px; border-radius: 50%; font-size: 13px; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; }

    /* ── 2열 그리드 ── */
    .sc-two-col { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; margin-bottom: 28px; }
    @media (max-width: 640px) { .sc-two-col { grid-template-columns: 1fr; } }

    /* ── 캘린더 ── */
    .cal-card {
      background: var(--card-bg); border-radius: 20px; padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.05); animation: fadeUp .45s ease;
    }
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-nav-btn {
      width: 30px; height: 30px; border-radius: 8px; border: none;
      background: var(--nav-item-bg-active); color: var(--primary-green);
      cursor: pointer; font-size: 15px; transition: background .15s;
    }
    .cal-nav-btn:hover { background: var(--accent-green); color: #fff; }
    .cal-label { font-size: .9rem; font-weight: 700; color: var(--primary-green); }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
    .cal-dow  { text-align: center; font-size: 10px; font-weight: 600; color: var(--text-muted); padding: 3px 0 6px; }
    .cal-dow:first-child { color: #e55; }
    .cal-dow:last-child  { color: #6699ff; }
    .cal-day {
      aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; gap: 2px;
      font-size: 12px; font-weight: 500; transition: background .12s;
    }
    .cal-day:hover:not(.other-m) { background: var(--nav-item-bg-active); }
    .cal-day.today   { background: var(--accent-green); color: #fff !important; font-weight: 700; }
    .cal-day.selected:not(.today) { background: var(--primary-green); color: #fff !important; }
    .cal-day.sun     { color: #e55; }
    .cal-day.sat     { color: #6699ff; }
    .cal-day.other-m { opacity: .28; cursor: default; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-green); }
    .cal-day.today   .cal-dot, .cal-day.selected .cal-dot { background: rgba(255,255,255,.7); }

    /* ── 다가오는 약속 미니 리스트 ── */
    .upcoming-card {
      background: var(--card-bg); border-radius: 20px; padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.05); animation: fadeUp .5s ease;
      display: flex; flex-direction: column; gap: 10px;
    }
    .upcoming-title { font-size: 13px; font-weight: 700; color: var(--primary-green); margin-bottom: 4px; }
    .mini-appt {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 12px; cursor: pointer; transition: background .12s;
    }
    .mini-appt:hover { background: var(--nav-item-bg-active); }
    .mini-color { width: 4px; height: 36px; border-radius: 4px; flex-shrink: 0; }
    .mini-info { flex: 1; min-width: 0; }
    .mini-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-date { font-size: 11px; color: var(--text-muted); }
    .mini-badge {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; flex-shrink: 0;
    }
    .badge-urgent { background: #fee2e2; color: #dc2626; }
    .badge-soon   { background: #fef9c3; color: #ca8a04; }
    .badge-future { background: #dcfce7; color: #16a34a; }
    .badge-past   { background: #f1f5f9; color: #94a3b8; }

    /* ── 약속 전체 목록 ── */
    .sc-list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sc-list-title { font-size: 15px; font-weight: 700; color: var(--primary-green); }
    .sc-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .sc-filter {
      padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: 600;
      border: 1.5px solid rgba(0,0,0,.1); background: transparent;
      color: var(--text-muted); cursor: pointer; transition: all .15s;
    }
    .sc-filter.on { background: var(--primary-green); color: #fff; border-color: var(--primary-green); }
    .appt-card {
      background: var(--card-bg); border-radius: 16px; padding: 16px 18px;
      margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start;
      box-shadow: 0 2px 8px rgba(0,0,0,.04); animation: fadeUp .35s ease;
      transition: transform .15s, box-shadow .15s;
    }
    .appt-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    .appt-card.past-card { opacity: .55; }
    .appt-bar { width: 4px; border-radius: 4px; align-self: stretch; flex-shrink: 0; }
    .appt-body { flex: 1; min-width: 0; }
    .appt-dday-chip {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
      display: inline-block; margin-bottom: 5px;
    }
    .appt-ttl  { font-size: 14px; font-weight: 700; margin: 0 0 3px; }
    .appt-meta { font-size: 11px; color: var(--text-muted); margin: 0 0 7px; }
    .appt-memo { font-size: 11px; color: var(--text-muted); font-style: italic; margin: 0 0 7px; }
    .appt-faces { display: flex; gap: 3px; }
    .appt-face  { width: 22px; height: 22px; border-radius: 50%; font-size: 11px; background: var(--nav-item-bg-active); display: flex; align-items: center; justify-content: center; }
    .appt-btns  { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
    .appt-btn   { padding: 4px 10px; border-radius: 7px; border: none; font-size: 11px; font-weight: 600; cursor: pointer; transition: all .13s; }
    .appt-btn.edit { background: var(--nav-item-bg-active); color: var(--text-color); }
    .appt-btn.edit:hover { background: var(--accent-green); color: #fff; }
    .appt-btn.del  { background: #fee2e2; color: #dc2626; }
    .appt-btn.del:hover { background: #dc2626; color: #fff; }

    /* ── 빈 상태 ── */
    .sc-empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .sc-empty .empty-icon { font-size: 2.4rem; margin-bottom: 10px; }
    .sc-empty p { font-size: 13px; line-height: 1.7; }
    .sc-empty a { color: var(--accent-green); font-weight: 600; text-decoration: none; }

    /* ── FAB ── */
    .sc-fab {
      position: fixed; bottom: 28px; right: 28px; width: 54px; height: 54px;
      border-radius: 50%; border: none; z-index: 50;
      background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
      color: #fff; font-size: 24px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(27,67,50,.35); transition: transform .18s, box-shadow .18s;
      display: flex; align-items: center; justify-content: center;
    }
    .sc-fab:hover { transform: scale(1.1); box-shadow: 0 7px 24px rgba(27,67,50,.42); }

    /* ── 모달 ── */
    .sc-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .sc-backdrop.open { opacity: 1; pointer-events: all; }
    .sc-modal {
      background: var(--card-bg); border-radius: 24px; padding: 28px;
      width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
      transform: translateY(18px); transition: transform .25s;
    }
    .sc-backdrop.open .sc-modal { transform: translateY(0); }
    .sc-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .sc-modal-head h3 { font-size: 17px; font-weight: 700; color: var(--primary-green); margin: 0; }
    .sc-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--nav-item-bg-active); cursor: pointer; font-size: 15px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
    .sc-field { margin-bottom: 15px; }
    .sc-lbl   { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
    .sc-input {
      width: 100%; padding: 10px 13px; border-radius: 10px;
      border: 1.5px solid rgba(0,0,0,.1); background: var(--bg-light);
      color: var(--text-color); font-size: 13px; outline: none;
      box-sizing: border-box; font-family: inherit; transition: border-color .15s;
    }
    .sc-input:focus { border-color: var(--accent-green); }
    textarea.sc-input { resize: vertical; min-height: 64px; }
    .sc-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sc-chips-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
    .sc-chip {
      display: flex; align-items: center; gap: 5px; padding: 5px 11px 5px 7px;
      border-radius: 18px; border: 1.5px solid rgba(0,0,0,.1);
      background: transparent; cursor: pointer; font-size: 12px;
      color: var(--text-muted); transition: all .13s;
    }
    .sc-chip.on { background: var(--primary-green); color: #fff; border-color: var(--primary-green); }
    .sc-chip-face { width: 20px; height: 20px; border-radius: 50%; font-size: 10px; background: var(--nav-item-bg-active); display: flex; align-items: center; justify-content: center; }
    .sc-chip.on .sc-chip-face { background: rgba(255,255,255,.25); }
    .sc-color-row { display: flex; gap: 8px; }
    .sc-color-dot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform .13s, border-color .13s; }
    .sc-color-dot.on { border-color: var(--text-color); transform: scale(1.18); }
    .sc-modal-foot { display: flex; gap: 10px; margin-top: 22px; }
    .sc-btn { flex: 1; padding: 11px; border-radius: 11px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .sc-btn.cancel { background: var(--nav-item-bg-active); color: var(--text-muted); }
    .sc-btn.cancel:hover { background: rgba(0,0,0,.1); }
    .sc-btn.submit { background: linear-gradient(135deg, var(--accent-green), var(--primary-green)); color: #fff; }
    .sc-btn.submit:hover { opacity: .88; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 다크모드 보조 */
    body.dark-mode .sc-input { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.1); }
    body.dark-mode .badge-urgent { background: rgba(220,38,38,.2); }
    body.dark-mode .badge-soon   { background: rgba(202,138,4,.2); }
    body.dark-mode .badge-future { background: rgba(22,163,74,.2); }
    body.dark-mode .badge-past   { background: rgba(148,163,184,.15); }
    body.dark-mode .appt-btn.del { background: rgba(220,38,38,.2); }
  </style>
</head>
<body>

<!-- ── 헤더 ── -->
<div id="app-header"></div>
<script>ClovHeader.init({ type: 'sub', backHref: '#', backOnclick: 'goBack()', backLabel: '우정공간', title: '📅 일정계획', avatarLabel: '🍀' });</script>

<!-- ── 메인 ── -->
<main class="sc-main">

  <!-- D-day 배너 -->
  <div id="dday-banner"></div>

  <!-- 2열: 캘린더 + 다가오는 약속 -->
  <div class="sc-two-col">
    <div class="cal-card">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="moveMonth(-1)">‹</button>
        <span class="cal-label" id="cal-label"></span>
        <button class="cal-nav-btn" onclick="moveMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>

    <div class="upcoming-card">
      <div class="upcoming-title">다가오는 약속</div>
      <div id="upcoming-list"></div>
    </div>
  </div>

  <!-- 약속 전체 목록 -->
  <div class="sc-list-head">
    <span class="sc-list-title">전체 약속</span>
    <div class="sc-filters">
      <button class="sc-filter on"  onclick="setFilter('all',this)">전체</button>
      <button class="sc-filter"     onclick="setFilter('upcoming',this)">다가오는</button>
      <button class="sc-filter"     onclick="setFilter('past',this)">지난 약속</button>
    </div>
  </div>
  <div id="appt-list"></div>

</main>

<!-- FAB -->
<button class="sc-fab" onclick="openModal()" title="약속 추가">+</button>

<!-- ── 모달 ── -->
<div class="sc-backdrop" id="sc-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="sc-modal">
    <div class="sc-modal-head">
      <h3 id="modal-title">약속 추가</h3>
      <button class="sc-close" onclick="closeModal()">✕</button>
    </div>
    <div class="sc-field">
      <label class="sc-lbl">제목</label>
      <input class="sc-input" id="m-title" placeholder="약속 이름" maxlength="30">
    </div>
    <div class="sc-row2">
      <div class="sc-field">
        <label class="sc-lbl">날짜</label>
        <input class="sc-input" id="m-date" type="date">
      </div>
      <div class="sc-field">
        <label class="sc-lbl">시간</label>
        <input class="sc-input" id="m-time" type="time">
      </div>
    </div>
    <div class="sc-field">
      <label class="sc-lbl">장소</label>
      <input class="sc-input" id="m-loc" placeholder="장소 (선택)">
    </div>
    <div class="sc-field">
      <label class="sc-lbl">참여자</label>
      <div class="sc-chips-wrap" id="m-chips"></div>
    </div>
    <div class="sc-field">
      <label class="sc-lbl">색상</label>
      <div class="sc-color-row" id="m-colors"></div>
    </div>
    <div class="sc-field">
      <label class="sc-lbl">메모</label>
      <textarea class="sc-input" id="m-memo" placeholder="메모 (선택)" rows="2"></textarea>
    </div>
    <div class="sc-modal-foot">
      <button class="sc-btn cancel" onclick="closeModal()">취소</button>
      <button class="sc-btn submit" onclick="saveAppt()">저장</button>
    </div>
  </div>
</div>

<script>
(function () {
  var MEMBERS = [
    { name: '나',  icon: '🍀' },
    { name: '솔',  icon: '🌿' },
    { name: '민',  icon: '🌸' },
    { name: '준',  icon: '🌊' },
  ];
  var COLORS = ['#52b788','#60a5fa','#f472b6','#fb923c','#a78bfa','#facc15'];
  var DOW = ['일','월','화','수','목','금','토'];

  var today = new Date(); today.setHours(0,0,0,0);
  var calYear = today.getFullYear(), calMonth = today.getMonth();
  var selectedDate = null, apptFilter = 'all', editId = null, nextId = 5;

  var appts = [
    { id:1, title:'솔이 생일 파티',  date:'2026-07-15', time:'18:00', loc:'홍대 카페',       parts:['나','솔','민'],       color:'#52b788', memo:'케이크 준비!' },
    { id:2, title:'민준 졸업식',      date:'2026-07-22', time:'10:00', loc:'대학로 예술관',   parts:['나','민','준'],       color:'#60a5fa', memo:'꽃다발 챙기기' },
    { id:3, title:'여름 MT',          date:'2026-08-10', time:'09:00', loc:'가평',             parts:['나','솔','민','준'], color:'#fb923c', memo:'바베큐 재료 분담' },
    { id:4, title:'봄 소풍',          date:'2026-06-10', time:'11:00', loc:'올림픽공원',       parts:['나','솔'],           color:'#a78bfa', memo:'도시락 싸오기' },
  ];

  // ── 테마 ──────────────────────────────────────────────────────
  (function() {
    var p = new URLSearchParams(location.search);
    var t = p.get('theme') || localStorage.getItem('clov_theme') || 'light';
    if (t === 'dark') document.body.classList.add('dark-mode');
  })();
  window.toggleDark = function() {
    var d = document.body.classList.toggle('dark-mode');
    localStorage.setItem('clov_theme', d ? 'dark' : 'light');
  };

  // ── 뒤로가기 ─────────────────────────────────────────────────
  window.goBack = function() {
    var d = document.body.classList.contains('dark-mode');
    var g = new URLSearchParams(location.search).get('selectedGroup') || 'friend';
    location.href = '../02-main/index.html?selectedGroup=' + g + '&theme=' + (d?'dark':'light');
  };

  // ── 날짜 유틸 ────────────────────────────────────────────────
  function dday(dateStr) {
    var t = new Date(dateStr); t.setHours(0,0,0,0);
    return Math.round((t - today) / 86400000);
  }
  function ddayTxt(n) { return n === 0 ? 'D-Day' : n > 0 ? 'D-' + n : 'D+' + Math.abs(n); }
  function ddayCls(n) { return n < 0 ? 'past' : n <= 7 ? 'urgent' : n <= 30 ? 'soon' : 'future'; }
  function badgeCls(n) { return 'badge-' + ddayCls(n); }
  function fmtDate(s) {
    var d = new Date(s);
    return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')';
  }
  function pad2(n) { return n < 10 ? '0'+n : ''+n; }
  function memberIcon(name) { var m = MEMBERS.find(function(m){return m.name===name;}); return m ? m.icon : name[0]; }

  // ── D-day 배너 ───────────────────────────────────────────────
  function renderBanner() {
    var upcoming = appts.filter(function(a){return dday(a.date)>=0;})
      .sort(function(a,b){return dday(a.date)-dday(b.date);});
    var el = document.getElementById('dday-banner');
    if (!upcoming.length) {
      el.innerHTML = '<div class="dday-banner empty">' +
        '<div style="font-size:2rem">📅</div>' +
        '<p style="margin:8px 0 0;font-size:13px">다가오는 약속이 없어요.<br>아래 <strong>+</strong> 버튼으로 첫 약속을 만들어보세요!</p>' +
        '</div>';
      return;
    }
    var a = upcoming[0], n = dday(a.date);
    var faces = a.parts.map(function(p){ return '<div class="dday-face">'+memberIcon(p)+'</div>'; }).join('');
    el.innerHTML = '<div class="dday-banner" onclick="scrollToAppt('+a.id+')">' +
      '<div class="dday-counter">' +
        '<div class="dday-next-label">NEXT</div>' +
        '<div class="dday-number">' + ddayTxt(n) + '</div>' +
      '</div>' +
      '<div class="dday-info">' +
        '<h3>' + esc(a.title) + '</h3>' +
        '<p>' + fmtDate(a.date) + (a.time?' · '+a.time:'') + (a.loc?' · '+esc(a.loc):'') + '</p>' +
        '<div class="dday-faces">' + faces + '</div>' +
      '</div>' +
    '</div>';
  }

  // ── 캘린더 ───────────────────────────────────────────────────
  function renderCal() {
    document.getElementById('cal-label').textContent = calYear + '년 ' + (calMonth+1) + '월';
    var datesSet = {};
    appts.forEach(function(a){ datesSet[a.date] = true; });
    var firstDow = new Date(calYear, calMonth, 1).getDay();
    var lastDay  = new Date(calYear, calMonth+1, 0).getDate();
    var prevLast = new Date(calYear, calMonth, 0).getDate();
    var cells = DOW.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; });
    for (var i = firstDow-1; i >= 0; i--) cells.push('<div class="cal-day other-m"><span>'+(prevLast-i)+'</span></div>');
    for (var d = 1; d <= lastDay; d++) {
      var ds = calYear+'-'+pad2(calMonth+1)+'-'+pad2(d);
      var dow = new Date(calYear, calMonth, d).getDay();
      var dt = new Date(calYear, calMonth, d);
      var cls = ['cal-day'];
      if (dt.getTime()===today.getTime()) cls.push('today');
      if (selectedDate===ds) cls.push('selected');
      if (dow===0) cls.push('sun'); if (dow===6) cls.push('sat');
      cells.push('<div class="'+cls.join(' ')+'" onclick="selDate(\''+ds+'\')">' +
        '<span>'+d+'</span>' +
        (datesSet[ds] ? '<div class="cal-dot"></div>' : '') +
        '</div>');
    }
    var total = cells.length - 7;
    var rem = (7 - (total % 7)) % 7;
    for (var nd = 1; nd <= rem; nd++) cells.push('<div class="cal-day other-m"><span>'+nd+'</span></div>');
    document.getElementById('cal-grid').innerHTML = cells.join('');
  }

  window.moveMonth = function(dir) {
    calMonth += dir;
    if (calMonth < 0)  { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0;  calYear++; }
    renderCal();
  };
  window.selDate = function(ds) {
    selectedDate = selectedDate === ds ? null : ds;
    renderCal(); renderList();
  };

  // ── 다가오는 약속 미니 ────────────────────────────────────────
  function renderUpcoming() {
    var list = appts.filter(function(a){return dday(a.date)>=0;})
      .sort(function(a,b){return dday(a.date)-dday(b.date);}).slice(0,4);
    var el = document.getElementById('upcoming-list');
    if (!list.length) {
      el.innerHTML = '<div style="text-align:center;padding:20px;font-size:13px;color:var(--text-muted)">다가오는 약속이 없어요</div>';
      return;
    }
    el.innerHTML = list.map(function(a) {
      var n = dday(a.date);
      return '<div class="mini-appt" onclick="scrollToAppt('+a.id+')">' +
        '<div class="mini-color" style="background:'+a.color+'"></div>' +
        '<div class="mini-info">' +
          '<div class="mini-name">'+esc(a.title)+'</div>' +
          '<div class="mini-date">'+fmtDate(a.date)+(a.time?' · '+a.time:'')+'</div>' +
        '</div>' +
        '<div class="mini-badge '+badgeCls(n)+'">'+ddayTxt(n)+'</div>' +
      '</div>';
    }).join('');
  }

  // ── 약속 목록 ────────────────────────────────────────────────
  function renderList() {
    var list = appts.slice().sort(function(a,b){ return dday(a.date)-dday(b.date); });
    if (selectedDate) {
      list = list.filter(function(a){ return a.date===selectedDate; });
    } else if (apptFilter==='upcoming') {
      list = list.filter(function(a){ return dday(a.date)>=0; });
    } else if (apptFilter==='past') {
      list = list.filter(function(a){ return dday(a.date)<0; });
    }
    var el = document.getElementById('appt-list');
    if (!list.length) {
      el.innerHTML = '<div class="sc-empty"><div class="empty-icon">🗓️</div><p>' +
        (selectedDate ? '이 날 약속이 없어요.' : '약속이 없어요.') + '<br>' +
        '<a href="#" onclick="openModal();return false;">+ 새 약속 추가</a></p></div>';
      return;
    }
    el.innerHTML = list.map(function(a) {
      var n = dday(a.date);
      var cls = ddayCls(n);
      var faces = a.parts.map(function(p){ return '<div class="appt-face">'+memberIcon(p)+'</div>'; }).join('');
      var meta = [fmtDate(a.date)];
      if (a.time) meta.push(a.time);
      if (a.loc)  meta.push(esc(a.loc));
      return '<div class="appt-card'+(n<0?' past-card':'')+'" id="appt-'+a.id+'">' +
        '<div class="appt-bar" style="background:'+a.color+'"></div>' +
        '<div class="appt-body">' +
          '<span class="appt-dday-chip badge-'+cls+'">'+ddayTxt(n)+'</span>' +
          '<p class="appt-ttl">'+esc(a.title)+'</p>' +
          '<p class="appt-meta">'+meta.join(' · ')+'</p>' +
          (a.memo ? '<p class="appt-memo">💬 '+esc(a.memo)+'</p>' : '') +
          '<div class="appt-faces">'+faces+'</div>' +
        '</div>' +
        '<div class="appt-btns">' +
          '<button class="appt-btn edit" onclick="openModal('+a.id+')">수정</button>' +
          '<button class="appt-btn del"  onclick="delAppt('+a.id+')">삭제</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  window.setFilter = function(f, btn) {
    apptFilter = f; selectedDate = null;
    document.querySelectorAll('.sc-filter').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    renderCal(); renderList();
  };
  window.scrollToAppt = function(id) {
    var el = document.getElementById('appt-'+id);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  };

  // ── 모달 ─────────────────────────────────────────────────────
  window.openModal = function(id) {
    editId = id || null;
    document.getElementById('modal-title').textContent = editId ? '약속 수정' : '약속 추가';

    // 색상
    document.getElementById('m-colors').innerHTML = COLORS.map(function(c) {
      return '<div class="sc-color-dot" style="background:'+c+'" data-c="'+c+'" onclick="pickColor(this)"></div>';
    }).join('');

    // 참여자 칩
    document.getElementById('m-chips').innerHTML = MEMBERS.map(function(m) {
      return '<label class="sc-chip on" data-n="'+m.name+'">' +
        '<div class="sc-chip-face">'+m.icon+'</div>'+m.name+'</label>';
    }).join('');
    document.querySelectorAll('#m-chips .sc-chip').forEach(function(c) {
      c.addEventListener('click', function(){ c.classList.toggle('on'); });
    });

    if (editId) {
      var a = appts.find(function(a){ return a.id===editId; });
      if (a) {
        document.getElementById('m-title').value = a.title;
        document.getElementById('m-date').value  = a.date;
        document.getElementById('m-time').value  = a.time||'';
        document.getElementById('m-loc').value   = a.loc||'';
        document.getElementById('m-memo').value  = a.memo||'';
        document.querySelectorAll('#m-colors .sc-color-dot').forEach(function(d){ d.classList.toggle('on', d.dataset.c===a.color); });
        document.querySelectorAll('#m-chips .sc-chip').forEach(function(c){ c.classList.toggle('on', a.parts.indexOf(c.dataset.n)>=0); });
      }
    } else {
      document.getElementById('m-title').value = '';
      document.getElementById('m-date').value  = selectedDate || '';
      document.getElementById('m-time').value  = '';
      document.getElementById('m-loc').value   = '';
      document.getElementById('m-memo').value  = '';
      document.querySelector('#m-colors .sc-color-dot').classList.add('on');
    }
    document.getElementById('sc-backdrop').classList.add('open');
  };

  window.closeModal = function() {
    document.getElementById('sc-backdrop').classList.remove('open');
    editId = null;
  };
  window.pickColor = function(el) {
    document.querySelectorAll('#m-colors .sc-color-dot').forEach(function(d){ d.classList.remove('on'); });
    el.classList.add('on');
  };
  window.saveAppt = function() {
    var title = document.getElementById('m-title').value.trim();
    var date  = document.getElementById('m-date').value;
    if (!title) { document.getElementById('m-title').focus(); return; }
    if (!date)  { document.getElementById('m-date').focus(); return; }
    var parts = [...document.querySelectorAll('#m-chips .sc-chip.on')].map(function(c){ return c.dataset.n; });
    if (!parts.length) { alert('참여자를 한 명 이상 선택해주세요.'); return; }
    var colorDot = document.querySelector('#m-colors .sc-color-dot.on');
    var color = colorDot ? colorDot.dataset.c : COLORS[0];
    var appt = {
      id: editId || nextId++, title: title, date: date,
      time: document.getElementById('m-time').value,
      loc:  document.getElementById('m-loc').value.trim(),
      memo: document.getElementById('m-memo').value.trim(),
      parts: parts, color: color,
    };
    if (editId) {
      var idx = appts.findIndex(function(a){ return a.id===editId; });
      if (idx >= 0) appts[idx] = appt;
    } else {
      appts.push(appt);
    }
    closeModal(); render();
  };
  window.delAppt = function(id) {
    if (!confirm('이 약속을 삭제할까요?')) return;
    appts = appts.filter(function(a){ return a.id!==id; });
    render();
  };

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function render() { renderBanner(); renderCal(); renderUpcoming(); renderList(); }
  render();
})();
</script>
</body>
</html>
