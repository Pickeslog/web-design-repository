<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clov. - 로그인</title>
  <meta name="description" content="Clov.에 로그인하고 친구와의 약속과 추억을 이어보세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing:border-box;margin:0;padding:0; }
    :root {
      --forest:#073b24;
      --leaf:#16874b;
      --mint:#50d990;
      --cream:#f7fbf6;
      --paper:#ffffff;
      --text:#0e2d1d;
      --muted:#638772;
      --line:rgba(22,135,75,.18);
      --glow:rgba(80,217,144,.22);
      --warn:#b45309;
    }
    body {
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:32px;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 12% 12%, rgba(217,201,143,.28), transparent 28%),
        radial-gradient(circle at 84% 82%, rgba(232,220,174,.2), transparent 32%),
        linear-gradient(135deg,#fffdf3 0%,#fffaf0 48%,#fdf6e3 100%);
      color:var(--text);
      font-family:'Outfit',sans-serif;
    }
    .login-shell {
      position:relative;
      width:min(980px,100%);
      min-height:640px;
      display:grid;
      grid-template-columns:minmax(310px,.92fr) minmax(360px,1fr);
      overflow:hidden;
      border:1px solid rgba(22,135,75,.18);
      border-radius:30px;
      background:rgba(255,255,255,.76);
      box-shadow:0 32px 90px rgba(7,59,36,.16),0 1px 0 rgba(255,255,255,.9) inset;
      backdrop-filter:blur(22px) saturate(150%);
      -webkit-backdrop-filter:blur(22px) saturate(150%);
      animation:rise .65s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes rise { from{opacity:0;transform:translateY(24px) scale(.98)} to{opacity:1;transform:translateY(0) scale(1)} }

    .memory-panel {
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:42px;
      overflow:hidden;
      color:#fff;
      background:
        linear-gradient(160deg,rgba(7,59,36,.98),rgba(11,91,51,.94)),
        radial-gradient(circle at 20% 20%,rgba(80,217,144,.34),transparent 26%);
    }
    .memory-panel::before {
      content:'';
      position:absolute;
      width:300px;height:300px;
      right:-120px;top:-90px;
      border-radius:50%;
      background:rgba(80,217,144,.18);
      filter:blur(6px);
    }
    .memory-panel::after {
      content:'';
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.07) 1px, transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 85%);
      pointer-events:none;
    }
    .brand {
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:900;
      font-size:1.35rem;
      letter-spacing:-.02em;
    }
    .brand-mark {
      width:46px;height:46px;
      display:grid;place-items:center;
      border-radius:16px;
      background:linear-gradient(135deg,#1a8e52,#5de49a);
      box-shadow:0 10px 26px rgba(0,0,0,.18),0 0 0 6px rgba(255,255,255,.08);
      font-size:1.45rem;
    }
    .panel-copy { position:relative;z-index:1;margin-top:auto; }
    .panel-badge {
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-bottom:18px;
      padding:8px 12px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      background:rgba(255,255,255,.1);
      color:#c9f7dc;
      font-size:.78rem;
      font-weight:800;
    }
    .panel-copy h1 {
      max-width:310px;
      font-size:2.55rem;
      line-height:1.08;
      letter-spacing:0;
      font-weight:900;
    }
    .panel-copy p {
      max-width:300px;
      margin-top:16px;
      color:rgba(255,255,255,.76);
      font-size:.95rem;
      line-height:1.65;
      font-weight:500;
    }
    .memory-stack {
      position:relative;
      z-index:1;
      margin-top:42px;
      display:grid;
      gap:12px;
    }
    .memory-note {
      width:min(280px,100%);
      padding:14px 16px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      background:rgba(255,255,255,.1);
      box-shadow:0 14px 28px rgba(0,0,0,.12);
    }
    .memory-note:nth-child(2) { margin-left:34px;background:rgba(255,255,255,.15); }
    .note-date { color:#b9f3d1;font-size:.72rem;font-weight:800; }
    .note-text { margin-top:6px;color:#fff;font-size:.86rem;font-weight:700;line-height:1.42; }

    .form-panel {
      display:flex;
      align-items:center;
      justify-content:center;
      padding:44px;
      background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(250,255,252,.82));
    }
    .form-box { width:100%;max-width:380px; }
    .form-kicker {
      margin-bottom:10px;
      color:var(--leaf);
      font-size:.78rem;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .form-title { font-size:2rem;font-weight:900;letter-spacing:0;color:var(--text); }
    .form-desc { margin:8px 0 30px;color:var(--muted);font-size:.92rem;line-height:1.55;font-weight:500; }
    .input-group { position:relative;margin-bottom:15px; }
    .input-label { display:block;margin-bottom:8px;color:var(--forest);font-size:.78rem;font-weight:800;letter-spacing:.02em; }
    .input-wrap { position:relative;display:flex;align-items:center; }
    .input-icon { position:absolute;left:15px;z-index:2;font-size:1.05rem;pointer-events:none;transition:transform .2s; }
    input[type=email], input[type=password], input[type=text] {
      width:100%;
      height:54px;
      padding:0 48px 0 46px;
      border:1.5px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.82);
      color:var(--text);
      font-family:'Outfit',sans-serif;
      font-size:.96rem;
      font-weight:600;
      outline:none;
      transition:border-color .22s,box-shadow .22s,background-color .22s,transform .22s;
    }
    input:focus { border-color:var(--mint);background:#fff;box-shadow:0 0 0 5px var(--glow); }
    .input-wrap:focus-within .input-icon { transform:scale(1.12); }
    .input-suffix {
      position:absolute;
      right:10px;
      width:34px;height:34px;
      display:grid;place-items:center;
      border:0;border-radius:50%;
      background:rgba(80,217,144,.14);
      color:var(--muted);
      cursor:pointer;
      transition:background-color .2s,color .2s,transform .2s;
    }
    .input-suffix:hover,.input-suffix:focus-visible { color:var(--leaf);background:rgba(80,217,144,.26);outline:none;transform:scale(1.04); }
    .input-suffix svg { width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }
    .input-suffix .eye-off-icon { display:none; }
    .input-suffix.is-visible .eye-icon { display:none; }
    .input-suffix.is-visible .eye-off-icon { display:block; }
    .input-hint {
      width:fit-content;
      max-width:100%;
      height:0;
      margin-top:0;
      padding:0 10px;
      overflow:hidden;
      border:1px solid rgba(80,217,144,.23);
      border-radius:999px;
      background:rgba(255,255,255,.88);
      color:var(--leaf);
      opacity:0;
      transform:translateY(-4px);
      box-shadow:0 8px 18px rgba(7,59,36,.06);
      font-size:.73rem;
      font-weight:900;
      line-height:24px;
      white-space:nowrap;
      pointer-events:none;
      transition:height .18s,margin-top .18s,opacity .18s,transform .18s,color .18s,background-color .18s,border-color .18s;
    }
    .input-group:focus-within .input-hint { height:26px;margin-top:8px;opacity:1;transform:translateY(0); }
    .input-hint.warning { color:var(--warn);background:rgba(255,251,235,.92);border-color:rgba(217,119,6,.24); }

    .form-options {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:8px 0 24px;
      color:var(--muted);
      font-size:.84rem;
      font-weight:700;
    }
    .remember { display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none; }
    .remember input { width:16px;height:16px;accent-color:var(--leaf); }
    .remember span { transition:color .2s,font-weight .2s; }
    .remember input:checked + span { color:var(--leaf);font-weight:900; }
    .sub-link { border:0;background:transparent;color:var(--leaf);font:inherit;font-weight:900;cursor:pointer; }
    .sub-link:hover { color:var(--forest); }
    .btn-primary {
      width:100%;
      height:54px;
      border:0;
      border-radius:18px;
      background:linear-gradient(135deg,#093d26,#16874b 56%,#50d990);
      color:#fff;
      box-shadow:0 14px 32px rgba(22,135,75,.3);
      font-family:'Outfit',sans-serif;
      font-size:1rem;
      font-weight:900;
      cursor:pointer;
      transition:transform .2s,box-shadow .2s,filter .2s;
    }
    .btn-primary:hover { transform:translateY(-2px);box-shadow:0 18px 40px rgba(22,135,75,.38);filter:saturate(1.06); }
    .btn-primary:active { transform:translateY(0); }
    .message {
      height:0;
      margin-top:0;
      overflow:hidden;
      color:var(--warn);
      opacity:0;
      font-size:.78rem;
      font-weight:900;
      line-height:22px;
      transition:height .18s,margin-top .18s,opacity .18s;
    }
    .message.show { height:22px;margin-top:10px;opacity:1; }
    .divider { display:flex;align-items:center;gap:12px;margin:26px 0 18px;color:var(--muted);font-size:.8rem;font-weight:800; }
    .divider::before,.divider::after { content:'';flex:1;height:1px;background:var(--line); }
    .social-row { display:flex;justify-content:center;gap:38px; }
    .social-btn {
      position:relative;
      width:48px;height:48px;
      display:grid;place-items:center;
      border:0;border-radius:50%;
      background:transparent;
      cursor:pointer;
      transition:transform .2s;
    }
    .social-btn:hover,.social-btn:focus-visible { transform:translateY(-4px);outline:none; }
    .social-btn::after {
      content:attr(data-label);
      position:absolute;
      top:calc(100% + 8px);
      left:50%;
      transform:translate(-50%,-4px);
      padding:5px 10px;
      border:1px solid rgba(80,217,144,.22);
      border-radius:999px;
      background:rgba(255,255,255,.94);
      color:var(--forest);
      box-shadow:0 8px 18px rgba(7,59,36,.08);
      font-size:.72rem;
      font-weight:900;
      line-height:1;
      white-space:nowrap;
      opacity:0;
      visibility:hidden;
      transition:opacity .18s,transform .18s,visibility .18s;
      pointer-events:none;
    }
    .social-btn:hover::after,.social-btn:focus-visible::after { opacity:1;visibility:visible;transform:translate(-50%,0); }
    .social-logo { width:40px;height:40px;display:grid;place-items:center;border-radius:50%;overflow:hidden;box-shadow:0 8px 18px rgba(7,59,36,.13);transition:transform .2s,box-shadow .2s; }
    .social-btn:hover .social-logo,.social-btn:focus-visible .social-logo { transform:scale(1.07);box-shadow:0 12px 24px rgba(7,59,36,.18); }
    .social-logo svg { width:100%;height:100%;display:block; }
    .social-logo.kakao { background:#fee500; }
    .social-logo.naver { background:#03c75a; }
    .social-logo.google { background:#fff;border:1px solid rgba(7,59,36,.08); }
    .signup-link { margin-top:36px;text-align:center;color:var(--muted);font-size:.85rem;font-weight:600; }
    .signup-link a { color:var(--leaf);font-weight:900;text-decoration:none; }
    .signup-link a:hover { color:var(--forest); }
    @keyframes shakeInput { 0%,100%{transform:translateX(0);border-color:var(--line)} 20%,60%{transform:translateX(-6px);border-color:#f87171;box-shadow:0 0 0 4px rgba(248,113,113,.18)} 40%,80%{transform:translateX(6px)} }
    @media(max-width:820px) {
      body { padding:18px;align-items:start; }
      .login-shell { grid-template-columns:1fr;min-height:0;border-radius:24px; }
      .memory-panel { min-height:300px;padding:30px; }
      .panel-copy h1 { font-size:2.05rem; }
      .memory-stack { display:none; }
      .form-panel { padding:34px 24px; }
    }
  </style>
<link rel="stylesheet" href="../02-main/css/global-theme.css">
</head>
<body>
  <main class="login-shell">
    <section class="memory-panel" aria-label="Clov 소개">
      <div class="brand">
        <div class="brand-mark"><img src="../assets/ai-style/clov_logo_half_leaf_cartoon_transparent.png" alt="Clov 로고" style="width:28px;height:28px;object-fit:contain;"></div>
        <span>Clov.</span>
      </div>
      <div class="panel-copy">
        <div class="panel-badge">오늘도 추억 보관 중</div>
        <h1>친구와 남긴 순간으로 돌아가기</h1>
        <p>약속, 기록, 편지를 한 곳에서 다시 열어보고 이어갈 수 있어요.</p>
        <div class="memory-stack" aria-hidden="true">
          <div class="memory-note">
            <div class="note-date">JUN 29</div>
            <div class="note-text">다음 만남 일정이 기록됐어요.</div>
          </div>
          <div class="memory-note">
            <div class="note-date">MEMORY FEED</div>
            <div class="note-text">친구가 남긴 편지가 도착했어요.</div>
          </div>
        </div>
      </div>
    </section>

    <section class="form-panel">
      <div class="form-box">
        <div class="form-kicker">Welcome Back</div>
        <h2 class="form-title">로그인</h2>
        <p class="form-desc">이메일과 비밀번호로 Clov.에 다시 입장해 주세요.</p>

        <div class="input-group">
          <label class="input-label" for="email">이메일</label>
          <div class="input-wrap">
            <span class="input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
            <input type="email" id="email" placeholder="example@email.com" autocomplete="email" />
          </div>
          <div class="input-hint">사용자님의 이메일을 입력해주세요.</div>
        </div>

        <div class="input-group">
          <label class="input-label" for="pw">비밀번호</label>
          <div class="input-wrap">
            <span class="input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            <input type="password" id="pw" placeholder="비밀번호를 입력해주세요" autocomplete="current-password" />
            <button class="input-suffix" type="button" onclick="togglePw('pw', this)" aria-label="비밀번호 보이기" aria-pressed="false">
              <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 10.6A2 2 0 0 0 13.4 13.4"></path>
                <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.1 4.1"></path>
                <path d="M6.6 6.7C3.6 8.7 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4.2-.9"></path>
              </svg>
            </button>
          </div>
          <div class="input-hint" id="pw-hint">지금은 비밀번호가 안보여요!</div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="remember" />
            <span>로그인 유지</span>
          </label>
          <button class="sub-link" type="button" onclick="showMessage('비밀번호 찾기 기능은 OAuth2 연동 단계에서 연결할 예정입니다.')">비밀번호 찾기</button>
        </div>

        <button class="btn-primary" type="button" onclick="login()">Clov. 입장하기</button>
        <div class="message" id="message"></div>

        <div class="divider">간편 로그인</div>
        <div class="social-row">
          <button class="social-btn" type="button" data-provider="kakao" data-label="카카오 로그인" aria-label="카카오 OAuth2 로그인">
            <span class="social-logo kakao" aria-hidden="true">
              <svg viewBox="0 0 32 32" role="img"><path d="M16 7.2c-5.55 0-10.05 3.55-10.05 7.93 0 2.83 1.9 5.32 4.75 6.72l-.86 3.15c-.08.3.26.54.52.37l3.77-2.49c.6.09 1.22.14 1.87.14 5.55 0 10.05-3.55 10.05-7.93S21.55 7.2 16 7.2Z" fill="#191919"/></svg>
            </span>
          </button>
          <button class="social-btn" type="button" data-provider="naver" data-label="네이버 로그인" aria-label="네이버 OAuth2 로그인">
            <span class="social-logo naver" aria-hidden="true">
              <svg viewBox="0 0 32 32" role="img"><path d="M18.5 16.4 13.25 8.8H8.8v14.4h4.7v-7.6l5.25 7.6h4.45V8.8h-4.7v7.6Z" fill="#fff"/></svg>
            </span>
          </button>
          <button class="social-btn" type="button" data-provider="google" data-label="구글 로그인" aria-label="구글 OAuth2 로그인">
            <span class="social-logo google" aria-hidden="true">
              <svg viewBox="0 0 32 32" role="img">
                <path d="M28.1 16.32c0-.86-.08-1.68-.22-2.48H16.3v4.69h6.63a5.66 5.66 0 0 1-2.46 3.72v3.04h3.98c2.33-2.15 3.65-5.31 3.65-8.97Z" fill="#4285f4"/>
                <path d="M16.3 28.2c3.33 0 6.12-1.1 8.15-2.91l-3.98-3.04c-1.1.74-2.52 1.18-4.17 1.18-3.2 0-5.92-2.16-6.89-5.07H5.3v3.14a12.28 12.28 0 0 0 11 6.7Z" fill="#34a853"/>
                <path d="M9.41 18.36a7.36 7.36 0 0 1 0-4.72V10.5H5.3a12.32 12.32 0 0 0 0 11l4.11-3.14Z" fill="#fbbc05"/>
                <path d="M16.3 8.57c1.81 0 3.44.62 4.72 1.85l3.52-3.52A11.98 11.98 0 0 0 16.3 3.8a12.28 12.28 0 0 0-11 6.7l4.11 3.14c.97-2.91 3.69-5.07 6.89-5.07Z" fill="#ea4335"/>
              </svg>
            </span>
          </button>
        </div>

        <div class="signup-link">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></div>
      </div>
    </section>
  </main>

  <script>
    function togglePw(id, button) {
      const el = document.getElementById(id);
      const hint = document.getElementById('pw-hint');
      const isVisible = el.type === 'text';
      el.type = isVisible ? 'password' : 'text';
      if (hint) {
        hint.textContent = isVisible ? '지금은 비밀번호가 안보여요!' : '조심하세요! 비밀번호가 보여요!';
        hint.classList.toggle('warning', !isVisible);
      }
      if (button) {
        button.classList.toggle('is-visible', !isVisible);
        button.setAttribute('aria-pressed', String(!isVisible));
        button.setAttribute('aria-label', isVisible ? '비밀번호 보이기' : '비밀번호 숨기기');
      }
    }

    function shake(id) {
      const el = document.getElementById(id);
      el.style.animation = 'none';
      requestAnimationFrame(() => { el.style.animation = 'shakeInput .4s ease'; });
      el.focus();
    }

    function showMessage(text) {
      const message = document.getElementById('message');
      message.textContent = text;
      message.classList.add('show');
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => message.classList.remove('show'), 2600);
    }

    function login() {
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('pw').value;
      if (!/\S+@\S+\.\S+/.test(email)) { shake('email'); return; }
      if (!pw) { shake('pw'); return; }
      window.location.href = '../03-rooms/makerooms.html';
    }
  </script>
</body>
</html>
