<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#d8ddd2;font-family:'Gothic A1',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh}
  @keyframes spin7{to{transform:rotate(360deg)}}
  @keyframes dust7{0%{transform:translate(0,0);opacity:0}20%{opacity:.8}100%{transform:translate(var(--dx,10px),-70px);opacity:0}}
  @keyframes grain7{0%,100%{opacity:.5}50%{opacity:.85}}
  @keyframes glowpulse7{0%,100%{opacity:.5}50%{opacity:.72}}
  @keyframes sitpulse7{0%,100%{box-shadow:0 10px 26px rgba(27,67,50,.5),0 0 0 0 rgba(82,183,136,.55)}70%{box-shadow:0 10px 26px rgba(27,67,50,.5),0 0 0 14px rgba(82,183,136,0)}}
  @keyframes kenburns7{0%{transform:scale(1.06) translate(0,0)}100%{transform:scale(1.18) translate(-2%,-2%)}}
</style>
</helmet>

<div style="position:relative;width:1000px;max-width:100%;aspect-ratio:1000/640;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(20,14,6,.32);background:#0a0809;font-family:'Gothic A1',sans-serif">

  <!-- ============ LOBBY (before entering) ============ -->
  <div id="lobby7" style="position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg,linear-gradient(150deg,#f6eddf 0%,#dfeadd 46%,#c8ddd4 100%))">
    <div style="padding:30px 34px 0">
      <span style="display:block;font:700 12px 'Space Mono';letter-spacing:2.5px;color:#52b788">LIFE FOUR CUT</span>
      <span style="display:block;font:900 26px 'Gothic A1';color:#1b4332;margin-top:6px">전체 약속 보기</span>
      <span style="display:block;font:600 13.5px 'Gothic A1';color:#61766a;margin-top:7px;max-width:520px">제안하기부터 만남까지, 네 장의 인증사진이 모이면 인생4컷처럼 완성됩니다.</span>
    </div>

    <!-- movie poster: single key photo -->
    <div style="margin:22px 34px 0;flex:1;border-radius:16px;overflow:hidden;position:relative;background:radial-gradient(120% 92% at 50% -12%,#3a2340,#170f24 58%,#0b0912 100%);box-shadow:inset 0 0 0 6px #1c1327,inset 0 0 0 8px rgba(212,175,90,.5),0 18px 40px rgba(0,0,0,.4)">
      <!-- hero: 완성작들의 '만남' 컷 자동 슬라이드 (켄번즈 + 크로스페이드) -->
      <div id="posterslides" style="position:absolute;inset:0;z-index:1;overflow:hidden;background:#0b0912">
        <sc-for list="{{ posterSlides }}" as="s" hint-placeholder-count="3">
          <div style="position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;background:{{ s.bg }};background-size:cover;background-position:center;animation:kenburns7 11s ease-in-out infinite alternate;will-change:transform,opacity"></div>
        </sc-for>
      </div>
      <!-- now playing chip -->
      <div style="position:absolute;top:24px;right:30px;z-index:3;font:700 10.5px 'Space Mono';letter-spacing:1px;color:#ffd27a;background:rgba(0,0,0,.38);border:1px solid rgba(212,175,90,.32);border-radius:999px;padding:5px 12px">지금 상영 · <span id="nowplaying7">제주도 우정여행</span></div>
      <!-- cinematic scrim for legibility -->
      <div style="position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(0deg,rgba(9,7,15,.94) 0%,rgba(9,7,15,.5) 30%,rgba(9,7,15,.06) 54%,rgba(9,7,15,.42) 100%)"></div>
      <!-- marquee bulbs -->
      <div style="position:absolute;top:11px;left:34px;right:34px;height:8px;z-index:3;background:radial-gradient(circle,#ffe6a2 0 2.2px,transparent 3px) 0 50%/19px 8px repeat-x;filter:drop-shadow(0 0 4px rgba(255,214,120,.85))"></div>
      <!-- title block, bottom-left (one-sheet) -->
      <div style="position:absolute;left:32px;right:32px;bottom:52px;z-index:3">
        <span style="display:block;font:700 11px 'Space Mono';letter-spacing:4px;color:#ffd27a;margin-bottom:9px">◉ NOW SHOWING</span>
        <div style="font:900 40px 'Gothic A1';color:#f7efe0;letter-spacing:-1px;text-shadow:0 3px 22px rgba(0,0,0,.7)">인생4컷 극장</div>
        <div style="font:600 13.5px 'Gothic A1';color:#dccfba;margin-top:7px;text-shadow:0 1px 8px rgba(0,0,0,.7)">제안부터 만남까지 — 네 컷으로 완성된 우리의 이야기</div>
      </div>
      <!-- bottom marquee bar -->
      <div style="position:absolute;left:0;right:0;bottom:0;height:38px;z-index:3;background:linear-gradient(#1c1327,#120c1c);border-top:1px solid rgba(212,175,90,.4);display:flex;align-items:center;justify-content:space-between;padding:0 26px">
        <span style="font:700 10.5px 'Space Mono';letter-spacing:1.5px;color:#ffd27a">TODAY · 3편 상영</span>
        <span style="font:700 10.5px 'Space Mono';letter-spacing:1.5px;color:#8a8272">clov. memories</span>
      </div>
    </div>

    <!-- filter row w/ 입장하기 -->
    <div style="display:flex;align-items:center;gap:9px;padding:16px 34px 26px;flex-wrap:wrap">
      <span style="font:700 12.5px 'Gothic A1';color:#1b4332;background:#edf4ec;border-radius:999px;padding:8px 15px">완료된 약속 <b style="color:#357a58">3</b></span>
      <span style="font:700 12.5px 'Gothic A1';color:#79ad90;padding:8px 6px">다가오는 약속 5</span>
      <span style="flex:1"></span>
      <button onClick="{{ onEnter }}" style="display:inline-flex;align-items:center;gap:8px;background:#357a58;color:#fff;border:none;border-radius:999px;padding:12px 22px;font:800 14px 'Gothic A1';cursor:pointer;box-shadow:0 6px 16px rgba(27,67,50,.28)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H5a2 2 0 0 1-2-2 2 2 0 0 0 0-4z"></path><path d="M13 6v1.5M13 16.5V18M13 11v2"></path></svg>
        입장하기
      </button>
    </div>
  </div>

  <!-- ============ THEATER ============ -->
  <div id="theater7" style="position:absolute;inset:0;z-index:20;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 22%,#241c26,#0a0809 80%);perspective:1100px">

    <!-- dolly scene -->
    <div id="scene7" style="position:absolute;inset:0;transform-origin:50% 92%;transform:scale(.68) translateY(-6px);z-index:3">
      <!-- side seat walls -->
      <div style="position:absolute;left:0;bottom:0;width:22%;height:76%;background:repeating-linear-gradient(0deg,#150f18 0 22px,#231b28 22px 38px);transform:perspective(360px) rotateY(32deg);transform-origin:left bottom;opacity:.92"></div>
      <div style="position:absolute;right:0;bottom:0;width:22%;height:76%;background:repeating-linear-gradient(0deg,#150f18 0 22px,#231b28 22px 38px);transform:perspective(360px) rotateY(-32deg);transform-origin:right bottom;opacity:.92"></div>
      <!-- aisle floor -->
      <div style="position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:20%;height:54%;background:linear-gradient(#2c2436,#0c0a0d);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);opacity:.8"></div>

      <!-- SCREEN -->
      <div style="position:absolute;left:50%;top:8%;transform:translateX(-50%);width:56%;aspect-ratio:16/10;background:#0b0b0e;border:9px solid #1a1512;border-radius:6px;box-shadow:0 0 0 2px #000,0 26px 60px rgba(0,0,0,.66);padding:16px;overflow:hidden">

        <!-- screening content -->
        <div id="shot7" style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0">
          <!-- filmstrip: 4 stage cuts -->
          <div style="position:relative;width:100%;background:#141013;border-radius:5px;padding:11px 9px;box-shadow:0 8px 20px rgba(0,0,0,.5)">
            <div style="position:absolute;top:3px;left:6px;right:6px;height:6px;background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(235,235,222,.8) 7px 13px);border-radius:2px"></div>
            <div style="position:absolute;bottom:3px;left:6px;right:6px;height:6px;background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(235,235,222,.8) 7px 13px);border-radius:2px"></div>
            <div id="strip7" style="display:flex;gap:7px;padding:5px 2px">
              <sc-for list="{{ frames }}" as="f" hint-placeholder-count="4">
                <div style="position:relative;flex:1;aspect-ratio:3/4;border-radius:3px;overflow:hidden;background:{{ f.bg }};box-shadow:0 2px 6px rgba(0,0,0,.4)">
                  <span style="position:absolute;left:0;right:0;bottom:0;font:700 8.5px 'Gothic A1';color:#fff;text-align:center;padding:3px 0;background:linear-gradient(transparent,rgba(0,0,0,.6))">{{ f.label }}</span>
                </div>
              </sc-for>
            </div>
          </div>
          <!-- caption -->
          <div style="text-align:center">
            <div id="sttitle7" style="font:800 16px 'Gothic A1';color:#f4f1e8">{{ title }}</div>
            <div style="font:700 11px 'Space Mono';color:#a9b3a6;letter-spacing:.5px;margin-top:2px"><span id="stdate7">{{ dateText }}</span> · clov. memories</div>
          </div>
        </div>

        <!-- projector flicker glow -->
        <div id="scrglow7" style="position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#fff,rgba(255,255,255,.35));opacity:0;mix-blend-mode:screen;pointer-events:none;z-index:9"></div>
        <!-- film grain -->
        <div id="grain7" style="position:absolute;inset:0;opacity:0;pointer-events:none;z-index:8;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);mix-blend-mode:overlay;animation:grain7 .32s steps(2) infinite"></div>

        <!-- countdown leader -->
        <div id="count7" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font:700 34px 'Space Mono';color:#fff;opacity:0;z-index:7;text-shadow:0 0 12px rgba(255,255,255,.7);overflow:hidden"><span style="position:absolute;left:50%;top:0;width:2px;height:50%;background:rgba(255,255,255,.7);transform-origin:bottom center;animation:spin7 1s linear infinite"></span><span id="countnum7">3</span></div>

        <!-- curtains -->
        <div id="curtL7" style="position:absolute;top:0;bottom:0;left:0;width:58%;z-index:6;transform-origin:left center;background:repeating-linear-gradient(90deg,#14311f 0 9px,#2e5233 9px 20px,#3a6b43 20px 24px);box-shadow:inset -12px 0 20px rgba(0,0,0,.55)"></div>
        <div id="curtR7" style="position:absolute;top:0;bottom:0;right:0;width:58%;z-index:6;transform-origin:right center;background:repeating-linear-gradient(90deg,#3a6b43 0 4px,#2e5233 4px 15px,#14311f 15px 24px);box-shadow:inset 12px 0 20px rgba(0,0,0,.55)"></div>
        <div style="position:absolute;top:0;left:0;right:0;height:20px;z-index:8;background:linear-gradient(#3a6b43,#14311f);border-bottom:2px solid rgba(212,175,90,.55);box-shadow:0 3px 8px rgba(0,0,0,.45)"></div>
      </div>

      <!-- projector beam + dust -->
      <div id="beam7" style="position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:60%;height:64%;opacity:0;z-index:2;background:linear-gradient(0deg,rgba(206,232,255,0),rgba(206,232,255,.14));clip-path:polygon(42% 100%,58% 100%,96% 0,4% 0);mix-blend-mode:screen;pointer-events:none">
        <sc-if value="{{ showDust }}" hint-placeholder-val="{{ true }}">
          <div id="dustwrap7" style="position:absolute;inset:0"></div>
        </sc-if>
      </div>
    </div>

    <!-- screen spill onto seats -->
    <div id="spill7" style="position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);width:70%;height:64%;border-radius:50%;background:radial-gradient(circle,rgba(206,232,255,.26),transparent 66%);opacity:0;z-index:5;mix-blend-mode:screen;pointer-events:none"></div>

    <!-- house lights -->
    <div id="house7" style="position:absolute;left:0;right:0;top:0;height:34%;background:radial-gradient(ellipse at 50% 0,rgba(255,224,170,.5),transparent 72%);opacity:.5;z-index:6;pointer-events:none"></div>

    <!-- foreground seat row -->
    <div id="seats7" style="position:absolute;left:-2%;right:-2%;bottom:0;height:22%;transform:translateY(100%);z-index:10">
      <div style="position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(180deg,#100b0e,#050304);border-radius:52px 52px 0 0"></div>
      <div style="position:absolute;bottom:44%;left:8%;width:58px;height:62px;border-radius:50% 50% 44% 44%;background:#0a0709"></div>
      <div style="position:absolute;bottom:44%;left:30%;width:64px;height:66px;border-radius:50% 50% 44% 44%;background:#0a0709"></div>
      <div style="position:absolute;bottom:44%;left:54%;width:60px;height:64px;border-radius:50% 50% 44% 44%;background:#0a0709"></div>
      <div style="position:absolute;bottom:44%;left:78%;width:56px;height:60px;border-radius:50% 50% 44% 44%;background:#0a0709"></div>
    </div>

    <!-- controls -->
    <button id="exit7" onClick="{{ onExit }}" style="position:absolute;left:16px;top:16px;z-index:16;opacity:0;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);color:#f4f1e8;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px;font:800 12px 'Gothic A1';cursor:pointer;backdrop-filter:blur(4px)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>나가기
    </button>

    <button id="sit7" onClick="{{ onSit }}" style="position:absolute;left:50%;bottom:24%;transform:translate(-50%,0);z-index:16;opacity:0;pointer-events:none;display:inline-flex;align-items:center;gap:9px;background:#357a58;color:#fff;border:none;border-radius:999px;padding:15px 28px;font:800 15px 'Gothic A1';cursor:pointer;animation:sitpulse7 2.2s ease-out infinite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v5"></path><path d="M4 11h16v5H4z"></path><path d="M6 16v3M18 16v3"></path></svg>
      착석하기
    </button>

    <div id="nav7" style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:16;opacity:0;display:flex;align-items:center;gap:16px">
      <button onClick="{{ onPrev }}" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#f4f1e8;font:700 18px 'Gothic A1';cursor:pointer;backdrop-filter:blur(4px)">‹</button>
      <span id="counter7" style="font:700 12px 'Space Mono';color:#f4f1e8;letter-spacing:1px;min-width:52px;text-align:center">{{ counter }}</span>
      <button onClick="{{ onNext }}" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#f4f1e8;font:700 18px 'Gothic A1';cursor:pointer;backdrop-filter:blur(4px)">›</button>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:640},&quot;showCountdown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;연출&quot;},&quot;showDust&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;연출&quot;},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;연출&quot;}}">
class Component extends DCLogic {
  state = { active: 0 };

  _memories() {
    const S = (a, b) => `radial-gradient(circle at 34% 28%,${a} 0 34%,transparent 60%),linear-gradient(155deg,${b})`;
    const stages = ['제안하기', '일정 맞추기', '약속 확정', '만남'];
    const data = [
      { title: '제주도 우정여행', date: '2026. 5. 18 (월)', palettes: ['#ffd59e,#e9a06a,#c9743e', '#f3ece0,#d9cdb3,#bcae8f', '#bfe6c8,#6fbf87,#2e8b57', '#ffc7a0,#e88a63,#b6503a'] },
      { title: '생일 서프라이즈', date: '2026. 6. 2 (화)', palettes: ['#ffd1e0,#f39ab7,#d2597f', '#e4e9f5,#b9c4e6,#8b9bd0', '#ffe6a6,#f4c95c,#d19b28', '#ffb3c1,#f0728d,#c53d5c'] },
      { title: '한강 야간 피크닉', date: '2026. 6. 21 (일)', palettes: ['#cfe0ff,#8fb0f0,#5c78d0', '#d7e8d0,#a8cf9c,#6fae72', '#e9dcff,#c3a4ff,#7c5cff', '#c9d6ff,#8a9be8,#4a5fb0'] }
    ];
    return data.map(m => ({
      title: m.title,
      date: m.date,
      frames: m.palettes.map((p, i) => {
        const parts = p.split(',').map(s => s.trim());
        return { label: stages[i], bg: S(parts[0], p) };
      })
    }));
  }

  _anim(id, frames, opts) {
    const el = document.getElementById(id);
    if (!el) return null;
    return el.animate(frames, Object.assign({ fill: 'forwards', easing: 'cubic-bezier(.2,.8,.2,1)' }, opts));
  }
  _reset(ids) {
    ids.forEach(id => { const el = document.getElementById(id); if (el) el.getAnimations().forEach(a => a.cancel()); });
  }

  _dust() {
    if (!(this.props.showDust ?? true)) return;
    const w = document.getElementById('dustwrap7');
    if (!w) return;
    w.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const d = document.createElement('div');
      const sz = 2 + Math.random() * 3;
      d.style.cssText = `position:absolute;left:${10 + Math.random() * 80}%;bottom:${Math.random() * 40}%;width:${sz}px;height:${sz}px;border-radius:50%;background:rgba(230,240,255,.9);--dx:${(Math.random() * 30 - 15)}px;animation:dust7 ${4 + Math.random() * 4}s linear ${Math.random() * 4}s infinite`;
      w.appendChild(d);
    }
  }

  // STEP 1 — 극장 입장: 하우스 조명 켜진 채 통로로 전진, 착석하기 버튼 표시
  _enter() {
    this._reset(['scene7', 'seats7', 'house7', 'scrglow7', 'grain7', 'shot7', 'nav7', 'exit7', 'curtL7', 'curtR7', 'count7', 'spill7', 'beam7', 'sit7']);
    (this._ticks || []).forEach(clearTimeout); this._ticks = [];

    const th = document.getElementById('theater7');
    if (th) { th.style.pointerEvents = 'auto'; th.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 340, fill: 'forwards' }); }
    const lb = document.getElementById('lobby7');
    if (lb) { lb.style.pointerEvents = 'none'; lb.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }); }

    // 통로로 전진 (하우스 조명은 켜진 상태 유지)
    this._anim('scene7', [{ transform: 'scale(.68) translateY(-6px)' }, { transform: 'scale(1) translateY(0)' }], { duration: 1000, easing: 'cubic-bezier(.2,.7,.3,1)' });
    this._anim('exit7', [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 900 });
    // 착석하기 버튼 등장
    const sit = document.getElementById('sit7');
    if (sit) { sit.style.pointerEvents = 'auto'; sit.animate([{ opacity: 0, transform: 'translate(-50%,14px)' }, { opacity: 1, transform: 'translate(-50%,0)' }], { duration: 460, delay: 1000, fill: 'forwards' }); }
  }

  // STEP 2 — 착석: 앞좌석이 올라오고 소등 → 커튼 → 3·2·1 → 상영
  _sit() {
    const BOUNCE = 'cubic-bezier(.34,1.56,.64,1)';
    const cd = this.props.showCountdown ?? true;
    this._ticks = this._ticks || [];

    // 착석하기 버튼 숨김
    const sit = document.getElementById('sit7');
    if (sit) { sit.style.pointerEvents = 'none'; sit.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, fill: 'forwards' }); }

    // 착석 (앞좌석 실루엣이 털썩 올라옴)
    this._anim('seats7', [{ transform: 'translateY(100%)' }, { transform: 'translateY(-5%)', offset: .8 }, { transform: 'translateY(0)' }], { duration: 680, delay: 80, easing: BOUNCE });
    this._anim('scene7', [{ transform: 'scale(1) translateY(0)' }, { transform: 'scale(1) translateY(1.2%)', offset: .5 }, { transform: 'scale(1) translateY(0)' }], { duration: 320, delay: 360 });
    // 소등
    this._anim('house7', [{ opacity: .5 }, { opacity: 0 }], { duration: 460, delay: 720 });
    // 커튼
    this._anim('curtL7', [{ transform: 'translateX(0)' }, { transform: 'translateX(-104%)' }], { duration: 720, delay: 1180, easing: 'cubic-bezier(.5,0,.2,1)' });
    this._anim('curtR7', [{ transform: 'translateX(0)' }, { transform: 'translateX(104%)' }], { duration: 720, delay: 1180, easing: 'cubic-bezier(.5,0,.2,1)' });

    let screenAt = 2020;
    if (cd) {
      const tick = (n, t) => this._ticks.push(setTimeout(() => {
        const el = document.getElementById('count7'), num = document.getElementById('countnum7');
        if (!el) return;
        if (num) num.textContent = n;
        el.getAnimations().forEach(a => a.cancel());
        el.animate([
          { opacity: 0, transform: 'translate(-50%,-50%) scale(1.5)' },
          { opacity: 1, transform: 'translate(-50%,-50%) scale(1)', offset: .35 },
          { opacity: 1, transform: 'translate(-50%,-50%) scale(1)', offset: .82 },
          { opacity: 0, transform: 'translate(-50%,-50%) scale(.85)' }
        ], { duration: 400, fill: 'forwards' });
      }, t));
      tick('3', 2060); tick('2', 2480); tick('1', 2900);
      screenAt = 3420;
    }

    // 영사 빔 + 먼지
    this._anim('beam7', [{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: 1360 });
    this._dust();
    // 스크린 점등 + 상영
    this._anim('scrglow7', [{ opacity: 0 }, { opacity: .95, offset: .3 }, { opacity: 0 }], { duration: 560, delay: screenAt });
    this._anim('grain7', [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: screenAt + 200 });
    this._anim('spill7', [{ opacity: 0 }, { opacity: 1 }], { duration: 560, delay: screenAt + 40 });
    this._anim('shot7', [{ opacity: 0 }, { opacity: 1, offset: .5 }, { opacity: .82, offset: .62 }, { opacity: 1 }], { duration: 720, delay: screenAt + 60 });
    this._anim('nav7', [{ opacity: 0 }, { opacity: 1 }], { duration: 440, delay: screenAt + 760 });
  }

  _filmAdvance(dir) {
    // quick projector flicker + strip slide when switching memory
    const strip = document.getElementById('strip7');
    if (strip) strip.animate([
      { transform: `translateX(${dir * 46}px)`, filter: 'blur(3px)', opacity: .2 },
      { transform: 'translateX(0)', filter: 'blur(0)', opacity: 1 }
    ], { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
    this._anim('scrglow7', [{ opacity: 0 }, { opacity: .6, offset: .3 }, { opacity: 0 }], { duration: 300 });
  }

  _startPoster() {
    clearInterval(this._posterTimer);
    const wrap = document.getElementById('posterslides');
    if (!wrap) return;
    const slides = [...wrap.children];
    if (!slides.length) return;
    const np = document.getElementById('nowplaying7');
    const mems = this._memories();
    const show = (n) => {
      slides.forEach((s, k) => { s.style.opacity = k === n ? '1' : '0'; });
      if (np && mems[n]) np.textContent = mems[n].title;
    };
    let i = 0; show(0);
    this._posterTimer = setInterval(() => { i = (i + 1) % slides.length; show(i); }, 3600);
  }

  componentDidMount() {
    setTimeout(() => this._startPoster(), 140);
    if (this.props.autoplay) { setTimeout(() => this._enter(), 400); setTimeout(() => this._sit(), 2200); }
  }

  componentWillUnmount() {
    clearInterval(this._posterTimer);
    (this._ticks || []).forEach(clearTimeout);
  }

  renderVals() {
    const mems = this._memories();
    const active = Math.max(0, Math.min(this.state.active, mems.length - 1));
    const cur = mems[active];

    const onEnter = () => this._enter();
    const onSit = () => this._sit();
    const onExit = () => {
      const th = document.getElementById('theater7'), lb = document.getElementById('lobby7');
      (this._ticks || []).forEach(clearTimeout); this._ticks = [];
      const sit = document.getElementById('sit7');
      if (sit) sit.style.pointerEvents = 'none';
      if (th) { th.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 320, fill: 'forwards' }); th.style.pointerEvents = 'none'; }
      if (lb) { lb.style.pointerEvents = 'auto'; lb.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 340, delay: 120, fill: 'forwards' }); }
    };
    const nav = (dir) => {
      const n = mems.length;
      this._active = ((this._active ?? this.state.active) + dir + n) % n;
      const m = mems[this._active];
      // imperative screen update (no re-render, so entry state persists)
      const t = document.getElementById('sttitle7'); if (t) t.textContent = m.title;
      const d = document.getElementById('stdate7'); if (d) d.textContent = m.date;
      const c = document.getElementById('counter7'); if (c) c.textContent = (this._active + 1) + ' / ' + n;
      const strip = document.getElementById('strip7');
      if (strip) [...strip.children].forEach((cell, i) => {
        if (!m.frames[i]) return;
        cell.style.background = m.frames[i].bg;
        const lb = cell.querySelector('span'); if (lb) lb.textContent = m.frames[i].label;
      });
      this._filmAdvance(dir);
    };

    return {
      title: cur.title,
      dateText: cur.date,
      frames: cur.frames,
      posterSlides: mems.map(m => ({ bg: m.frames[3].bg, title: m.title })),
      counter: (active + 1) + ' / ' + mems.length,
      showDust: this.props.showDust ?? true,
      onEnter, onSit, onExit,
      onPrev: () => nav(-1),
      onNext: () => nav(1)
    };
  }
}
</script>
</body>
</html>
