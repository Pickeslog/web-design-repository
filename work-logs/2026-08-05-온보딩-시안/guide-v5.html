<meta charset="utf-8">
<title>Clov 온보딩 v4 — 64px · 12색</title>
<style>
  :root{--px:4px;--ink:#14150e;--panel:#1a1f14;--acc:#9ccc65;--acc-d:#4a6330;--acc-l:#cfe3a8;--muted:#8fa876}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9e3d6;font-family:'Pretendard',system-ui,-apple-system,sans-serif;
    display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;
    padding:26px 16px 46px;color:#2b2b2b}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px}
  .cap{font-size:13px;font-weight:800}
  .sub{font-size:12px;color:#5a5a5a;line-height:1.65;text-align:center;max-width:340px}
  svg,img{display:block;image-rendering:pixelated}

  .phone{width:360px;height:640px;position:relative;background:var(--acc);padding:var(--px);
    box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),9px 9px 0 rgba(0,0,0,.16)}
  .inner{position:relative;width:100%;height:100%;background:var(--panel);overflow:hidden;
    box-shadow:inset 0 0 0 4px var(--acc-d)}
  .dots-bg{position:absolute;inset:0;opacity:.45;
    background-image:radial-gradient(var(--acc-d) 1px,transparent 1px);background-size:8px 8px}
  .watermark{position:absolute;inset:0;display:grid;place-items:center;opacity:.06}
  .corner{position:absolute;width:32px;height:32px;background:var(--panel);display:grid;place-items:center;
    box-shadow:0 -3px 0 var(--acc),0 3px 0 var(--acc),-3px 0 0 var(--acc),3px 0 0 var(--acc)}
  .tl{top:12px;left:12px}.tr{top:12px;right:12px}.bl{bottom:12px;left:12px}.br{bottom:12px;right:12px}
  .topbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--acc-d);padding:6px 14px;
    box-shadow:0 -3px 0 var(--acc),0 3px 0 var(--acc),-3px 0 0 var(--acc),3px 0 0 var(--acc)}
  .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:62px 22px 22px}
  .mascot{animation:bob 1.4s steps(2,end) infinite}
  @keyframes bob{0%,50%{transform:translateY(0)}51%,100%{transform:translateY(4px)}}
  .welcome{color:var(--acc-l);font-size:13px;font-weight:700;line-height:1.9;text-align:center}
  .bar{display:flex;gap:4px}.bar i{width:11px;height:13px;background:var(--acc-d)}.bar i.on{background:var(--acc)}
  .ask{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.06em}
  .row{display:flex;gap:9px}
  .pxbtn{border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:800;padding:11px 18px;
    background:var(--panel);color:var(--acc-l);
    box-shadow:0 -3px 0 var(--acc-d),0 3px 0 var(--acc-d),-3px 0 0 var(--acc-d),3px 0 0 var(--acc-d)}
  .pxbtn.primary{background:var(--acc);color:#16200c;
    box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink),
      0 7px 0 var(--acc-d),0 10px 0 var(--ink)}
  .pxbtn.primary:active{transform:translateY(6px);
    box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink)}
  .pxbtn:not(.primary):active{transform:translateY(2px)}
  .guide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;
    background:rgba(0,0,0,.62)}
  .guide.on{display:flex}
  .win{width:100%;background:var(--panel);
    box-shadow:0 -4px 0 var(--acc),0 4px 0 var(--acc),-4px 0 0 var(--acc),4px 0 0 var(--acc),0 12px 0 rgba(0,0,0,.4)}
  .wbar{background:var(--acc-d);padding:8px 11px;display:flex;align-items:center;justify-content:space-between}
  .wbar span{color:#eaf3d6;font-size:11px;font-weight:800;letter-spacing:.08em}
  .wx{width:19px;height:19px;border:0;cursor:pointer;background:#c94f4f;color:#fff;font:inherit;
    font-size:11px;font-weight:900;line-height:1;
    box-shadow:0 -2px 0 var(--ink),0 2px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink)}
  .wbody{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
  .wart{height:120px;background:#111509;display:grid;place-items:center;box-shadow:inset 0 0 0 2px #2a3a1c}
  .sno{color:var(--acc);font-size:10px;font-weight:800;letter-spacing:.12em}
  .sh{color:#eef0e2;font-size:15px;font-weight:800;line-height:1.4}
  .sp{color:#b7c99a;font-size:12px;font-weight:500;line-height:1.8}
  .dots{display:flex;gap:5px;justify-content:center}
  .dots i{width:7px;height:7px;background:#3d4a2c}.dots i.on{background:var(--acc)}
  .board{background:#1a1f14;padding:18px 22px;display:flex;gap:24px;align-items:flex-end;
    box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink)}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px}
  .cell b{color:var(--acc-l);font-size:11px}.cell em{color:var(--muted);font-size:10px;font-style:normal}

  .neverBtn{margin-top:2px;border:0;background:none;cursor:pointer;font:inherit;font-size:11px;
    font-weight:700;color:#7f9268;text-decoration:underline;padding:5px}
  .neverBtn:hover{color:#9ccc65}
  .state{background:#1a1f14;color:#cfe3a8;font-size:11px;line-height:1.9;padding:12px 16px;
    box-shadow:0 -3px 0 #14150e,0 3px 0 #14150e,-3px 0 0 #14150e,3px 0 0 #14150e;width:360px}
  .state b{color:#9ccc65}
  .state s{color:#7f9268;text-decoration:none}
  .reset{font:inherit;font-size:11px;font-weight:700;padding:7px 12px;cursor:pointer;
    background:#2b3020;color:#cfe3a8;border:2px solid #4a6330}
</style>

<div class="col">
  <div class="phone"><div class="inner">
    <div class="dots-bg"></div><div class="watermark"><svg id="wm"></svg></div>
    <div class="topbar"><svg id="barLogo"></svg></div>
    <div class="corner tl"><svg id="c1"></svg></div><div class="corner tr"><svg id="c2"></svg></div>
    <div class="corner bl"><svg id="c3"></svg></div><div class="corner br"><svg id="c4"></svg></div>
    <div class="stage">
      <img class="mascot" id="mascotMain" alt="크로비" height="200">
      <div class="welcome">클로브에 오신 것을 환영합니다.<br>친구들과 함께 쓰는 우정공간,<br>어떻게 쓰는지 60초면 끝나요.</div>
      <div class="bar" id="loadBar"></div>
      <div class="ask">시작하려면 아래를 눌러주세요</div>
      <div class="row">
        <button class="pxbtn primary" id="startBtn"><svg id="startTx"></svg></button>
        <button class="pxbtn" id="skipTop">건너뛰기</button>
      </div>
      <button class="neverBtn" id="neverTop">다시는 안 보기</button>
    </div>
    <div class="guide" id="guide"><div class="win">
      <div class="wbar"><span id="wt"></span><button class="wx" id="wx">×</button></div>
      <div class="wbody">
        <div class="wart"><img id="artM" alt="" height="104"></div>
        <div class="sno" id="sno"></div><div class="sh" id="sh"></div><div class="sp" id="sp"></div>
        <div class="dots" id="dots"></div>
        <div class="row" style="padding-top:3px">
          <button class="pxbtn" id="prev" style="flex:1">이전</button>
          <button class="pxbtn primary" id="next" style="flex:1">다음</button>
        </div>
      </div>
    </div></div>
  </div></div>
  <div class="cap">360×640 · START를 눌러보세요</div>
  <div class="state" id="state"></div>
  <button class="reset" id="resetBtn">↺ 프로필 → 가이드 다시 보기 (상태 지움)</button>
</div>

<div class="col">
  <div class="board" id="board"></div>
  <div class="cap">64px · 12색을 마스코트 3종에 그대로 적용</div>
  <div class="sub">전부 코드가 자동으로 변환합니다.<br>새 스킨이 들어와도 손댈 게 없습니다.</div>
</div>

const RES=64, COLORS=12;

function medianCut(px,K){let boxes=[px];
  while(boxes.length<K){boxes.sort((a,b)=>spread(b)-spread(a));
    const big=boxes.shift(); if(!big||big.length<2){if(big)boxes.push(big);break}
    const ch=widest(big); big.sort((p,q)=>p[ch]-q[ch]);
    const mid=big.length>>1; boxes.push(big.slice(0,mid),big.slice(mid));}
  return boxes.filter(b=>b.length).map(b=>{const s=[0,0,0];
    b.forEach(p=>{s[0]+=p[0];s[1]+=p[1];s[2]+=p[2]}); return s.map(v=>Math.round(v/b.length))})}
function ranges(b){const mn=[255,255,255],mx=[0,0,0];
  b.forEach(p=>{for(let i=0;i<3;i++){if(p[i]<mn[i])mn[i]=p[i];if(p[i]>mx[i])mx[i]=p[i]}});
  return [mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]]}
function spread(b){return Math.max(...ranges(b))}
function widest(b){const r=ranges(b);return r.indexOf(Math.max(...r))}
function nearest(pal,p){let bi=0,bd=1e9;
  for(let i=0;i<pal.length;i++){const c=pal[i];
    const d=(c[0]-p[0])**2+(c[1]-p[1])**2+(c[2]-p[2])**2; if(d<bd){bd=d;bi=i}}
  return pal[bi]}
function pixelize(img,h,K){
  const w=Math.max(1,Math.round(img.naturalWidth*h/img.naturalHeight));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  // ★ 줄일 때는 평균(스무딩)을 켠다. 니어리스트로 줄이면 원본 일러스트의 잡티 픽셀을
  //   그대로 집어오고, 거기서 색을 12개로 뭉개면 얼룩이 된다. 평균으로 면을 고른 뒤
  //   색을 줄여야 픽셀 아트처럼 딱 떨어진다(표시는 image-rendering:pixelated).
  x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high'; x.drawImage(img,0,0,w,h);
  const id=x.getImageData(0,0,w,h), d=id.data, pts=[];
  for(let i=0;i<d.length;i+=4) if(d[i+3]>128) pts.push([d[i],d[i+1],d[i+2]]);
  if(pts.length){const pal=medianCut(pts,K);
    for(let i=0;i<d.length;i+=4){ if(d[i+3]<=128){d[i+3]=0;continue}
      const n=nearest(pal,[d[i],d[i+1],d[i+2]]); d[i]=n[0];d[i+1]=n[1];d[i+2]=n[2];d[i+3]=255}}
  x.putImageData(id,0,0); return c.toDataURL();
}

function pxText(svg,text,s,fill){const gap=1;let w=0;
  for(const ch of text)w+=F[ch].split(',')[0].length+gap; w-=gap;
  svg.setAttribute('viewBox',`0 0 ${w} 7`); svg.setAttribute('width',w*s); svg.setAttribute('height',7*s);
  svg.style.shapeRendering='crispEdges'; let o='',cx=0;
  for(const ch of text){const gg=F[ch].split(',');
    gg.forEach((r,y)=>[...r].forEach((b,ix)=>{if(b==='1')o+=`<rect x="${cx+ix}" y="${y}" width="1" height="1" fill="${fill}"/>`}));
    cx+=gg[0].length+gap} svg.innerHTML=o}
function pxGrid(svg,rows,s,fill){const w=rows[0].length,h=rows.length;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.setAttribute('width',w*s); svg.setAttribute('height',h*s);
  svg.style.shapeRendering='crispEdges'; let o='';
  rows.forEach((r,y)=>[...r].forEach((b,x)=>{if(b==='1')o+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${fill}"/>`}));
  svg.innerHTML=o}

/* ── 다시 뜰지 말지: 두 저장소로 나눈다 ────────────────────────────
   건너뛰기·X   → 이번 방문만 (sessionStorage) — 탭을 닫으면 사라진다
   다시는 안 보기 → 영구 (localStorage)
   끝까지 봄     → 영구 (다 봤으니 또 띄울 이유가 없다)
   프로필 → 가이드 다시 보기 → 둘 다 지운다(일방통행 방지) */
const KEY_NEVER='clov-guide-done', KEY_SESSION='clov-guide-skipped';
const readState=()=>({
  never: localStorage.getItem(KEY_NEVER)==='1',
  session: sessionStorage.getItem(KEY_SESSION)==='1'
});
function shouldShow(){ const s=readState(); return !s.never && !s.session }
function paint(){
  const s=readState();
  document.getElementById('state').innerHTML=
    '<b>지금 상태</b><br>'+
    'localStorage <code>'+KEY_NEVER+'</code> = '+(s.never?'<b>1</b> (영구 안 뜸)':'<s>없음</s>')+'<br>'+
    'sessionStorage <code>'+KEY_SESSION+'</code> = '+(s.session?'<b>1</b> (이번 방문만 안 뜸)':'<s>없음</s>')+'<br>'+
    '→ 방 목록에 들어오면 '+(shouldShow()?'<b>뜬다</b>':'<b>안 뜬다</b>');
}
function markNever(){ localStorage.setItem(KEY_NEVER,'1'); paint() }
function markSession(){ sessionStorage.setItem(KEY_SESSION,'1'); paint() }

document.getElementById('neverTop').onclick=()=>{ markNever(); alert('다시는 안 뜹니다.\n프로필 → 가이드 다시 보기로 되돌릴 수 있어요.') };
document.getElementById('skipTop').onclick=()=>{ markSession(); alert('이번 방문만 안 뜹니다.') };
document.getElementById('wx').addEventListener('click',markSession);
document.getElementById('resetBtn').onclick=()=>{
  localStorage.removeItem(KEY_NEVER); sessionStorage.removeItem(KEY_SESSION); paint() };
/* 끝까지 보고 "시작하기"를 누르면 영구 처리 */
const nextEl=document.getElementById('next');
nextEl.addEventListener('click',()=>{ if(nextEl.textContent==='시작하기') markNever() });
paint();
