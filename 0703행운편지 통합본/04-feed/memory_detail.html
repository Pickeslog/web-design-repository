<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clov - 추억 상세보기</title>
    <style>
                :root {
            --bg-color: #cbdad2;
            --card-bg: #ffffff;
            --text-color: #2c3e35;
            --text-muted: #61766a;
            --border-color: #eef2f0;
            --primary-green: #1b4332;
            --accent-green: #52b788;
            --btn-hover: #357a58;
            --input-bg: #fafbfc;
            --btn-secondary-bg: rgba(0,0,0,0.05);
        }

        body.dark-mode {
            --bg-color: #090d0a;
            --card-bg: #151f18;
            --text-color: #f0fdf4;
            --text-muted: #86efac;
            --border-color: #1e2f24;
            --primary-green: #007c2e;
            --accent-green: #4ade80;
            --btn-hover: #16a34a;
            --input-bg: #0d1510;
            --btn-secondary-bg: rgba(255,255,255,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .back-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #fff;
        }

        .detail-meta {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .detail-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .detail-body {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
            white-space: pre-wrap;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-action-sm {
            background: var(--btn-secondary-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
            flex: 1;
            text-align: center;
            min-width: 120px;
        }

        .btn-action-sm:hover {
            background: rgba(255,255,255,0.1);
        }

        .btn-delete {
            color: var(--delete-red);
        }

        .btn-edit-post {
            background: var(--bg-color);
        }

        .tags {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .tag {
            background: rgba(74, 222, 128, 0.1);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
    </style>
    <link rel="stylesheet" href="../02-main/css/global-theme.css">
    <script id="dark-mode-init">
        const urlParamsTheme = new URLSearchParams(window.location.search);
        const themeParam = urlParamsTheme.get('theme');
        let isDark = false;
        
        if (themeParam === 'dark') {
            isDark = true;
        } else if (themeParam === 'light') {
            isDark = false;
        } else {
            isDark = localStorage.getItem('clov_darkMode') === 'true';
        }

        if (isDark) {
            document.documentElement.classList.add('dark-mode');
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('dark-mode');
            });
        }
    </script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="author-label">내 기록</h1>
        <button class="back-btn" onclick="goBack()">✕ 닫기</button>
    </div>

    <div class="detail-meta" id="detail-date"></div>
    <div class="detail-title" id="detail-title">추억 제목</div>
    <div class="detail-body" id="detail-body"></div>

    <div class="tags" id="detail-tags"></div>

    <div class="actions" id="actions-container">
        <!-- 동적으로 버튼 생성 -->
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const groupId = urlParams.get('groupId') || 'friend';
    const postId = parseInt(urlParams.get('postId'));
    const participantId = urlParams.get('participantId');

    let groupsData = JSON.parse(localStorage.getItem('clov_groupsData'));
    if (!groupsData || !groupsData[groupId] || isNaN(postId)) {
        alert("데이터를 찾을 수 없습니다.");
        goBack();
    }

    const currentGroup = groupsData[groupId];
    const post = currentGroup.posts[postId];

    if (!post) {
        alert("해당 추억을 찾을 수 없습니다.");
        goBack();
    }

    // 데이터 정규화 로직 간소화
    let participants = post.participants || [];
    if (participants.length === 0) {
        participants.push({ name: "나", icon: "나", text: post.text || "", type: "mine", id: "p_mine" });
    }

    const participant = participants.find(p => p.id === participantId) || participants[0];

    document.getElementById('author-label').innerText = participant.type === 'mine' ? '내 기록' : `${participant.name}의 기록`;
    document.getElementById('detail-date').innerText = [post.date, post.subtitle].filter(Boolean).join(' · ');
    document.getElementById('detail-title').innerText = post.title || '추억 기록';
    
    const textContent = participant.fullText || participant.text || post.text || '아직 남겨진 기록이 없습니다.';
    document.getElementById('detail-body').innerText = textContent;

    const tags = post.tags || ["내가 보는 장면"];
    document.getElementById('detail-tags').innerHTML = tags.map(tag => `<span class="tag">${tag}</span>`).join('');

    const actionsContainer = document.getElementById('actions-container');
    let actionHtml = '';

    if (participant.type === 'mine' || participant.name === '나') {
        actionHtml += `<button class="btn-action-sm" onclick="editComment()">코멘트 수정</button>`;
        actionHtml += `<button class="btn-action-sm btn-delete" onclick="deleteComment()">코멘트 삭제</button>`;
        actionHtml += `<button class="btn-action-sm btn-edit-post" onclick="editPost()">추억 전체 수정</button>`;
            }
    actionsContainer.innerHTML = actionHtml;

    let isEditing = false;
    let originalText = "";

        function renderPage() {
        const textContent = participant.fullText || participant.text || post.text || '작성된 내용이 없습니다.';
        document.getElementById('detail-body').innerText = textContent;
        const actionsContainer = document.getElementById('actions-container');
        let actionHtml = '';
        if (participant.type === 'mine' || participant.name === '나') {
            actionHtml += `<button class="btn-action-sm" onclick="editComment()">코멘트 수정</button>`;
            actionHtml += `<button class="btn-action-sm btn-delete" onclick="deleteComment()">코멘트 삭제</button>`;
            actionHtml += `<button class="btn-action-sm btn-edit-post" onclick="editPost()">추억 전체 수정</button>`;
                    }
        actionsContainer.innerHTML = actionHtml;
        isEditing = false;
    }

    function editComment() {
        if (isEditing) return;
        isEditing = true;
        
        const textContainer = document.getElementById('detail-body');
        originalText = textContent;
        
        textContainer.innerHTML = `<textarea id="edit-comment-textarea" style="width:100%; height: 150px; padding: 12px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--text-color); resize: vertical; font-size: 15px; font-family: inherit;">${textContent}</textarea>`;
        
        const actionsContainer = document.getElementById('actions-container');
        actionsContainer.innerHTML = `
            <button class="btn-action-sm" onclick="saveComment()" style="background: var(--primary-green); color: white;">💾 저장</button>
            <button class="btn-action-sm btn-delete" onclick="cancelEdit()">❌ 취소</button>
        `;
    }

    function saveComment() {
        const textarea = document.getElementById('edit-comment-textarea');
        if (!textarea) return;
        const newText = textarea.value.trim();
        if (newText !== "") {
            participant.text = newText;
            participant.fullText = newText;
            localStorage.setItem('clov_groupsData', JSON.stringify(groupsData));
            renderPage();
        }
    }

    function editPost() {
        window.location.href = `write_post.html?action=edit&groupId=${groupId}&postId=${postId}`;
    }

    
    function deleteComment() {
        if(confirm("정말로 이 코멘트를 삭제하시겠습니까?")) {
            if (post.participants) {
                const index = post.participants.findIndex(p => p.id === participant.id || p.name === participant.name);
                if (index !== -1) {
                    post.participants.splice(index, 1);
                }
            }
            
            if (!post.participants || post.participants.length === 0) {
                groupsData[groupId].posts.splice(postId, 1);
            }
            
            localStorage.setItem('clov_groupsData', JSON.stringify(groupsData));
            alert("코멘트가 삭제되었습니다.");
            goBack();
        }
    }

    

    function cancelEdit() {
        isEditing = false;
        renderPage();
    }
function goBack() {
        window.location.href = `../02-main/index.html?selectedGroup=${groupId}&theme=${isDark ? 'dark' : 'light'}`;
    }
</script>
</body>
</html>
