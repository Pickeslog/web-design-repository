<style>
/* ===== CSS 변수 ===== */
:root {
  --primary:    #1b4332;
  --accent:     #52b788;
  --btn-bg:     #357a58;
  --body-bg:    #f4f7f5;
  --card-bg:    #ffffff;
  --header-bg:  rgba(255,255,255,0.88);
  --text:       #1e2e26;
  --muted:      #6a7e73;
  --border:     #e4ede8;
  --input-bg:   #ffffff;
  --input-bdr:  #d0e4d8;
  --active-bg:  #e8f3ed;
  --danger:     #d95f5f;
  --shadow-sm:  0 1px 4px rgba(0,0,0,.07);
  --shadow-md:  0 4px 16px rgba(0,0,0,.09);
}
body.dark-mode {
  /* 미드나잇 올리브 팔레트 — 02-main/desktop.css와 동일 계열로 통일 */
  --primary:    #5a7a3e;
  --accent:     #9ccc65;
  --btn-bg:     #7c9c52;
  --body-bg:    #14150e;
  --card-bg:    #1e2016;
  --header-bg:  rgba(20,21,14,0.88);
  --text:       #eef0e2;
  --muted:      #b7c99a;
  --border:     #2a2c1e;
  --input-bg:   #191a12;
  --input-bdr:  #6b8f47;
  --active-bg:  #2b3020;
  --danger:     #f87171;
  --shadow-sm:  0 1px 4px rgba(0,0,0,.3);
  --shadow-md:  0 4px 16px rgba(0,0,0,.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--body-bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .3s, color .3s;
}

/* ===== 헤더 ===== */
.header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 56px;
  background: var(--header-bg);
  backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
.logo { font-size: 18px; font-weight: 800; color: var(--primary); letter-spacing: -.4px; }
.header-right { display: flex; align-items: center; gap: 4px; }
.hdr-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: none; background: none; cursor: pointer;
  font-size: 18px; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  position: relative; transition: background .15s, color .15s;
}
.hdr-btn:hover { background: var(--active-bg); color: var(--primary); }
.hdr-btn .dot {
  position: absolute; top: 7px; right: 7px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); border: 1.5px solid var(--card-bg);
}
.toggle-wrap {
  width: 48px; height: 28px; border-radius: 14px;
  background: rgba(120,120,128,.28); border: none; cursor: pointer;
  position: relative; transition: background .25s;
}
body.dark-mode .toggle-wrap { background: var(--accent); }
.toggle-knob {
  position: absolute; top: 2px; left: 2px;
  width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: transform .25s cubic-bezier(.2,.9,.2,1.1);
}
body.dark-mode .toggle-knob { transform: translateX(20px); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary); color: #fff;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: none; cursor: pointer;
}

/* ===== 메인 영역 ===== */
.main { max-width: 860px; margin: 0 auto; padding: 32px 24px 60px; }

/* ===== 상단 툴바 ===== */
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
}
.greeting {
  font-size: 15px; font-weight: 700; color: var(--text);
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--active-bg); border: 1px solid var(--border);
  padding: 7px 14px; border-radius: 20px;
}
.toolbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.code-input {
  height: 36px; padding: 0 12px;
  border: 1.5px solid var(--input-bdr); border-radius: 10px;
  background: var(--input-bg); color: var(--text); font-size: 13px;
  width: 130px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.code-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(82,183,136,.15); }
.code-input::placeholder { color: var(--muted); }
.btn-enter {
  height: 36px; padding: 0 16px;
  background: var(--primary); color: #fff;
  border: none; border-radius: 10px;
  font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity .15s;
}
.btn-enter:hover { opacity: .85; }
.btn-create {
  height: 36px; padding: 0 14px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 10px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; gap: 4px; transition: opacity .15s;
}
.btn-create:hover { opacity: .85; }
.btn-edit {
  height: 36px; padding: 0 12px;
  background: var(--card-bg); border: 1.5px solid var(--input-bdr);
  border-radius: 10px; color: var(--text);
  font-size: 13px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: background .15s, border-color .15s;
}
.btn-edit:hover { background: var(--active-bg); border-color: var(--accent); }
.btn-edit.active { border-color: var(--accent); color: var(--primary); background: var(--active-bg); }

/* ===== 편집 모드 안내 배너 ===== */
.edit-banner {
  display: none;
  background: var(--active-bg); border: 1.5px solid var(--accent);
  border-radius: 12px; padding: 10px 16px;
  font-size: 12px; color: var(--primary); font-weight: 600;
  margin-bottom: 16px;
  align-items: center; gap: 8px;
}
.edit-banner.show { display: flex; }

/* ===== 필터 탭 ===== */
.filter-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
}
.filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn {
  height: 34px; padding: 0 14px; border-radius: 20px;
  border: 1.5px solid var(--border); background: var(--card-bg); color: var(--muted);
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 5px; transition: all .15s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--primary); }
.filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
body.dark-mode .filter-btn.active { color: #0a0f0c; }

/* ===== 방 카드 그리드 ===== */
.room-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px; margin-bottom: 32px;
}
@media (max-width: 760px) { .room-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .room-grid { grid-template-columns: 1fr; } }

.room-card {
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: 20px; padding: 18px;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .18s, transform .18s, border-color .15s, opacity .18s;
  position: relative; user-select: none;
}
.room-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--accent); }

/* ===== 드래그 핸들 ===== */
.drag-handle {
  position: absolute; top: 50%; left: 8px;
  transform: translateY(-50%);
  display: none; flex-direction: column; gap: 3px;
  padding: 6px 4px; cursor: grab; color: var(--muted);
  z-index: 2;
}
.drag-handle:active { cursor: grabbing; }
.drag-handle::before, .drag-handle::after {
  content: '⠿'; font-size: 16px; line-height: 1;
  display: block;
}
.room-card.edit-mode { cursor: grab; padding-left: 32px; }
.room-card.edit-mode:active { cursor: grabbing; }
.room-card.edit-mode .drag-handle { display: flex; }
.room-card.edit-mode:hover { transform: none; box-shadow: var(--shadow-sm); }
.room-card.dragging { opacity: .35; transform: scale(.97) !important; border: 2px dashed var(--accent) !important; }
.room-card.drag-over { border: 2px solid var(--accent) !important; background: var(--active-bg); transform: scale(1.02) !important; }

/* 편집 버튼 (수정/삭제) */
.edit-controls {
  display: none; position: absolute; top: 10px; right: 10px; gap: 4px; z-index: 4;
}
.room-card.edit-mode .edit-controls { display: flex; }
.edit-del-btn {
  width: 28px; height: 28px; border-radius: 8px;
  border: none; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.edit-del-btn { background: var(--danger); color: #fff; }

/* ===== 페이지네이션 ===== */
.pagination { display: flex; align-items: center; justify-content: center; gap: 6px; }
.req-pagination { margin-top: 14px; }
.page-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text);
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.page-btn:hover { border-color: var(--accent); color: var(--primary); }
.page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
body.dark-mode .page-btn.active { color: #0a0f0c; }
.page-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ===== 방 만들기 / 완료 패널 ===== */
.panel { display: none; }
.panel.show { display: block; }
.panel-back {
  background: none; border: none; cursor: pointer; color: var(--muted);
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 4px; margin-bottom: 24px; transition: color .15s;
}
.panel-back:hover { color: var(--primary); }
.panel-title { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
.panel-sub   { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.field-wrap  { margin-bottom: 18px; }
.text-input {
  width: 100%; height: 44px; padding: 0 14px;
  border: 1.5px solid var(--input-bdr); border-radius: 12px;
  background: var(--input-bg); color: var(--text); font-size: 14px;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.text-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(82,183,136,.15); }
.text-input.invalid { border-color: var(--danger); }
.err-msg { font-size: 11px; color: var(--danger); margin-top: 5px; min-height: 14px; }
textarea.text-input { height: 88px; padding: 10px 14px; resize: none; }
.char-count { font-size: 11px; color: var(--muted); text-align: right; margin-top: 4px; }
.photo-upload {
  width: 88px; height: 88px; border-radius: 18px;
  border: 2px dashed var(--input-bdr);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; color: var(--muted); font-size: 11px; gap: 4px;
  transition: border-color .15s, background .15s; margin-bottom: 18px; overflow: hidden;
}
.photo-upload:hover { border-color: var(--accent); background: var(--active-bg); }
.photo-upload i { font-size: 24px; }
.btn-submit {
  width: 100%; height: 46px; background: var(--btn-bg); color: #fff;
  border: none; border-radius: 14px; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: opacity .15s; margin-top: 8px;
}
.btn-submit:hover { opacity: .88; }

/* 완료 패널 */
.success-card {
  text-align: center; padding: 48px 24px;
  background: var(--card-bg); border: 1.5px solid var(--border);
  border-radius: 24px; max-width: 420px; margin: 0 auto; box-shadow: var(--shadow-md);
}
.success-icon { font-size: 52px; margin-bottom: 16px; }
.success-title { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
.success-sub   { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
.invite-code-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--active-bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 24px;
}
.invite-code {
  flex: 1; font-size: 18px; font-weight: 800; color: var(--primary);
  letter-spacing: 2px; background: none; border: none; outline: none;
}
.copy-btn {
  background: var(--primary); color: #fff; border: none;
  border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
}

/* ===== 헤더 액션 모달 ===== */
.room-header-modal-backdrop {
  position: fixed; inset: 0; z-index: 260;
  display: none; align-items: center; justify-content: center;
  padding: 20px; background: rgba(18, 36, 28, .42);
  backdrop-filter: blur(8px);
}
@keyframes modalPop {
  0% { opacity: 0; transform: scale(0.96) translateY(8px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.room-header-modal-backdrop.show { display: flex; }
.room-header-modal-backdrop.show .room-header-modal {
  animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.room-header-modal {
  width: min(430px, calc(100vw - 32px));
  max-height: min(720px, calc(100vh - 40px));
  overflow: hidden;
  border-radius: 22px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--text);
  box-shadow: var(--shadow-md);
}
.room-header-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 18px 18px 12px;
  border-bottom: 1px solid var(--border);
}
.room-header-modal-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 850; color: var(--primary);
}
.room-header-modal-close {
  width: 32px; height: 32px; border: none; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--active-bg); color: var(--text); cursor: pointer;
}
.room-header-modal-close:hover { background: var(--border); }
.room-header-modal-body {
  padding: 14px 18px 18px;
  overflow-y: auto;
  max-height: calc(min(720px, calc(100vh - 40px)) - 64px);
}

/* ===== 사용자설정 모달 ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  z-index: 300; display: none; align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(6px);
}
.modal-overlay.show { display: flex; }
.profile-edit-modal {
  width: min(720px, 100%); max-height: calc(100vh - 56px);
  background: var(--card-bg); border-radius: 20px; overflow: hidden;
  box-shadow: var(--shadow-md);
}
.profile-modal-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px; padding: 22px 24px 16px; border-bottom: 1px solid var(--border);
}
.profile-modal-kicker {
  display: block; margin-bottom: 5px; color: var(--muted);
  font-size: 10px; font-weight: 900; letter-spacing: .08em;
}
.profile-modal-head h3 { margin: 0; font-size: 18px; color: var(--text); }
.profile-modal-close {
  width: 32px; height: 32px; border: 0; border-radius: 50%;
  background: var(--active-bg); color: var(--primary); cursor: pointer;
  font-size: 20px; line-height: 1;
}
.profile-modal-body {
  display: grid; grid-template-columns: 200px minmax(0,1fr);
  height: calc(100vh - 190px); max-height: 560px; overflow: hidden;
}
.settings-rail {
  display: flex; flex-direction: column; height: 100%; min-height: 0;
  border-right: 1px solid var(--border); background: var(--active-bg);
}
.settings-rail-identity {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.settings-rail-avatar {
  position: relative; width: 30px; height: 30px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: 50%; border: 0;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  color: #fff; cursor: pointer; overflow: hidden; font-size: 12px; font-weight: 900;
}
.settings-rail-avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
#dt-profile-avatar-file { display: none; }
.profile-avatar-upload {
  display: flex; align-items: center; gap: 14px;
}
.profile-avatar-upload-circle {
  position: relative; width: 64px; height: 64px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: 50%; border: 0;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  color: #fff; cursor: pointer; overflow: hidden; font-size: 22px; font-weight: 900;
  transition: transform 0.15s ease;
}
.profile-avatar-upload-circle:hover { transform: scale(1.05); }
.profile-avatar-upload-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }
.profile-avatar-upload-hint { font-size: 12px; color: var(--muted); }
.settings-rail-name {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text); font-size: 13px; font-weight: 800;
}
.settings-nav-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 10px; }
.settings-nav-group + .settings-nav-group { margin-top: 14px; }
.settings-nav-label {
  margin: 0 0 4px; padding: 0 10px; color: var(--muted);
  font-size: 11px; font-weight: 800;
}
.settings-nav-item {
  padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 700;
  color: var(--muted); cursor: pointer; text-align: left;
}
.settings-nav-item:hover { background: var(--card-bg); }
.settings-nav-item.active { background: var(--card-bg); color: var(--primary); }
.profile-form-panel { display: block; min-width: 0; height: 100%; overflow-y: auto; padding: 20px 24px; }
.profile-form-section { padding: 18px 0; }
.profile-form-section:not(:last-of-type) { border-bottom: 1px solid var(--border); }
.profile-section-title { margin-bottom: 12px; color: var(--primary); font-size: 12px; font-weight: 900; }
.profile-password-field { position: relative; }
.profile-password-field button {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  border: none; background: none; cursor: pointer; font-size: 15px;
}
.profile-hint { font-size: 11px; margin-top: 5px; min-height: 14px; color: var(--muted); }
.profile-hint.is-ok { color: #2e7d32; }
.profile-hint.is-error { color: var(--danger); }
.settings-list { list-style: none; margin: 0; padding: 0; }
.settings-list li {
  display: flex; align-items: center; gap: 12px; padding: 14px 12px;
  border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--text);
}
.settings-list li:hover { background: var(--active-bg); }
.settings-list-icon { font-size: 17px; }
.settings-list-label { flex: 1; }
.theme-option-check { color: var(--accent); font-weight: 900; visibility: hidden; }
.theme-option.active .theme-option-check { visibility: visible; }
.theme-option.is-coming-soon { cursor: pointer; opacity: 0.7; }
.theme-coming-soon-badge {
  flex-shrink: 0; font-size: 10.5px; font-weight: 800; color: var(--muted);
  background: var(--active-bg); padding: 3px 9px; border-radius: 10px;
}
.profile-modal-actions { padding: 16px 24px 22px; border-top: 1px solid var(--border); }
.profile-modal-actions-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.profile-modal-action-group { display: flex; gap: 8px; }
.profile-footer-btn {
  height: 42px; padding: 0 20px; border-radius: 12px; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: opacity .15s, background .15s; min-width: 104px;
}
.profile-footer-btn.secondary { background: none; border: 1.5px solid var(--border); color: var(--text); }
.profile-footer-btn.secondary:hover { background: var(--active-bg); }
.profile-footer-btn.primary { background: var(--btn-bg); color: #fff; border: none; }
.profile-footer-btn.primary:hover { opacity: .88; }
.profile-avatar-circle-lg {
  width: 92px; height: 92px; display: grid; place-items: center; border-radius: 50%;
  border: 3px solid var(--border); background: linear-gradient(135deg, var(--accent), var(--primary));
  color: #fff; cursor: pointer; overflow: hidden; font-size: 34px; font-weight: 900;
}
@media (max-width: 820px) {
  .profile-edit-modal { max-width: min(94vw, 520px); }
  .profile-modal-body { grid-template-columns: 1fr; height: auto; max-height: calc(100vh - 160px); overflow-y: auto; }
  .settings-rail { height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .settings-nav-scroll { overflow-y: visible; }
  .profile-form-panel { height: auto; overflow-y: visible; }
  .profile-modal-actions-row { flex-direction: column-reverse; align-items: stretch; }
  .profile-modal-action-group { width: 100%; }
  .profile-modal-action-group .profile-footer-btn { flex: 1; }
}

/* ===== 방 미리보기 소식 피드 빈 상태 ===== */
.preview-empty { text-align: center; padding: 32px 0; color: var(--muted); font-size: 13px; }

/* ==========================================================================
   [개편] 방 미리보기 — 무탭 소식 피드 + 방 프로필 편집 + 친구 초대 시트
   (design_handoff_room_invite_flow · t10 / t11 · #room-preview-modal 스코프)
   ========================================================================== */
#room-preview-modal .room-header-modal {
  width: min(430px, calc(100vw - 32px));
  max-height: min(760px, calc(100vh - 40px));
}
#room-preview-modal .room-header-modal-body {
  max-height: calc(min(760px, calc(100vh - 40px)) - 64px);
}
#room-preview-modal .rp-view { display: none; }
#room-preview-modal .rp-view.active { display: block; }

/* 방 요약 행 */
#room-preview-modal .rp-inforow {
  display: flex; gap: 14px; align-items: center; padding: 13px;
  background: var(--active-bg); border-radius: 16px; margin-bottom: 16px;
}
#room-preview-modal .rp-ico {
  width: 52px; height: 52px; border-radius: 15px; background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; overflow: hidden;
}
#room-preview-modal .rp-ico img { width: 100%; height: 100%; object-fit: cover; }
#room-preview-modal .rp-intro { font-size: 14px; font-weight: 800; color: var(--text); }
#room-preview-modal .rp-lvrow { display: flex; gap: 8px; align-items: center; margin-top: 5px; }
#room-preview-modal .rp-lv { font-size: 11px; font-weight: 800; color: #fff; background: var(--primary); padding: 2px 8px; border-radius: 8px; }
body.dark-mode #room-preview-modal .rp-lv { color: #0a0f0c; }
#room-preview-modal .rp-lvsub { font-size: 12px; color: var(--muted); }

/* 멤버 아바타 줄 */
#room-preview-modal .rp-mrow { display: flex; align-items: center; gap: 6px; margin: -2px 2px 16px; flex-wrap: wrap; }
#room-preview-modal .rp-av {
  width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex: none;
}
#room-preview-modal .rp-mrow-n { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 3px; }

/* 소식 헤더 */
#room-preview-modal .rp-sechd { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 10px; }
#room-preview-modal .rp-sechd .l { font-size: 13px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 6px; }
#room-preview-modal .rp-sechd .r { font-size: 12px; color: var(--danger); font-weight: 800; }

/* 소식 피드 */
#room-preview-modal .rp-feed { display: flex; flex-direction: column; gap: 7px; }
#room-preview-modal .rp-fi {
  display: flex; gap: 11px; align-items: flex-start; padding: 11px 12px;
  border-radius: 13px; border: 1px solid var(--border); background: var(--card-bg);
}
#room-preview-modal .rp-fi.unread { background: var(--active-bg); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
#room-preview-modal .rp-fi-ic { width: 34px; height: 34px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 16px; }
#room-preview-modal .rp-fi-ic.letter { background: #e2f2ea; color: #2f7d4f; }
#room-preview-modal .rp-fi-ic.sched  { background: #fbeecf; color: #b5851f; }
#room-preview-modal .rp-fi-ic.member { background: #dfecee; color: #b45274; }
#room-preview-modal .rp-fi-ic.join   { background: #dfeef0; color: #2f7a86; }
#room-preview-modal .rp-fi-ic.edit   { background: #eceae2; color: #8a7f66; }
body.dark-mode #room-preview-modal .rp-fi-ic.letter { background: #243a2e; color: #9ccc65; }
body.dark-mode #room-preview-modal .rp-fi-ic.sched  { background: #3a331e; color: #e0c169; }
body.dark-mode #room-preview-modal .rp-fi-ic.member { background: #3a2630; color: #e79bb5; }
body.dark-mode #room-preview-modal .rp-fi-ic.join   { background: #213338; color: #7fc4cf; }
body.dark-mode #room-preview-modal .rp-fi-ic.edit   { background: #2e2c22; color: #c3b98a; }
#room-preview-modal .rp-fi-tx { flex: 1; min-width: 0; }
#room-preview-modal .rp-fi-t { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
#room-preview-modal .rp-fi-t .who { color: #2f7d4f; }
body.dark-mode #room-preview-modal .rp-fi-t .who { color: var(--accent); }
#room-preview-modal .rp-fi-d { font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#room-preview-modal .rp-fi-time { font-size: 11px; color: var(--muted); font-weight: 600; flex: none; margin-top: 2px; }
#room-preview-modal .rp-more { font-size: 12.5px; color: var(--btn-bg); font-weight: 700; text-align: center; padding: 9px; border-radius: 10px; background: var(--active-bg); margin-top: 2px; cursor: pointer; }

/* 초대/입장 버튼 */
#room-preview-modal .rp-invite-btn {
  display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 11px;
  border: 1px dashed var(--accent); background: var(--active-bg); border-radius: 13px;
  color: var(--primary); font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 16px;
}
#room-preview-modal .rp-enter {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; margin-top: 12px;
  background: var(--primary); color: #fff; border: none; border-radius: 14px; font-size: 15.5px; font-weight: 800; cursor: pointer;
}
body.dark-mode #room-preview-modal .rp-enter { color: #0a0f0c; }

/* ⚙️ 톱니바퀴 / ← 뒤로 */
#room-preview-modal .rp-gear {
  width: auto; height: auto; background: none; border: none; color: var(--btn-bg); font-size: 20px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 5px;
}

/* 방 프로필 편집 서브뷰 */
#room-preview-modal .ed-lbl { font-size: 12px; font-weight: 800; color: var(--text); margin: 15px 2px 6px; display: flex; gap: 7px; align-items: baseline; }
#room-preview-modal .ed-lbl .h { font-size: 10.5px; font-weight: 600; color: #c98a2e; }
#room-preview-modal .ed-lbl .h.mute { color: var(--muted); }
#room-preview-modal .ed-in {
  width: 100%; border: 1.5px solid var(--input-bdr); border-radius: 11px; padding: 10px 12px;
  font-size: 14px; color: var(--text); background: var(--input-bg); font-family: inherit; box-sizing: border-box; outline: none;
}
#room-preview-modal .ed-in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(82,183,136,.15); }
#room-preview-modal textarea.ed-in { min-height: 56px; resize: none; }
#room-preview-modal .ed-photo {
  position: relative; border-radius: 14px; overflow: hidden; height: 118px; background: var(--primary);
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 30px; cursor: default;
  transition: background .2s ease;
}
/* 테마 색상이 밝은 편(세이지·민트)이어도 아이콘이 항상 또렷하게 보이도록 */
#room-preview-modal .ed-photo i { filter: drop-shadow(0 2px 5px rgba(0,0,0,.35)); }
#room-preview-modal .ed-photo img { width: 100%; height: 100%; object-fit: cover; }
#room-preview-modal .ed-photo .chg {
  position: absolute; right: 10px; bottom: 10px; background: rgba(255,255,255,.94); border-radius: 9px;
  padding: 5px 10px; font-size: 12px; font-weight: 700; color: #1b4332; display: flex; gap: 5px; align-items: center;
}
#room-preview-modal .ed-chips { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
#room-preview-modal .ed-chip {
  font-size: 12px; font-weight: 600; color: var(--text); background: var(--active-bg); border: 1px solid var(--border);
  border-radius: 9px; padding: 7px 11px; display: flex; gap: 5px; align-items: center; cursor: pointer;
}
#room-preview-modal .ed-chip.on { background: #e2f2ea; border-color: var(--accent); color: var(--primary); font-weight: 700; }
body.dark-mode #room-preview-modal .ed-chip.on { background: var(--active-bg); color: var(--accent); }

/* 테마 색상 스와치 — 대표 사진/보딩패스 카드 배경 프리셋 (A-9) */
#room-preview-modal .ed-swatches { display: flex; gap: 10px; margin-top: 9px; flex-wrap: wrap; justify-content: center; }
#room-preview-modal .ed-swatch {
  width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer; padding: 0; position: relative;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); transition: transform .12s ease;
}
#room-preview-modal .ed-swatch:hover { transform: scale(1.08); }
#room-preview-modal .ed-swatch.on { box-shadow: 0 0 0 2px var(--card-bg), 0 0 0 4px var(--accent); }
#room-preview-modal .ed-swatch.on::after {
  content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.5);
}
#room-preview-modal .ed-actions { display: flex; gap: 9px; margin-top: 18px; }
#room-preview-modal .ed-cancel { flex: 1; height: 48px; border: 1px solid var(--border); background: var(--card-bg); border-radius: 13px; font-size: 14.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
#room-preview-modal .ed-save { flex: 1.6; height: 48px; border: none; background: var(--primary); color: #fff; border-radius: 13px; font-size: 14.5px; font-weight: 800; cursor: pointer; }
body.dark-mode #room-preview-modal .ed-save { color: #0a0f0c; }
#room-preview-modal .notify-b {
  display: flex; gap: 8px; align-items: flex-start; background: var(--active-bg); border: 1px solid #d7e6dd;
  border-radius: 11px; padding: 10px 12px; margin-top: 16px; font-size: 12px; line-height: 1.45; color: #2f6b45;
}
body.dark-mode #room-preview-modal .notify-b { border-color: var(--border); color: var(--accent); }
#room-preview-modal .notify-b b { color: var(--primary); }
#room-preview-modal .cnt { text-align: right; font-size: 11px; color: var(--muted); margin-top: 5px; }

/* 친구 초대하기 시트 */
#room-preview-modal .rp-invite-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 2px 14px; }
#room-preview-modal .rp-invite-desc b { color: var(--primary); }
#room-preview-modal .link-box { display: flex; align-items: center; gap: 8px; background: var(--active-bg); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; }
#room-preview-modal .link-url { flex: 1; min-width: 0; font-size: 13px; color: var(--primary); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#room-preview-modal .code-big { font-size: 19px; font-weight: 850; color: var(--primary); letter-spacing: 2px; }
#room-preview-modal .mini-copy { flex: none; font-size: 12px; font-weight: 700; color: var(--text); background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
#room-preview-modal .share-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; margin-top: 12px; background: var(--primary); color: #fff; border: none; border-radius: 13px; font-size: 15px; font-weight: 800; cursor: pointer; }
body.dark-mode #room-preview-modal .share-btn { color: #0a0f0c; }
#room-preview-modal .or-div { display: flex; align-items: center; gap: 10px; margin: 18px 0 12px; color: var(--muted); font-size: 11.5px; font-weight: 700; }
#room-preview-modal .or-div::before, #room-preview-modal .or-div::after { content: ""; flex: 1; height: 1px; background: var(--border); }
#room-preview-modal .regen { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 12px; font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; }

/* ==========================================================================
   [개편] 방목록 카드 — 보딩패스(탑승권) 카드 (t18 확정)
   아이보리 페이퍼 티켓: 어떤 배경 테마 위에서도 뜨도록 라이트/다크 공통 고정색.
   ========================================================================== */
/* 티켓 = [그림자 래퍼(.room-card.ticket)] > [마스크 본체(.tk-body)] 2단 구조.
   그림자는 마스크 없는 래퍼가 담당(마스크가 그림자를 잘라먹지 않게) → 어떤 배경에서도 확실히 뜸. */
.room-card.ticket {
  padding: 0; border: none; gap: 0; background: transparent; border-radius: 16px; overflow: visible;
  box-shadow: 0 12px 22px rgba(20,40,30,.22);
}
.room-card.ticket:hover { border: none; box-shadow: 0 16px 28px rgba(20,40,30,.3); transform: translateY(-2px); }
.room-card.ticket.selected { outline: 2.5px solid #52b788; outline-offset: 0; }
.room-card.ticket.edit-mode { padding-left: 0; }
.room-card.ticket.edit-mode:hover { transform: none; box-shadow: 0 12px 22px rgba(20,40,30,.22); }
.room-card.ticket.dragging, .room-card.ticket.drag-over { transform: none !important; }

.tk-body {
  background: #fffdf7; border-radius: 16px; overflow: hidden;
  /* 좌우 절취 노치: mask로 투명 구멍을 뚫어 배경이 비치게 (README D 권장) */
  -webkit-mask:
    radial-gradient(circle 9px at left  calc(100% - 40px), transparent 96%, #000 100%) left  / 50.2% 100% no-repeat,
    radial-gradient(circle 9px at right calc(100% - 40px), transparent 96%, #000 100%) right / 50.2% 100% no-repeat;
  mask:
    radial-gradient(circle 9px at left  calc(100% - 40px), transparent 96%, #000 100%) left  / 50.2% 100% no-repeat,
    radial-gradient(circle 9px at right calc(100% - 40px), transparent 96%, #000 100%) right / 50.2% 100% no-repeat;
}

.tk-head { padding: 14px 15px 0; position: relative; }
.tk-route { display: flex; align-items: center; justify-content: space-between; color: #fff; }
.tk-kick { font-size: 9px; letter-spacing: 1px; font-weight: 700; }
.tk-code { font-size: 15px; font-weight: 800; }
.tk-mid { flex: 1; text-align: center; font-size: 11px; }
.tk-dest { text-align: right; }
.tk-skyline { display: flex; align-items: flex-end; gap: 2.5px; height: 26px; margin-top: 8px; opacity: .9; }
.tk-skyline i { display: block; background: #fffdf7; }
.tk-pax { padding: 12px 15px 4px; display: flex; align-items: flex-start; justify-content: space-between; }
.tk-pax-kick { font-size: 9px; color: #9aa89f; font-weight: 700; }
.tk-name { font-size: 15px; font-weight: 800; color: #1e2e26; word-break: keep-all; }
.tk-avs { display: flex; margin-top: 6px; }
.tk-av { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 1.5px solid #fff; flex: none; }
.tk-av + .tk-av { margin-left: -7px; }
.tk-corner { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.tk-badge { background: #d95f5f; color: #fff; font-size: 10px; font-weight: 800; border-radius: 9px; padding: 1px 7px; }
.tk-star { font-size: 17px; cursor: pointer; background: none; border: none; padding: 0; line-height: 1; }
.tk-star:hover { transform: scale(1.15); }
.tk-grid { padding: 4px 15px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; }
.tk-grid.single { display: block; }
.tk-cell-lbl { font-size: 9px; color: #9aa89f; font-weight: 700; }
.tk-cell-val { font-size: 12px; font-weight: 800; color: #1e2e26; }
.tk-cell-val.accent { color: #1b4332; }
.tk-cell-val.empty { display: flex; align-items: center; gap: 5px; font-weight: 700; color: #8a9a5a; margin-top: 1px; }
.tk-perf { position: relative; border-top: 2px dashed #e6dfcf; margin: 0 12px; }
.tk-stub { padding: 9px 15px 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.tk-stub:hover .tk-enter { text-decoration: underline; }

/* 입장 순간 "찍히는" 탑승 스탬프 연출 */
.tk-stamp {
  position: absolute; top: 50%; left: 50%; z-index: 20; pointer-events: none;
  width: 108px; height: 108px; border-radius: 50%;
  border: 3px double #2f7d4f; color: #2f7d4f;
  background: rgba(226, 242, 234, .28);
  box-shadow: inset 0 0 0 5px rgba(47, 125, 79, .10);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  opacity: 0; transform: translate(-50%, -50%) rotate(-15deg) scale(2.6);
}
.tk-stamp .st-main { font-size: 19px; font-weight: 900; letter-spacing: 1px; }
.tk-stamp .st-sub  { font-size: 8.5px; font-weight: 800; letter-spacing: 2px; opacity: .85; }
.tk-stamp.go { animation: tkStampIn .48s cubic-bezier(.2, .85, .25, 1.1) forwards; }
@keyframes tkStampIn {
  0%   { opacity: 0;  transform: translate(-50%, -50%) rotate(-15deg) scale(2.6); }
  55%  { opacity: 1;  transform: translate(-50%, -50%) rotate(-15deg) scale(.88); }
  70%  { transform: translate(-50%, -50%) rotate(-15deg) scale(1.03); }
  100% { opacity: 1;  transform: translate(-50%, -50%) rotate(-15deg) scale(1); }
}
.room-card.stamping .tk-body { animation: tkStampPress .48s ease; }
@keyframes tkStampPress {
  0%, 45% { filter: none; }
  56% { filter: brightness(.93); }
  100% { filter: none; }
}
@media (prefers-reduced-motion: reduce) {
  .tk-stamp.go { animation: none; opacity: 1; transform: translate(-50%, -50%) rotate(-15deg) scale(1); }
}
.tk-barcode { display: flex; align-items: flex-end; gap: 1.5px; height: 20px; }
.tk-barcode i { display: block; width: 2px; height: 20px; background: #2a3a32; }
.tk-enter { font-size: 11px; font-weight: 800; color: #357a58; cursor: pointer; }

/* ==========================================================================
   [개편] A-1 "요청한 방" 섹션 — 가입 신청(수락대기)·거절 카드
   아직 멤버가 아니므로 티켓이 아닌 점선 카드로 구분. 정렬/즐겨찾기/드래그 제외.
   ========================================================================== */
.req-section { margin-bottom: 26px; }
.req-head {
  font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 10px;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--active-bg); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 20px;
}
.req-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 760px) { .req-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .req-grid { grid-template-columns: 1fr; } }
.req-card {
  background: var(--card-bg); border: 1.5px dashed var(--border); border-radius: 16px;
  padding: 15px; display: flex; flex-direction: column; gap: 8px;
}
.req-card.rejected { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
.req-status { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 9px; width: fit-content; display: flex; align-items: center; gap: 4px; }
.req-status.pending { background: #fbeecf; color: #b5851f; }
.req-status.rejected { background: #fdeaea; color: #d95f5f; }
.req-status.expired { background: #eceae2; color: #8a7f66; }
.req-status.vanished { background: #e4edf0; color: #557a86; }
body.dark-mode .req-status.pending { background: #3a331e; color: #e0c169; }
body.dark-mode .req-status.rejected { background: #3a2222; color: #f59a9a; }
body.dark-mode .req-status.expired { background: #2e2c22; color: #c3b98a; }
body.dark-mode .req-status.vanished { background: #213338; color: #9cc4cf; }
.req-card.expired, .req-card.vanished { opacity: .92; }
.req-note { font-size: 11.5px; color: var(--muted); margin-top: -2px; line-height: 1.45; }
.req-name { font-size: 15px; font-weight: 800; color: var(--text); word-break: keep-all; }
.req-meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.req-actions { display: flex; gap: 8px; margin-top: 4px; }
.req-btn {
  flex: 1; height: 36px; border-radius: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer;
  border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text); transition: background .15s, border-color .15s;
}
.req-btn:hover { background: var(--active-bg); border-color: var(--accent); }
.req-btn.primary { background: var(--primary); color: #fff; border: none; }
body.dark-mode .req-btn.primary { color: #0a0f0c; }
.req-btn.primary:hover { opacity: .88; background: var(--primary); }

/* ==========================================================================
   [개편] A-3 "잠자는 방" 섹션 — 마지막 멤버가 나간 30일 보관 방(소프트 삭제)
   ========================================================================== */
.dormant-section { margin-top: 30px; padding-top: 22px; border-top: 1px dashed var(--border); }
