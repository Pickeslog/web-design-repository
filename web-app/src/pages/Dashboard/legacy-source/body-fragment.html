<!-- wm-backdrop 정적 뼈대는 web-app/src/pages/Dashboard/components/WriteModal.jsx로 이식됨(2단계 전환).
     아래 스크립트(openWriteModal/saveWritePost 등)는 그대로 유지 — id로 그 컴포넌트를 찾아 채운다. -->

<script>
(function() {
  let _wmPhotos = [];
  const WM_PHOTO_LIMIT = 15;

  // 약속 연결 상태: 선택된 scheduleId(null=자유 기록) + 목록/새 약속 폼 열림 여부
  let _wmScheduleId = null;
  let _wmPickerOpen = false;
  let _wmNewFormOpen = false;
  let _wmNewScheduleIds = [];

  window.openWriteModal = function() {
    _wmPhotos = [];
    _wmScheduleId = null;
    _wmPickerOpen = false;
    _wmNewFormOpen = false;
    _wmNewScheduleIds = [];
    document.getElementById('wm-title').value = '';
    document.getElementById('wm-body').value = '';
    document.getElementById('wm-tags').value = '';
    document.getElementById('wm-char-count').textContent = '0/25';
    document.getElementById('wm-body-count').textContent = '0/100';
    document.getElementById('wm-img-input').value = '';
    _renderPhotoStrip();
    _buildChips();
    _renderScheduleConnect();
    document.getElementById('wm-backdrop').classList.add('open');
  };

  window.closeWriteModal = function() {
    document.getElementById('wm-backdrop').classList.remove('open');
  };

  function _renderPhotoStrip() {
    const strip = document.getElementById('wm-photo-strip');
    strip.innerHTML = _wmPhotos.map(function(url, index) {
      return '<div class="wm-photo-thumb">' +
        '<img src="' + url + '">' +
        '<button type="button" class="wm-img-remove" onclick="removeWriteImg(' + index + ')">✕</button>' +
        '</div>';
    }).join('') + (_wmPhotos.length < WM_PHOTO_LIMIT
      ? '<button type="button" class="wm-photo-add" onclick="document.getElementById(\'wm-img-input\').click()"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1l1.5-2h7L17 6h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span>추가</span></button>'
      : '');
  }

  window.removeWriteImg = function(index) {
    _wmPhotos.splice(index, 1);
    _renderPhotoStrip();
  };

  // 여러 장을 한 번에 선택할 수 있다. 모두 미리보기로 반영되면
  // desktop.js의 showProofResultModal을 재사용해 업로드 완료를 안내한다.
  window.previewWriteImg = function(input) {
    const files = [...(input.files || [])];
    if (!files.length) return;

    const remaining = WM_PHOTO_LIMIT - _wmPhotos.length;
    if (remaining <= 0) {
      input.value = '';
      clovAlert('사진은 최대 ' + WM_PHOTO_LIMIT + '장까지 추가할 수 있어요.', { icon: '📷', type: 'warn' });
      return;
    }

    // 이미지 파일만, 남은 장수만큼만 압축해서 저장 (localStorage 용량 초과 방지)
    const toLoad = files.slice(0, remaining).filter(function(file) { return file.type.startsWith('image/'); });
    if (!toLoad.length) { input.value = ''; return; }

    let loadedCount = 0;
    toLoad.forEach(function(file) {
      compressMemoryPhoto(file, function(dataUrl) {
        _wmPhotos.push(dataUrl);
        loadedCount += 1;
        if (loadedCount === toLoad.length) {
          input.value = '';
          _renderPhotoStrip();
          if (typeof showProofResultModal === 'function') {
            showProofResultModal({
              title: '이미지 업로드 완료',
              message: toLoad.length + '장의 사진이 추가됐어요.'
            });
          }
        }
      });
    });
  };

  // ── 약속 연결 (선택 · 일정계획에서 가져오기) ─────────────────────
  function _wmSchedules() {
    if (typeof groupsData === 'undefined' || !groupsData[activeGroup]) return [];
    return (groupsData[activeGroup].schedules || [])
      .slice()
      .sort(function(a, b) {
        // 새로 만든 약속(NEW)은 맨 위, 나머지는 가까운 날짜 순
        var aNew = _wmNewScheduleIds.indexOf(a.id) !== -1 ? 0 : 1;
        var bNew = _wmNewScheduleIds.indexOf(b.id) !== -1 ? 0 : 1;
        if (aNew !== bNew) return aNew - bNew;
        return Math.abs(getDdayDiffDays(a.date)) - Math.abs(getDdayDiffDays(b.date));
      });
  }

  function _renderScheduleConnect() {
    var box = document.getElementById('wm-schedule-connect');
    if (!box) return;

    var selected = typeof findScheduleById === 'function' ? findScheduleById(_wmScheduleId) : null;

    // 연결됨 칩 (변경/해제)
    if (selected && !_wmPickerOpen) {
      box.innerHTML =
        '<div class="mp-connect-chip">' +
          '<span class="mp-connect-dday">' + calculateDday(selected.date) + '</span>' +
          '<span class="mp-connect-title">' + escapeHtml(selected.title) + ' <b>· 연결됨</b></span>' +
          '<button type="button" class="mp-connect-btn" onclick="wmOpenSchedulePicker()">변경</button>' +
          '<button type="button" class="mp-connect-btn mp-connect-btn--detach" onclick="wmDetachSchedule()">해제</button>' +
        '</div>';
      return;
    }

    // 목록 펼침 (미니 영수증 카드 + 새 약속 폴백)
    if (_wmPickerOpen) {
      var rows = _wmSchedules().map(function(schedule) {
        var proofCount = typeof getScheduleProofCount === 'function' ? getScheduleProofCount(schedule) : 0;
        var isSelected = _wmScheduleId !== null && String(_wmScheduleId) === String(schedule.id);
        var isNew = _wmNewScheduleIds.indexOf(schedule.id) !== -1;
        return '<button type="button" class="mp-sched-item ' + (isSelected ? 'is-selected' : '') + '" onclick="wmSelectSchedule(\'' + escapeHtml(String(schedule.id)) + '\')">' +
            '<span class="mp-sched-dday">' + calculateDday(schedule.date) + '</span>' +
            '<span class="mp-sched-info">' +
              '<span class="mp-sched-title">' + (isNew ? '<em class="wm-sched-new">NEW</em> ' : '') + escapeHtml(schedule.title) + '</span>' +
              '<span class="mp-sched-4cut ' + (proofCount === 4 ? 'is-done' : '') + '">인생4컷 ' + proofCount + '/4' + (proofCount === 4 ? ' ✓' : '') + '</span>' +
            '</span>' +
            (isSelected ? '<span class="mp-sched-check">✓</span>' : '') +
          '</button>';
      }).join('');

      var newFormHtml = _wmNewFormOpen
        ? '<div class="wm-sched-new-form">' +
            '<input type="text" class="wm-input" id="wm-new-sched-title" maxlength="25" placeholder="약속 이름 (예: 성수 카페 투어)">' +
            '<input type="date" class="wm-input" id="wm-new-sched-date" onclick="this.showPicker && this.showPicker()">' +
            '<div class="wm-sched-new-actions">' +
              '<button type="button" class="mp-connect-cancel" onclick="wmCloseNewScheduleForm()">취소</button>' +
              '<button type="button" class="wm-sched-new-add" onclick="wmCreateSchedule()">추가</button>' +
            '</div>' +
          '</div>'
        : '<button type="button" class="wm-sched-new-open" onclick="wmOpenNewScheduleForm()">＋ 새 약속 만들기</button>';

      box.innerHTML =
        '<div class="mp-sched-list">' + (rows || '<div class="mp-sched-empty">일정계획에 등록된 약속이 없어요</div>') + '</div>' +
        newFormHtml +
        '<button type="button" class="mp-connect-cancel" onclick="wmCloseSchedulePicker()">목록 닫기</button>';

      if (_wmNewFormOpen) {
        var titleInput = document.getElementById('wm-new-sched-title');
        if (titleInput) titleInput.focus();
      }
      return;
    }

    // 기본 상태 (가져오기 전)
    box.innerHTML =
      '<button type="button" class="mp-connect-open" onclick="wmOpenSchedulePicker()">🗓️ 일정계획에서 약속 가져오기</button>' +
      '<div class="mp-connect-hint">연결 안 하면 <b>자유 기록(FREE MEMORY)</b>으로 저장돼요</div>';
  }

  window.wmOpenSchedulePicker = function() { _wmPickerOpen = true; _renderScheduleConnect(); };
  window.wmCloseSchedulePicker = function() { _wmPickerOpen = false; _wmNewFormOpen = false; _renderScheduleConnect(); };
  window.wmSelectSchedule = function(scheduleId) { _wmScheduleId = scheduleId; _wmPickerOpen = false; _wmNewFormOpen = false; _renderScheduleConnect(); };
  window.wmDetachSchedule = function() { _wmScheduleId = null; _wmPickerOpen = false; _renderScheduleConnect(); };
  window.wmOpenNewScheduleForm = function() { _wmNewFormOpen = true; _renderScheduleConnect(); };
  window.wmCloseNewScheduleForm = function() { _wmNewFormOpen = false; _renderScheduleConnect(); };

  // ＋ 새 약속 만들기 폴백: 일정계획에 실제로 생성하고 목록 맨 위(NEW)로 등록·자동 선택
  window.wmCreateSchedule = function() {
    var titleInput = document.getElementById('wm-new-sched-title');
    var dateInput = document.getElementById('wm-new-sched-date');
    var title = (titleInput && titleInput.value || '').trim();
    var date = dateInput ? dateInput.value : '';
    if (!title) { if (titleInput) titleInput.focus(); return; }
    if (!date) { if (dateInput) dateInput.focus(); return; }
    if (typeof groupsData === 'undefined' || !groupsData[activeGroup]) return;

    var group = groupsData[activeGroup];
    if (!Array.isArray(group.schedules)) group.schedules = [];
    var newSchedule = { id: Date.now(), title: title, date: date, content: '' };
    group.schedules.push(newSchedule);
    _wmNewScheduleIds.unshift(newSchedule.id);
    saveGroupsData();

    // 일정계획 탭/배너에도 즉시 반영
    if (typeof renderScheduleList === 'function') { renderScheduleList('dt'); renderScheduleList('mb'); }
    if (typeof updateScheduleUI === 'function') updateScheduleUI();

    _wmScheduleId = newSchedule.id;
    _wmPickerOpen = false;
    _wmNewFormOpen = false;
    _renderScheduleConnect();
    if (typeof clovToast === 'function') clovToast('🗓️ 새 약속이 일정계획에 등록되고 연결됐어요!', 'success');
  };

  // 참여자 칩은 "함께한 친구"만 고른다. 게시자(나)는 항상 자동 포함되므로 칩 목록에는 넣지 않는다.
  function _buildChips() {
    const posts = (typeof groupsData !== 'undefined' && groupsData[activeGroup]) ? (groupsData[activeGroup].posts || []) : [];
    const seen = new Map();
    posts.forEach(function(post) {
      (post.participants || []).forEach(function(p) {
        if (p.type === 'mine' || p.name === '나') return;
        const key = p.name || p.icon;
        if (!seen.has(key)) seen.set(key, p);
      });
    });
    const container = document.getElementById('wm-chips');
    const chips = [...seen.values()];
    container.innerHTML = chips.length ? chips.map(function(m) {
      const icon = (m.icon || (m.name || '?').slice(0, 1));
      const name = m.name || icon;
      return '<label class="wm-chip on"' +
        ' data-name="' + name + '"' +
        ' data-icon="' + icon + '">' +
        '<div class="wm-chip-av">' + icon + '</div>' + name + '</label>';
    }).join('') : '<span class="wm-label" style="text-transform:none;letter-spacing:0;">아직 함께 기록한 친구가 없어요. 나 혼자만의 기록으로 남길 수 있어요.</span>';
    container.querySelectorAll('.wm-chip').forEach(function(chip) {
      chip.addEventListener('click', function() { chip.classList.toggle('on'); });
    });
  }

  // 게시자(authorId) + 친구 한 줄 메시지(messages[]) 모델에 맞춰 새 게시글을 만든다.
  // 참여자 선택은 "누구와 함께였는지"만 기록하고, 각자의 글은 더 이상 여기서 받지 않는다
  // (친구는 상세 모달에서 자기 메시지를 직접 남긴다).
  window.saveWritePost = function() {
    const title = document.getElementById('wm-title').value.trim();
    const body  = document.getElementById('wm-body').value.trim();
    if (!title) { document.getElementById('wm-title').focus(); return; }
    if (!body)  { document.getElementById('wm-body').focus(); return; }

    const selected = [...document.querySelectorAll('#wm-chips .wm-chip.on')];

    const tagsInput = document.getElementById('wm-tags').value.trim();
    const tags = tagsInput
      ? [...new Set(
          tagsInput.split(/[\s,]+/)
            .map(function(tag) { return tag.trim(); })
            .filter(Boolean)
            .map(function(tag) { return tag.startsWith('#') ? tag : '#' + tag; })
        )].slice(0, 5)
      : [];

    const today = new Date();
    const pad = function(n) { return String(n).padStart(2, '0'); };
    const dateStr = today.getFullYear() + '.' + pad(today.getMonth() + 1) + '.' + pad(today.getDate());

    const participants = [
      { name: '나', icon: '나', type: 'mine' },
      ...selected.map(function(chip) {
        return { name: chip.dataset.name, icon: chip.dataset.icon, type: 'friend' };
      })
    ];

    const newPost = {
      date: dateStr,
      title: title,
      subtitle: '',
      text: body,
      photos: _wmPhotos.slice(),
      bg: _wmPhotos[0] || '',
      authorId: CURRENT_USER_ID,
      messages: [],
      participants: participants,
      tags: tags,
      scheduleId: _wmScheduleId, // 약속 연결 (null = 자유 기록 FREE MEMORY)
    };

    if (typeof groupsData !== 'undefined' && groupsData[activeGroup]) {
      groupsData[activeGroup].posts.unshift(newPost);
      activeEvidenceIndexes[activeGroup] = 0;

      // 용량 초과 시 토스트 없이 조용히 저장을 시도하고 성공 여부만 반환 (재시도 중 토스트 노이즈 방지)
      var trySaveGroups = function() {
        try { localStorage.setItem('clov_groupsData', JSON.stringify(groupsData)); return true; }
        catch (e) { return false; }
      };

      // 저장 성공 후 처리 — 피드 갱신 + 경험치 지급 + 모달 닫기
      var finishWriteSaved = function() {
        renderFeeds();
        // 추억 기록 시 경험치 지급 (kimgyubi XP 이식). 이 경로는 ClovData.addPost를 거치지 않으므로
        // 여기서 직접 grantXP('post')를 호출한다. XP 계산식은 addPost와 동일(기본+사진+정성 보너스).
        if (typeof grantXP === 'function') {
          var postXp = (typeof CLOV_XP_POST_BASE !== 'undefined') ? CLOV_XP_POST_BASE : 25;
          var perPhoto = (typeof CLOV_XP_POST_PER_PHOTO !== 'undefined') ? CLOV_XP_POST_PER_PHOTO : 1;
          var maxPhoto = (typeof CLOV_XP_POST_PHOTO_MAX !== 'undefined') ? CLOV_XP_POST_PHOTO_MAX : 10;
          postXp += Math.min((newPost.photos ? newPost.photos.length : 0) * perPhoto, maxPhoto);
          var textLen = (newPost.text || '').replace(/<[^>]*>/g, '').length;
          if (textLen >= 100) postXp += (typeof CLOV_XP_POST_TEXT_100 !== 'undefined') ? CLOV_XP_POST_TEXT_100 : 10;
          else if (textLen >= 50) postXp += (typeof CLOV_XP_POST_TEXT_50 !== 'undefined') ? CLOV_XP_POST_TEXT_50 : 5;
          grantXP(postXp, 'post');
        }
        window.closeWriteModal();
      };

      if (trySaveGroups()) { finishWriteSaved(); return; }

      // 1차 저장 실패(용량 초과) → 기존에 저장된 사진들을 재압축해 공간을 회수하고 1회 재시도
      var recover = (typeof compactStoredPhotos === 'function') ? compactStoredPhotos() : Promise.resolve();
      recover.then(function() {
        if (trySaveGroups()) { finishWriteSaved(); return; }
        // 재압축해도 공간 부족 → 방금 추가한 글 롤백(유령 글 방지) + 안내 후 모달 닫기
        groupsData[activeGroup].posts.shift();
        renderFeeds();
        if (typeof clovAlert === 'function') {
          clovAlert('저장 공간이 부족해 기록을 저장하지 못했어요.\n기존 사진을 정리했는데도 공간이 부족해요. 오래된 추억이나 사진을 지운 뒤 다시 시도해 주세요.', { icon: '💾', type: 'warn' });
        }
        window.closeWriteModal();
      });
      return;
    }
    window.closeWriteModal();
  };
})();
</script>

          <div class="noti-card-body">일대일 단짝 연동 기능과 다크 모드 동기화 기능이 대폭 개선되었습니다. 더욱 안정적인 환경에서 소중한 추억을 기록해 보세요.</div>

<script>
(function(){
  window.openNotiModal = function() {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
    var pending = list.filter(function(r) { return r.status === 'pending'; }).length;
    if (pending > 0) {
      switchNotiTab('join');
    } else {
      switchNotiTab('admin');
    }
    document.getElementById('noti-backdrop').classList.add('open');
  };
  window.closeNotiModal = function() {
    document.getElementById('noti-backdrop').classList.remove('open');
  };
  window.switchNotiTab = function(tab) {
    document.getElementById('noti-tab-admin').classList.toggle('on', tab === 'admin');
    document.getElementById('noti-tab-friends').classList.toggle('on', tab === 'friends');
    var tabJoin = document.getElementById('noti-tab-join');
    if (tabJoin) tabJoin.classList.toggle('on', tab === 'join');

    document.getElementById('noti-admin').style.display   = tab === 'admin' ? '' : 'none';
    document.getElementById('noti-friends').style.display = tab === 'friends' ? '' : 'none';
    var elJoin = document.getElementById('noti-join');
    if (elJoin) elJoin.style.display = tab === 'join' ? '' : 'none';

    if (tab === 'friends') renderFriendsNoti();
    if (tab === 'join') renderJoinRequestsNoti();
  };
  function renderFriendsNoti() {
    var el = document.getElementById('noti-friends');
    var groupsData = {};
    try { groupsData = JSON.parse(localStorage.getItem('clov_groupsData')) || {}; } catch(e) {}
    var ag = (window._clov && typeof activeGroup !== 'undefined') ? activeGroup : (localStorage.getItem('clov_activeGroup') || 'friend');
    var list = (groupsData[ag] && groupsData[ag].notifications) ? groupsData[ag].notifications : [];
    
    var reqList = [];
    try { reqList = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
    var pendingReqs = reqList.filter(function(r) { return r.status === 'pending'; });
    var joinBanner = '';
    if (pendingReqs.length > 0) {
      joinBanner = '<div class="noti-friend-card unread" style="border: 1.5px solid #e55; background: rgba(238,85,85,.08); cursor: pointer; margin-bottom: 12px;" onclick="switchNotiTab(\'join\')">' +
        '<div style="font-size:13px;font-weight:800;color:#e55;display:flex;align-items:center;justify-content:space-between;">' +
          '<span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.2 2.8-5.5 6.5-5.5s6.5 2.3 6.5 5.5"/><path d="M18 9v5M20.5 11.5h-5"/></svg>대기 중인 가입 신청이 ' + pendingReqs.length + '건 있습니다! <span class="noti-badge" style="background:#e55;color:#fff;padding:2px 6px;border-radius:10px;">클릭하여 확인</span></span>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--text-color);margin-top:4px;">참여 멤버 중 1명이 수락하면 새 멤버가 입장합니다.</div>' +
      '</div>';
    }

    if (!list.length && !pendingReqs.length) {
      el.innerHTML = '<div class="noti-empty"><div class="noti-empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 14l9-5.5"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg></div>새로운 친구 알림이 없습니다.</div>';
      return;
    }
    var friendsHtml = list.map(function(n) {
      return '<div class="noti-friend-card' + (n.isRead ? '' : ' unread') + '">' +
        '<div style="font-size:13px;font-weight:700;color:var(--text-color)">' + n.title + (n.isRead ? '' : '<span class="noti-badge">NEW</span>') + '</div>' +
        '<div style="font-size:12px;color:var(--text-muted);margin:4px 0 6px;line-height:1.5">' + n.message + '</div>' +
        '<div style="font-size:11px;color:var(--text-muted)">' + n.date + '</div>' +
        '</div>';
    }).join('');
    el.innerHTML = joinBanner + friendsHtml;
  }

  // 거절은 "영구 반영"이 아니라 세션 동안만 유지되는 임시 상태로 처리한다.
  // (새로고침하면 다시 pending으로 리셋됨 — localStorage에는 절대 쓰지 않음)
  var notiSessionOverrides = {};

  // A-5 P1: 수락 후 5분 되돌리기 창 (강퇴가 없으므로 "방금 실수"를 되돌리는 유일한 안전장치)
  var UNDO_WINDOW_MS = 5 * 60 * 1000;
  function fmtCountdown(ms) {
    if (ms < 0) ms = 0;
    var s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
    s = s % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  var __undoTicker = null;
  function ensureUndoTicker() {
    if (__undoTicker) return;
    __undoTicker = setInterval(function() {
      var spans = document.querySelectorAll('.undo-countdown');
      if (!spans.length) { clearInterval(__undoTicker); __undoTicker = null; return; }
      var anyLive = false, expired = false;
      spans.forEach(function(sp) {
        var left = (+sp.getAttribute('data-until')) - Date.now();
        if (left <= 0) { sp.textContent = '0:00'; expired = true; }
        else { sp.textContent = fmtCountdown(left); anyLive = true; }
      });
      if (expired && typeof renderJoinRequestsNoti === 'function') renderJoinRequestsNoti();
      if (!anyLive) { clearInterval(__undoTicker); __undoTicker = null; }
    }, 1000);
  }

  window.renderJoinRequestsNoti = function() {
    var el = document.getElementById('noti-join');
    if (!el) return;
    var list = [];
    try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
    var pending = list.filter(function(r) { return (notiSessionOverrides[r.id] || r.status) === 'pending'; });

    var badge = document.getElementById('noti-join-count');
    if (badge) {
      badge.textContent = pending.length;
      badge.style.display = pending.length > 0 ? 'inline-block' : 'none';
    }
    updateHeaderNotiBadge();

    if (!list.length) {
      el.innerHTML = '<div class="noti-empty"><div class="noti-empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 14l9-5.5"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg></div>대기 중인 가입 신청이 없습니다.<br><span style="font-size:11px; color:var(--text-muted); margin-top:8px; display:inline-block;">참여 멤버 모달의 [가입 신청 테스트] 버튼으로 신청을 생성해보세요!</span></div>';
      return;
    }

    el.innerHTML = list.map(function(req) {
      var effectiveStatus = notiSessionOverrides[req.id] || req.status;
      if (effectiveStatus === 'accepted') {
        // 수락 후 5분 이내 → 되돌리기 창 카드
        if (req.acceptedAt && (Date.now() - req.acceptedAt < UNDO_WINDOW_MS)) {
          var until = req.acceptedAt + UNDO_WINDOW_MS;
          return '<div class="noti-friend-card" style="border:1.5px solid var(--primary-green); background:rgba(82,183,136,.07);">' +
            '<div style="font-size:13px; font-weight:800; color:var(--primary-green); display:flex; align-items:center; justify-content:space-between;">' +
              '<span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><path d="M20 6 9 17l-5-5"/></svg><b>' + req.name + '</b>님 수락함</span>' +
              '<span style="font-size:11px; color:var(--text-muted); font-weight:700;">되돌리기 <span class="undo-countdown" data-until="' + until + '">' + fmtCountdown(until - Date.now()) + '</span></span>' +
            '</div>' +
            '<div style="font-size:12px; color:var(--text-muted); margin:7px 0 10px; line-height:1.5;">실수로 수락했다면 5분 안에 되돌릴 수 있어요. 방장이 없으니 강퇴 대신 <b>되돌리기</b>로만 취소해요.</div>' +
            '<button type="button" onclick="undoAcceptJoinRequest(\'' + req.id + '\', \'' + req.name + '\')" style="width:100%; padding:9px; background:var(--bg-light); color:var(--text-color); border:1px solid var(--border-color); border-radius:10px; font-weight:700; cursor:pointer; font-size:13px;">되돌리기</button>' +
          '</div>';
        }
        return '<div class="noti-friend-card" style="border: 1px solid var(--border-color); background: var(--bg-light); opacity: 0.85;">' +
          '<div style="font-size:13px; font-weight:700; color:var(--text-muted); display:flex; align-items:center; justify-content:space-between;">' +
            '<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px;"><path d="M20 6 9 17l-5-5"/></svg>가입 수락 완료</span>' +
            '<div style="display:flex; align-items:center; gap:8px;">' +
              '<span style="font-size:11px;">' + req.date + '</span>' +
              '<button type="button" onclick="deleteJoinRequest(\'' + req.id + '\')" style="background:none; border:none; color:var(--text-muted); font-size:11px; text-decoration:underline; cursor:pointer; padding:0;">삭제</button>' +
            '</div>' +
          '</div>' +
          '<div style="font-size:13px; color:var(--text-color); margin:8px 0 4px;"><b>' + req.name + '</b> 님이 참여 멤버로 합류했습니다.</div>' +
        '</div>';
      }
      if (effectiveStatus === 'rejected') {
        return '<div class="noti-friend-card" style="border: 1px solid var(--border-color); background: var(--bg-light); opacity: 0.6;">' +
          '<div style="font-size:13px; font-weight:700; color:var(--text-muted); display:flex; align-items:center; justify-content:space-between;">' +
            '<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px;"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg>가입 거절됨</span>' +
            '<div style="display:flex; align-items:center; gap:8px;">' +
              '<span style="font-size:11px;">' + req.date + '</span>' +
              '<button type="button" onclick="deleteJoinRequest(\'' + req.id + '\')" style="background:none; border:none; color:var(--text-muted); font-size:11px; text-decoration:underline; cursor:pointer; padding:0;">삭제</button>' +
            '</div>' +
          '</div>' +
          '<div style="font-size:13px; color:var(--text-muted); margin:8px 0 4px;"><b>' + req.name + '</b> 님의 가입 신청이 거절되었습니다.</div>' +
        '</div>';
      }
      return '<div class="noti-friend-card unread" id="req-card-' + req.id + '" style="border: 1.5px solid var(--primary-green); background: rgba(82,183,136,.08); padding: 14px 16px;">' +
        '<div style="font-size:14px; font-weight:800; color:var(--primary-green); display:flex; align-items:center; justify-content:space-between; margin-bottom: 6px;">' +
          '<span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.2 2.8-5.5 6.5-5.5s6.5 2.3 6.5 5.5"/><path d="M18 9v5M20.5 11.5h-5"/></svg>우정공간 가입 신청 <span class="noti-badge" style="background:#e55; color:#fff; padding:2px 6px; border-radius:10px; font-size:10px;">NEW</span></span>' +
          '<span style="font-size:11px; color:var(--text-muted); font-weight:normal;">' + req.date + '</span>' +
        '</div>' +
        '<div style="font-size:13px; color:var(--text-color); margin:8px 0 12px; line-height:1.5;">' +
          '<strong style="font-size:15px; color:var(--text-color);">' + req.name + '</strong> 님이 우정공간(<strong>' + req.code + '</strong>) 입장을 신청했습니다.<br>' +
          '<span style="display:inline-flex; align-items:center; gap:5px; margin-top:5px; font-size:12px; color:var(--text-muted);">' +
            (req.invitedBy
              ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><strong style="color:var(--primary-green)">' + req.invitedBy + '</strong>님 초대로 신청'
              : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.5 12.5 20 3l1.5 1.5-2 2 1.5 1.5-2 2-1.5-1.5"/></svg>코드로 직접 신청') +
          '</span>' +
          '<div style="margin-top:6px; padding:8px 12px; background:rgba(27,67,50,.06); border-radius:8px; font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:6px;">' +
            '<span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg></span> <span><strong>방장 권한 없음:</strong> 참여 멤버 중 1명만 수락해도 즉시 방에 입장할 수 있습니다.</span>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex; gap:8px; margin-top:12px;">' +
          '<button onclick="acceptJoinRequest(\'' + req.id + '\', \'' + req.name + '\')" style="flex:1; padding:10px; background:var(--primary-green); color:#fff; border:none; border-radius:10px; font-weight:750; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; box-shadow:0 3px 10px rgba(27,67,50,.25); transition:transform .15s;">' +
            '<span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;"><path d="M20 6 9 17l-5-5"/></svg>수락하고 입장시키기</span>' +
          '</button>' +
          '<button onclick="rejectJoinRequest(\'' + req.id + '\', \'' + req.name + '\')" style="padding:10px 16px; background:var(--bg-light); color:var(--text-muted); border:1px solid var(--border-color); border-radius:10px; font-weight:600; cursor:pointer; font-size:13px; transition:background .15s;">' +
            '거절' +
          '</button>' +
        '</div>' +
      '</div>';
    }).join('');
    if (document.querySelector('.undo-countdown')) ensureUndoTicker();
  };

  window.acceptJoinRequest = function(id, name) {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
    // A-7 경합: 이미 다른 멤버가 수락/거절한 신청이면 늦은 클릭은 무효
    var reqA = null; for (var k = 0; k < list.length; k++) { if (list[k].id === id) { reqA = list[k]; break; } }
    var effA = reqA ? (notiSessionOverrides[id] || reqA.status) : null;
    if (!reqA || effA !== 'pending') {
      if (typeof clovToast === 'function') clovToast('이미 처리된 신청이에요 (다른 멤버가 먼저 처리했어요) 🙌', 'info');
      renderJoinRequestsNoti();
      return;
    }
    list.forEach(function(r) { if (r.id === id) { r.status = 'accepted'; r.acceptedAt = Date.now(); } });
    localStorage.setItem('clov_joinRequests', JSON.stringify(list));

    var members = [];
    try { members = JSON.parse(localStorage.getItem('clov_acceptedMembers')) || []; } catch(e){}
    if (members.indexOf(name) === -1) {
      members.push(name);
      localStorage.setItem('clov_acceptedMembers', JSON.stringify(members));
    }

    renderJoinRequestsNoti();
    updateDynamicMembersDisplay();
    ensureUndoTicker();   // 5분 되돌리기 카운트다운 시작

    // 큰 alert 대신 가벼운 토스트 — 되돌리기 안내는 카드에 카운트다운으로 표시됨
    if (typeof clovToast === 'function') {
      clovToast('[' + name + '] 님을 수락했어요 · 5분 안에 되돌릴 수 있어요 🤝', 'success');
    } else if (typeof clovAlert === 'function') {
      clovAlert('🎉 [' + name + '] 님의 가입 신청을 수락했습니다! (5분 안에 되돌리기 가능)', { icon: '🤝', type: 'success' });
    }
  };

  // A-5 P1: 수락 5분 이내 되돌리기 — pending으로 복원 + 멤버에서 제거
  window.undoAcceptJoinRequest = function(id, name) {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
    list.forEach(function(r) { if (r.id === id) { r.status = 'pending'; delete r.acceptedAt; } });
    localStorage.setItem('clov_joinRequests', JSON.stringify(list));

    var members = [];
    try { members = JSON.parse(localStorage.getItem('clov_acceptedMembers')) || []; } catch(e){}
    var i = members.indexOf(name);
    if (i !== -1) { members.splice(i, 1); localStorage.setItem('clov_acceptedMembers', JSON.stringify(members)); }

    renderJoinRequestsNoti();
    updateDynamicMembersDisplay();

    if (typeof clovToast === 'function') {
      clovToast('[' + name + '] 수락을 되돌렸어요 · 다시 대기 상태예요 ↩️', 'info');
    } else if (typeof clovAlert === 'function') {
      clovAlert('[' + name + '] 수락을 되돌렸습니다. 다시 대기 상태로 돌아갔어요.', { icon: '↩️', type: 'info' });
    }
  };

  window.rejectJoinRequest = function(id, name) {
    // A-7 경합: 이미 다른 멤버가 수락/거절한 신청이면 늦은 클릭은 무효
    var reqR = [];
    try { reqR = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
    var rr = null; for (var k = 0; k < reqR.length; k++) { if (reqR[k].id === id) { rr = reqR[k]; break; } }
    var effR = rr ? (notiSessionOverrides[id] || rr.status) : null;
    if (!rr || effR !== 'pending') {
      if (typeof clovToast === 'function') clovToast('이미 처리된 신청이에요 (다른 멤버가 먼저 처리했어요) 🙌', 'info');
      renderJoinRequestsNoti();
      return;
    }
    // localStorage에는 쓰지 않고 세션 메모리에만 '거절됨'으로 표시 — 새로고침하면 다시 대기중으로 돌아온다
    notiSessionOverrides[id] = 'rejected';
    renderJoinRequestsNoti();
    if (typeof clovAlert === 'function') {
      clovAlert('❌ [' + name + '] 님의 가입 신청을 거절했습니다. (새로고침하면 다시 대기 상태로 돌아와요)', { icon: '🚫', type: 'warn' });
    }
  };

  window.deleteJoinRequest = function(id) {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
    list = list.filter(function(r) { return r.id !== id; });
    localStorage.setItem('clov_joinRequests', JSON.stringify(list));
    delete notiSessionOverrides[id];
    renderJoinRequestsNoti();
  };

  window.simulateJoinRequest = function() {
    var sampleNames = ['김도현', '이서연', '박지훈', '최유진', '정우진', '강한나', '조민수'];
    var name = sampleNames[Math.floor(Math.random() * sampleNames.length)];
    // P1: 초대 경로 — 기존 멤버의 초대(링크)로 왔는지 / 코드로 직접 왔는지
    var inviterPool = ['강한나', '박서준', '이서연', null, null];
    var invitedBy = inviterPool[Math.floor(Math.random() * inviterPool.length)];
    if (invitedBy === name) invitedBy = null;
    var list = [];
    try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
    var codeEl = document.getElementById('member-modal-room-code');
    var code = codeEl ? codeEl.textContent : 'CLOV-2002';
    list.unshift({
      id: 'req_' + Date.now(),
      name: name,
      code: code,
      date: '방금 전',
      status: 'pending',
      invitedBy: invitedBy
    });
    localStorage.setItem('clov_joinRequests', JSON.stringify(list));
    updateHeaderNotiBadge();

    if (typeof clovAlert === 'function') {
      clovAlert('🙋‍♂️ [' + name + '] 님이 우정공간(' + code + ') 가입을 신청했습니다!\n상단 [🔔 알림] 버튼을 누르시면 [🤝 가입 신청] 탭에서 확인하고 수락할 수 있습니다.\n(방장이 없으므로 참여 멤버 중 1명만 수락하면 입장 가능)', { icon: '🔔', type: 'info' });
    }
  };

  // 참여 멤버 중 1명이 방을 나간 상황을 시뮬레이션 — 나머지 멤버들에게 퇴장 알림을 남긴다
  window.simulateMemberLeave = function() {
    var members = [];
    try { members = JSON.parse(localStorage.getItem('clov_acceptedMembers')) || []; } catch(e){}
    if (!members.length) {
      if (typeof clovAlert === 'function') {
        clovAlert('퇴장할 참여 멤버가 없습니다.\n먼저 [🙋‍♂️ 가입 신청 테스트]로 새 멤버를 받아보세요!', { icon: '👋', type: 'warn' });
      }
      return;
    }
    var idx = Math.floor(Math.random() * members.length);
    var name = members[idx];
    members.splice(idx, 1);
    localStorage.setItem('clov_acceptedMembers', JSON.stringify(members));
    if (typeof updateDynamicMembersDisplay === 'function') updateDynamicMembersDisplay();

    var roomName = (typeof groupsData !== 'undefined' && groupsData[activeGroup] && groupsData[activeGroup].name) ? groupsData[activeGroup].name : '우정공간';
    if (typeof groupsData !== 'undefined' && groupsData[activeGroup]) {
      var notifications = groupsData[activeGroup].notifications = groupsData[activeGroup].notifications || [];
      notifications.unshift({
        title: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:3px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>멤버 퇴장',
        message: name + '님이 ' + roomName + '에서 나갔습니다.',
        date: '방금 전',
        isRead: false
      });
      localStorage.setItem('clov_groupsData', JSON.stringify(groupsData));
    }

    var friendsEl = document.getElementById('noti-friends');
    if (friendsEl && friendsEl.style.display !== 'none' && typeof renderFriendsNoti === 'function') {
      renderFriendsNoti();
    }

    if (typeof clovAlert === 'function') {
      clovAlert('👋 [' + name + ']님이 ' + roomName + '에서 나갔습니다.\n상단 [🔔 알림] 버튼을 누르시면 [🔔 친구들 알림] 탭에서 확인할 수 있습니다.', { icon: '🔔', type: 'info' });
    }
  };

  window.updateDynamicMembersDisplay = function() {
    var members = [];
    try { members = JSON.parse(localStorage.getItem('clov_acceptedMembers')) || []; } catch(e){}
    var totalCount = 4 + members.length;
    var titleEl = document.getElementById('member-list-modal-title');
    if (titleEl) titleEl.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px;"><circle cx="8" cy="8" r="3"/><path d="M2 20c0-3 2.5-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.3"/><path d="M15.2 14.6c2.3.5 3.6 2 3.8 4.4"/></svg>참여 멤버 상태메시지 (' + totalCount + '명)';

    document.querySelectorAll('.member-count-text').forEach(function(el) {
      el.textContent = totalCount + '명 함께하는 중';
    });

    // 신규 참여 멤버 프로필(아바타)을 커버 상단 스택 + 카운트 옆 겹침 아바타에 반영
    var avatarColors = ['#40916c', '#2d6a4f', '#52b788', '#74c69d', '#1b4332'];
    document.querySelectorAll('.cover-avatar-stack').forEach(function(stack) {
      stack.querySelectorAll('.dyn-member-avatar').forEach(function(n) { n.remove(); });
      members.forEach(function(name, idx) {
        var s = document.createElement('span');
        s.className = 'cover-avatar dyn-member-avatar';
        s.textContent = name.charAt(0);
        s.title = name;
        s.style.background = avatarColors[idx % avatarColors.length];
        stack.appendChild(s);
      });
    });
    document.querySelectorAll('.member-mini-avatars').forEach(function(row) {
      row.querySelectorAll('.dyn-member-avatar').forEach(function(n) { n.remove(); });
      members.forEach(function(name, idx) {
        var d = document.createElement('div');
        d.className = 'dyn-member-avatar';
        d.textContent = name.charAt(0);
        d.title = name;
        d.style.cssText = 'width:30px;height:30px;border-radius:50%;background:' + avatarColors[idx % avatarColors.length] + ';color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1.5px solid white;margin-left:-8px;';
        row.appendChild(d);
      });
    });

    var container = document.getElementById('dynamic-members-container');
    if (!container) return;
    if (!members.length) { container.innerHTML = ''; return; }

    container.innerHTML = members.map(function(name, idx) {
      var colors = ['#40916c', '#2d6a4f', '#52b788', '#74c69d', '#1b4332'];
      var bg = colors[idx % colors.length];
      return '<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(248, 251, 249, 0.85); border-radius: 16px; border: 1.5px solid rgba(82, 183, 136, 0.45); flex-shrink: 0; animation: wm-rise 0.25s ease;">' +
        '<div style="display: flex; align-items: center; gap: 14px;">' +
          '<div style="width: 44px; height: 44px; border-radius: 50%; background: ' + bg + '; color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">' + name.charAt(0) + '</div>' +
          '<div>' +
            '<span style="font-weight: 800; font-size: 15px; color: var(--text-color);">' + name + '</span>' +
            '<span style="font-size: 11px; color: #fff; background: var(--primary-green); padding: 2px 6px; border-radius: 8px; margin-left: 6px; font-weight: 700;">신규 참여</span>' +
          '</div>' +
        '</div>' +
        '<div style="background: rgba(0, 0, 0, 0.04); padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(0, 0, 0, 0.06); max-width: 270px;">' +
          '<span style="font-size: 13px; color: #444; font-weight: 600;">반가워요! 새로 합류했습니다 👋</span>' +
        '</div>' +
      '</div>';
    }).join('');
  };

  window.updateHeaderNotiBadge = function() {
    var list = [];
    try { list = JSON.parse(localStorage.getItem('clov_joinRequests')) || []; } catch(e){}
    var pending = list.filter(function(r) { return r.status === 'pending'; }).length;
    var btn = document.getElementById('dt-nav-noti') || document.querySelector('[onclick="openNotiModal()"]');
    if (btn) {
      if (pending > 0) {
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span style="position:absolute;top:4px;right:4px;background:#e55;color:#fff;width:16px;height:16px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.2);">' + pending + '</span>';
        btn.style.position = 'relative';
      } else {
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
      }
    }
    var badge = document.getElementById('noti-join-count');
    if (badge) {
      badge.textContent = pending;
      badge.style.display = pending > 0 ? 'inline-block' : 'none';
    }
  };

  document.addEventListener('DOMContentLoaded', function() {
    updateDynamicMembersDisplay();
    updateHeaderNotiBadge();
  });
  updateDynamicMembersDisplay();
  updateHeaderNotiBadge();

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeNotiModal();
  });
})();
</script>
